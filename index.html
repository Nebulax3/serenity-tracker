 party has started to recover around the est. timing windows. \n\neg. last month: \"Multiple short sellers told them they will likely close their positions... late July and early August\". \n\nThey might have missed that they believed $AMD would be $AAOI's first CPO customer... since AAOI said they would be missing from first-gen CPO (maybe future gen?)\n\nBut lot of their talking points about China CPO laser positioning (eg. 2-3 years behind) got corroborated word-for-word from AAOI earnings today.","zh":"我平常都在酸賣方，但 Rosenblatt 對光通訊個股的通路查訪真的很神，他們的報告是少數我願意拿出來談的。\n\n$AAOI、$LITE、$SIVE，還有整場雷射派對，已經在預估的時間窗附近開始復甦了。\n\n例如上個月：「多位放空者告訴他們，很可能會在 7 月底到 8 月初回補部位」。\n\n他們可能漏掉的一點是，他們原本認為 $AMD 會是 $AAOI 的第一個 CPO 客戶⋯⋯但 AAOI 說他們會缺席第一代 CPO（也許是未來世代？）\n\n不過他們關於中國 CPO 雷射定位的許多說法（例如落後 2-3 年），今天在 AAOI 財報上被一字不差地印證了。","likes":1653,"views":382924,"reposts":97,"q":null},{"id":"2085644051446108223","ts":"2026-08-07T08:27:45.000Z","url":"https://x.com/aleabitoreddit/status/2085644051446108223","text":"Unitree, China's humanoid leader, is set to IPO this month at a $9B valuation! (~$6.2B originally per March filing). \n\nDerivative markets are pricing open at an implied $36.04B MC, roughly ~4X listing price. \n\n$CCXI / Agility Robotics, the first US publicly listed pure play humanoid leader, is also going public later in Q4, at a ~$2.5B pre-money valuation.\n\nIt will be interesting to see how markets price in America vs. Chinese Humanoid leaders.","zh":"中國人形機器人龍頭宇樹科技，將於本月以 90 億美元估值 IPO！（3 月申報文件原本約為 62 億美元。）\n\n衍生性商品市場的定價則隱含開盤市值 360.4 億美元，約為掛牌價的 4 倍。\n\n$CCXI／Agility Robotics，也就是美國第一家公開上市的純人形機器人龍頭，也將在第四季以約 25 億美元的投前估值掛牌。\n\n很好奇市場會怎麼為美國與中國的人形機器人龍頭定價。","likes":1039,"views":276612,"reposts":84,"q":null},{"id":"2085628664528662818","ts":"2026-08-07T07:26:37.000Z","url":"https://x.com/aleabitoreddit/status/2085628664528662818","text":"Earlier today, optical interconnect company Lumilens \"emerges from stealth\" at a $5.5B valuation, after raising $700m.\n\nJust as a recap from $POET / $SIVE Linkedin OSINT mapping I shared earlier, Lumilens was supplying a top 3 hyperscaler customer. \n\nSo we got confirmation of that a month later, along with the material figure that Lumilens has a \"multi-billion-dollar customer agreement\". \n\nAnd just for reference, $POET has existing contracts with Lumilens ($50m purchase order, up to $500m) + contracts with $SIVE (depending on product lines). \n\nI actually took tiny positions in POET again after reading this news, since it finally gives them visibility into extremely well funded hyperscaler suppliers (on top of Poet's really large balance sheet). \n\nBut TLDR: \n> Lumilens around similar (or even higher) valuations as Lightmatter/Ayar, bigger than markets thought with hyperscaler customers. \n> nice read through upstream on $POET (derisking) /  $SIVE.\n> Great for optical valuations in general, seeing a company go to $5.5B in 2 years.","zh":"今天稍早，光互連公司 Lumilens 在募得 7 億美元後，以 55 億美元的估值「走出隱形模式」。\n\n回顧一下我先前分享的 $POET／$SIVE LinkedIn 公開情報比對：Lumilens 當時就在供貨給一家前三大的超大規模業者客戶。\n\n所以一個月後我們得到了證實，而且還加上 Lumilens 擁有「數十億美元客戶協議」這個實質數字。\n\n作為參考，$POET 與 Lumilens 有既有合約（5,000 萬美元採購訂單，最高可達 5 億美元），也與 $SIVE 有合約（視產品線而定）。\n\n看完這則消息後，我其實又建立了一點 POET 的小部位，因為這終於讓他們對資金極為充裕的超大規模業者供應商有了能見度（再加上 Poet 本來就有非常龐大的資產負債表）。\n\n總結：\n> Lumilens 的估值與 Lightmatter／Ayar 相當（甚至更高），而且有超大規模客戶，規模比市場想的更大。\n> 對上游的 $POET（風險下降）／$SIVE 是不錯的讀數。\n> 整體而言對光通訊估值是好事，看到一家公司兩年內做到 55 億美元。","likes":863,"views":244373,"reposts":66,"q":null},{"id":"2085603590903902621","ts":"2026-08-07T05:46:59.000Z","url":"https://x.com/aleabitoreddit/status/2085603590903902621","text":"Wow, there's gem after gem in $AAOI earnings for $SIVE + other laser player readthrough.\n\n1. AAOI not meaningfully participating in CPO first-gen deployments.\n\n\"We just can’t make enough of them [CPO lasers] to be involved in their current first-generation [CPO] deployments because there’s just not enough capacity.   We have to prioritize our ability to make lasers for our own  transceivers first\"\n\nSo first-gen CPO laser deployments, might even be narrowed down further for Western players like $SIVE, $LITE, $AVGO, and $COHR.\n\nAnd independent CPO CW laser capacity became more valuable if $AAOI had to turn away more customers...\n\nAlso remember Trendforce was talking about $AMD singing CW LTAs? $COHR / $LITE have capacity signed with $NVDA ...\n\nI thought it would be $AAOI, but they might be out of the equation. $MTSI also doesn't look meaningful with early CPO participation (eg. no mention in ER aside from NPO, and removal from Ayar website).\n\nSo I wonder who players like $AMD is going to go with for Helios (eg. Sivers + Ayar more likely candidate now)?\n\nBtw, this is not bearish AAOI because they have too much demand for optical transceiver business. Just more bullish on the existing few qualified CPO laser names that have capacity. \n\n2. Demand imbalance and bottleneck for InP lasers / optical transceivers.\n\nAOI's CEO stated kinda supported that when they said: \"The customer demand is 20%-40% higher\" than expanded built out capacity.\n\n\"We are getting this kind of demand from several big customers almost every week. Lasers are the biggest bottleneck right now for the transceiver business\"\n\n3. China being years away from having CPO DWDM specification lasers.\n\nI covered this earlier when looking at CPO competition from channel checks.\n\nBut AAOI confirming that China is \"easily at least two, three years or even longer from having CPO lasers is incredible tread through on defensibility Western laser positioning in the CPO laser chokepoint.\n\nTLDR:\n\n- High demand imbalance for CW lasers and optical transceivers.\n\n- $AAOI not in first-gen CPO due to capacity constraints (not exactly bearish AAOI because they have too much demand for their optical transciver business, but even better news for the few independent players with capacity coming online like $SIVE)\n\n- China years behind in CPO lasers.","zh":"哇，$AAOI 的財報裡對 $SIVE 及其他雷射業者的讀數，簡直是一顆接一顆的寶石。\n\n1. AAOI 並未實質參與第一代 CPO（共封裝光學）部署。\n\n「我們就是做不出足夠的〔CPO 雷射〕來參與他們目前第一代的〔CPO〕部署，因為產能根本不夠。我們必須優先確保能為自家的收發模組生產雷射」\n\n所以第一代 CPO 雷射的部署，可能會更進一步收斂到 $SIVE、$LITE、$AVGO、$COHR 這些西方玩家身上。\n\n而如果 $AAOI 得推掉更多客戶⋯⋯那麼獨立的 CPO CW 雷射產能就變得更有價值了。\n\n另外還記得 TrendForce 說 $AMD 正在簽 CW 長約嗎？$COHR／$LITE 已經和 $NVDA 簽下產能⋯⋯\n\n我本來以為會是 $AAOI，但他們可能出局了。$MTSI 在早期 CPO 的參與看起來也不明顯（例如財報中除了 NPO 之外沒有提到，而且從 Ayar 官網上被移除了）。\n\n所以我很好奇 $AMD 這類玩家的 Helios 會找誰合作（例如 Sivers 加 Ayar 現在看起來是更可能的人選）？\n\n順帶一提，這不是看空 AAOI，因為他們的光收發模組業務需求太大了。只是對現有那少數幾家有產能、且通過認證的 CPO 雷射公司更看多。\n\n2. InP 雷射／光收發模組的需求失衡與瓶頸。\n\nAOI 執行長說的這句話某種程度上支持了這點：「客戶需求比擴建後的產能高出 20-40%」\n\n「我們幾乎每週都會從好幾家大客戶那裡收到這種需求。雷射是目前收發模組業務最大的瓶頸」\n\n3. 中國距離擁有 CPO DWDM 規格雷射還有數年之遙。\n\n我先前在從通路查訪看 CPO 競爭時就寫過這件事。\n\n但 AAOI 親口證實中國「輕鬆算至少還要兩、三年甚至更久才會有 CPO 雷射」，這對西方雷射在 CPO 雷射咽喉點上的防禦力，是極為驚人的讀數。\n\n總結：\n\n- CW 雷射與光收發模組存在高度的需求失衡。\n\n- $AAOI 因產能限制未參與第一代 CPO（這不算看空 AAOI，因為他們的光收發模組業務需求太大，但對 $SIVE 這種少數即將有產能上線的獨立業者來說是更好的消息）\n\n- 中國在 CPO 雷射上落後數年。","likes":1639,"views":697903,"reposts":148,"q":null},{"id":"2085511646257332581","ts":"2026-08-06T23:41:38.000Z","url":"https://x.com/aleabitoreddit/status/2085511646257332581","text":"$MTSI earnings transcript: \n\n\"Customers are coming to us with urgency due to the general supply shortage of indium phosphide DFB lasers\"\n\nEmphasis on \"Urgency\", CW \"DFB lasers\", \"coming to us\".\n\nCW DFB names, such as like $SIVE and $LITE should be happy to hear about this laser bottleneck getting validated.","zh":"$MTSI 法說逐字稿：\n\n「由於磷化銦 DFB 雷射普遍短缺，客戶帶著急迫性找上我們」\n\n重點在「急迫性」、「DFB 雷射」、「找上我們」。\n\n$SIVE 和 $LITE 這些 CW DFB 陣營的公司，看到這個雷射瓶頸再獲驗證應該會很開心。","likes":711,"views":244166,"reposts":62,"q":null},{"id":"2085499853099208716","ts":"2026-08-06T22:54:46.000Z","url":"https://x.com/aleabitoreddit/status/2085499853099208716","text":"Just some TLDR notes on $AAOI earnings:\n\n- Expects full qualification of 1.6T products by their hyperscaler customer within next couple of weeks \n\n(helpful revenue ramp #2, timelines)\n\n-  Continues to believe that AOI will have the largest AI DC transceiver production capacity in the US\n \n(reiterating ambitions during a time when their competitors might get banned)\n\n- Expects facilities toward InP capacity to come online in early 2027 \n\n(timeline FYI in terms of further ramp) \n\n- Total capacity is approaching 200,000/u per month, EOY 650,000/u per month of 800g/1.6t. EOY 2027, 930,000/u \n\n(this is the ramp i want to see)\n\n- \"increase our manufacturing capacity for our external light source or ELSFP. That's for co-packaged optics or CPO\". we anticipate ramping production later this year and into 2027, ultimately culminating in about 400,000 pieces per month in 2028\n\n(need some time to model this into revenue)\n\n- \"As we have mentioned before, we've been manufacturing lasers internally for many years. This has allowed us to avoid some of the shortages that  have affected others in the industry\"\n\n(vertical integration bull case during CW/EML laser shortages) \n\n- We believe that in the future, CPO will continue to drive increased demand for high-power lasers\n\n(thesis validation on CPO sector)\n\n- \"to our long-term objective of returning non-GAAP gross margins to around 40%\"\n\n-  \"We ended the second quarter with $508.8 million in total cash equivalents\"\n\nI need to double check if the ATM finished or not\n\n- \"our ability to deliver revenue in general, and specifically when it  comes to 800G products, is limited by our production capacity right now\" \"If we could produce more, we could ship more right now\"\n\nDemand > Supply validation. \n\n- \"Most of the increased capacity will be in U.S. Even so, let me say that, like I keep emphasizing, that is not good enough for the customer demand. The customer demand is 20%-40% higher.\"\n\nUnholy photonics demand validation across the whole sector, read through for $LITE, $SIVE / $JBL, and others is amazing. \n\n- \"Not in the next two, three years, especially the demand is so big. Okay?  Even combined AI, $LITE, $COHR, $AVGO all together, it's still very tough to meet the customer demand in the next few years\"\n\nMore optical sector demand validation. \n\n- CPO Timelines: \"If you're talking about really high volume manufacturer [for CPO market], I would say more like the late Q3 next year\" and \"We have been working very close with at least five customer\"\n\nIf you care about current earnings (which I'm not really looking at closely)\n\nRevenue: $191M vs. $190m \nEPS: $.06 vs. $.02\n\nTLDR: Extraordinary demand across the laser + optical sector read through. Kinda supporting Lumentum CEO statement that laser shortage is worse than memory shortages. \n\n2027 capacity ramp on track. To map inflection period with timelines, would be around early next year, as stated in their previous earnings call. \n\nAAOI has the customers now. Limitation is making enough lasers and transceivers.","zh":"$AAOI 財報的一些重點整理：\n\n- 預計未來幾週內，其超大規模客戶將完成 1.6T 產品的完整認證\n\n（有助於第二階段的營收放量，時程參考）\n\n- 持續相信 AOI 將擁有全美最大的 AI 資料中心收發模組產能\n\n（在競爭對手可能被禁的時間點重申企圖心）\n\n- 預計 InP（磷化銦）產能相關設施將於 2027 年初上線\n\n（後續放量的時程參考）\n\n- 總產能正接近每月 20 萬套，年底達每月 65 萬套的 800G／1.6T。2027 年底則為 93 萬套\n\n（這才是我想看到的放量）\n\n-「擴充我們外部光源 ELSFP 的製造產能。那是用於共封裝光學也就是 CPO 的」。我們預期今年稍晚到 2027 年開始放量，最終在 2028 年達到每月約 40 萬件\n\n（需要一點時間把這個換算成營收模型）\n\n-「如同我們先前提過的，我們自己內部製造雷射已經很多年了。這讓我們得以避開一些影響業界其他公司的短缺問題」\n\n（在 CW／EML 雷射短缺期間，垂直整合的多方論點）\n\n- 我們相信未來 CPO 將持續帶動高功率雷射需求的成長\n\n（CPO 板塊論點的驗證）\n\n-「我們的長期目標是把非 GAAP 毛利率拉回 40% 左右」\n\n-「第二季結束時我們持有 5.088 億美元的現金及約當現金」\n\n我得再確認一下那筆 ATM 增資是不是結束了\n\n-「我們整體的交付能力，特別是在 800G 產品上，目前受限於我們的產能」「如果我們能生產更多，現在就能出貨更多」\n\n需求大於供給的驗證。\n\n-「大部分新增產能會在美國。即便如此，我還是要強調，這對客戶需求來說仍然不夠。客戶需求高出 20-40%。」\n\n整個板塊光子需求誇張到不行的驗證，對 $LITE、$SIVE／$JBL 等公司的讀數好得驚人。\n\n-「未來兩三年內都不會，尤其是需求這麼大的情況下。好嗎？就算把 AI、$LITE、$COHR、$AVGO 全部加起來，未來幾年要滿足客戶需求還是非常吃力」\n\n又一次光通訊板塊需求的驗證。\n\n- CPO 時程：「如果你講的是真正的大量生產〔CPO 市場〕，我會說大概是明年第三季末」以及「我們至少與五家客戶密切合作中」\n\n如果你在意當期財報數字（我其實沒太仔細看）：\n\n營收：1.91 億美元 vs 預期 1.90 億美元\nEPS：0.06 美元 vs 預期 0.02 美元\n\n總結：整個雷射與光通訊板塊的需求讀數非同小可。某種程度上也支持了 Lumentum 執行長說雷射短缺比記憶體短缺更嚴重的說法。\n\n2027 年產能放量進度符合預期。若要對應轉折期的時程，大約是明年年初，跟他們上一季法說會講的一致。\n\nAAOI 現在有客戶了。限制在於能不能做出足夠的雷射與收發模組。","likes":1498,"views":291246,"reposts":128,"q":null},{"id":"2085304045099696547","ts":"2026-08-06T09:56:42.000Z","url":"https://x.com/aleabitoreddit/status/2085304045099696547","text":"I remain convinced nobody knows how to pronounce or talk about $AAOI in real life. \n\nIt’s one letter too long to say $TSM or $AMD. \n\nAnd nobody ever says to a friend“Wow, I like applied optoelectronics!”","zh":"我始終相信，現實生活中沒有人知道 $AAOI 這個名字該怎麼唸、怎麼講。\n\n它比 $TSM 或 $AMD 就是多了一個字母，唸起來很卡。\n\n而且從來沒有人會跟朋友說：「哇，我好喜歡應用光電子公司。」","likes":1713,"views":451347,"reposts":36,"q":null},{"id":"2085217487864643658","ts":"2026-08-06T04:12:45.000Z","url":"https://x.com/aleabitoreddit/status/2085217487864643658","text":"The unexpected thing of the week... Was $AEVA becoming a CPO/NPO optical source player. \n\nFor background: $SIVE is viewed as the high confidence CW DFB laser supplier to Aeva (which is known for lidar). \n\nToday, Aeva reacted with +18.26% AH on news that they signed a JDA with an optical engine player for deployment at a major hyperscaler in H2 2027, production ramp 2028. \n\n\"Optical Connectivity will leverage that foundation along with Aeva’s EXISTING high-volume manufacturing and foundry supply chain\" for:\n\n- ELSFP (similar to O-Net/Enablence + $SIVE), with Sivers as the likely CW laser + potential amplifier supplier\n\n- On-chip integrated light source (likely $SIVE DFB + Aeva PIC on the architecture/integration side)\n\nTLDR: New TAM and a hyperscaler programs for Aeva for CPO/NPO, positive read through for upstream suppliers like $SIVE.","zh":"這週最出乎意料的事⋯⋯是 $AEVA 成了 CPO／NPO 的光源玩家。\n\n背景說明：$SIVE 被視為 Aeva（以光達聞名）高信心度的 CW DFB（連續波分散式回饋）雷射供應商。\n\n今天 Aeva 盤後大漲 18.26%，因為消息指出他們與一家光引擎業者簽訂了聯合開發協議，將於 2027 下半年在某家大型超大規模業者部署，2028 年量產放量。\n\n「光連接業務將建立在該基礎之上，並運用 Aeva 既有的大量生產與晶圓代工供應鏈」，用於：\n\n- ELSFP（外部光源可插拔模組，類似 O-Net／Enablence 與 $SIVE 的做法），其中 Sivers 很可能是 CW 雷射供應商，也可能供應放大器\n- 晶片上整合光源（很可能是 $SIVE 的 DFB 雷射，搭配 Aeva 在架構／整合端的光子積體電路）\n\n總結：Aeva 在 CPO／NPO 上獲得新的 TAM（總潛在市場）與超大規模業者的專案，對 $SIVE 這類上游供應商是正面讀數。","likes":1063,"views":530890,"reposts":95,"q":"RobertFritzson：@aleabitoreddit Do we maybe also have $SIVE involved in this $AEVA projekt?\nAnother hyperscaler for #SiversSemiconductors?\n\nhttps://t.co/pKWieyHOsZ"},{"id":"2085174977272360987","ts":"2026-08-06T01:23:49.000Z","url":"https://x.com/aleabitoreddit/status/2085174977272360987","text":"Funniest callout of the year from $VIAV on CPO timelines:\n\n\"Well, there's been a lot of industry talk [about delays], like, 'Oh, because the yield is going to be slower.' \n\nThat's all nonsense. CPO and all that thing is moving forward\"\n\nThey stated that Yes there's always issues, but the process is being improved and things are getting better. \n\nTo follow up on that, the CEO stated: \n\n- Viavi has POs for CPO-testing activity\n- “We’re already getting [CPO revenue] this quarter, and probably in December it will start accelerating.”\n\nOn a side note, they also stated, 1.6T is \"ramping very quickly\", should reach parity with 800g next year, and signaled longer tail for 800g demand. \n\nTLDR: Seeing CPO test revenues hit for $VIAV to $FORM around now. Nvidia also stated switch-side CPO for scale out and scale across has entered mass production earlier. \n\nAs for scale up timelines, early production should be H2 2027 for some players, with other CPO players Ayar stating 2028 is the volume inflection period. \n\nBasically, all the timelines seem to be the same as before and revenue is starting to hit testing players first.","zh":"$VIAV 對 CPO（共封裝光學）時程做出了今年最好笑的打臉：\n\n「業界一直有很多〔關於延遲的〕說法，像是『喔，因為良率會比較慢』。\n\n那全都是胡扯。CPO 和那一整套東西都在往前推進。」\n\n他們表示，是的，永遠都會有問題，但製程正在改善，情況也愈來愈好。\n\n接著執行長還說：\n\n- Viavi 已有 CPO 測試相關的採購訂單\n-「我們這一季就已經開始有〔CPO 營收〕了，而且到 12 月大概就會開始加速。」\n\n另外他們也提到，1.6T「放量非常快」，明年就會與 800G 平起平坐，同時暗示 800G 的需求會有較長的尾巴。\n\n總結：從 $VIAV 到 $FORM，CPO 的測試營收大約就是現在開始入帳。Nvidia 也表示，用於橫向擴展與跨域擴展的交換器端 CPO 已於稍早進入量產。\n\n至於縱向擴展的時程，部分業者的初期量產應該落在 2027 下半年，而另一家 CPO 玩家 Ayar 則表示 2028 年才是放量的轉折期。\n\n基本上，所有時程看起來都跟先前一樣，而營收正開始優先落在測試業者身上。","likes":752,"views":267311,"reposts":46,"q":null},{"id":"2084795597417263442","ts":"2026-08-05T00:16:18.000Z","url":"https://x.com/aleabitoreddit/status/2084795597417263442","text":"$RKLB has been awarded a $397M contract by the US Space Force.\n\nTo build out Flatellite satellites and launch them on their Medium Lift rocket, Neutron. https://t.co/0jsPPf9ucI","zh":"$RKLB 獲得美國太空軍 3.97 億美元的合約。\n\n用於建造 Flatellite 衛星，並以他們的中型運載火箭 Neutron 發射。","likes":2171,"views":455512,"reposts":122,"q":null},{"id":"2084613071423893692","ts":"2026-08-04T12:11:01.000Z","url":"https://x.com/aleabitoreddit/status/2084613071423893692","text":"Bessent says: \"There may be deal Tuesday or Wednesday to open Strait of Hormuz with freedom of movement\"\n\nI think markets might like the sound of this. https://t.co/qXc8u2050N","zh":"貝森特表示：「週二或週三可能會有協議，讓荷莫茲海峽開放並保障自由通行」\n\n我想市場應該會喜歡這個消息。","likes":1353,"views":358806,"reposts":63,"q":null},{"id":"2084597612175618342","ts":"2026-08-04T11:09:35.000Z","url":"https://x.com/aleabitoreddit/status/2084597612175618342","text":"A very material catalyst came about for Western supply chains from $AAOI, $SIVE / Jabil, to $LITE and Coherent: \n\nThe Trump administration is drafting a ban of new Chinese optical transceivers and DC devices. \n\nWhich would likely hit China’s Innolight, Eoptolink, and other Chinese optical interconnect supply chains. \n\n\"The agency would ban all imports of new transceiver models ​and then exempt many ⁠non-Chinese suppliers from the restrictions\"\n\nWe'll likely see a larger bifurcation of supply chains with even greater importance put on Western players.","zh":"從 $AAOI、$SIVE／Jabil 到 $LITE 與 Coherent，西方供應鏈出現了一個非常有實質意義的催化劑：\n\n川普政府正在草擬禁令，禁止新的中國光收發模組與資料中心設備。\n\n這很可能會打擊中際旭創、新易盛等中國光互連供應鏈。\n\n「該機構將禁止所有新型號收發模組的進口，然後讓許多非中國供應商豁免於這些限制」\n\n我們很可能會看到供應鏈出現更大的分流，而西方玩家的重要性將被進一步放大。","likes":2586,"views":689361,"reposts":264,"q":null},{"id":"2084468063228060092","ts":"2026-08-04T02:34:48.000Z","url":"https://x.com/aleabitoreddit/status/2084468063228060092","text":"SK Hynix, $MU , and Samsung have sold out of 2027 capacity for DRAM/HBM.\n\n$SNDK, Samsung, Micron current annual NAND capacity has been sold out, with Kioxia and SK Hynix expected to finalize allocations by August 2026. \n\n- Customers are being allocated only 60–70% of the volumes they initially requested\n\n- industry insiders pointed out that 2027 will enter the most severe moment of memory shortage\n\n- Allocation amounts are mostly decided, but final shipment pricing will be determined closer to delivery \n\nSource: Digitimes, citing industry sources. \n\nHard to see those memory \"oversupply\" claims in early-mid 2027 when they're all sold out of capacity already.","zh":"SK 海力士、$MU 和三星的 2027 年 DRAM／HBM 產能已經售罄。\n\n$SNDK、三星、美光目前的年度 NAND 產能也已售罄，鎧俠與 SK 海力士預計會在 2026 年 8 月前敲定配額。\n\n- 客戶只能拿到當初要求量的 60-70%\n- 業界人士指出，2027 年將進入記憶體短缺最嚴重的時刻\n- 配額量大致已定，但最終出貨價格會在接近交貨時才決定\n\n來源：Digitimes 引述產業消息人士。\n\n當所有人的產能都已經賣光時，實在很難想像 2027 年初到中會出現那些「供給過剩」的說法。","likes":3578,"views":1076350,"reposts":352,"q":null},{"id":"2084422873423519844","ts":"2026-08-03T23:35:14.000Z","url":"https://x.com/aleabitoreddit/status/2084422873423519844","text":"Be Citadel:\n\n&gt; calls for unexpected rate hike few days ago, causing market panic\n\n&gt; reaches out and buys billions of liquidated hedge fund AI assets\n\n&gt; no rate hike \n\n&gt; “Bull market drivers are fully intact” https://t.co/gyy4Nk4SHq","zh":"扮演 Citadel：\n\n> 幾天前呼籲會有預期外的升息，引發市場恐慌\n> 主動聯繫並買下數十億美元被清算的避險基金 AI 資產\n> 結果沒有升息\n>「多頭市場的驅動力完好無缺」","likes":3021,"views":465264,"reposts":183,"q":null},{"id":"2084388023689679001","ts":"2026-08-03T21:16:45.000Z","url":"https://x.com/aleabitoreddit/status/2084388023689679001","text":"The bears have gone back into hibernation","zh":"空頭又回去冬眠了","likes":3429,"views":634224,"reposts":131,"q":null},{"id":"2083760320062083406","ts":"2026-08-02T03:42:29.000Z","url":"https://x.com/aleabitoreddit/status/2083760320062083406","text":"Trump announced that US has cancelled its attack on Iran.\n\nAnd that they’ve agreed to the perimeters of a deal to open the Strait and end the nuclear program.\n\nAnyone else feel like they’ve aged a few years in the past 6 months? https://t.co/4PK671c548","zh":"川普宣布美國已取消對伊朗的攻擊。\n\n並表示雙方已就開放海峽與終結核計畫的框架達成共識。\n\n有沒有人跟我一樣，覺得過去六個月老了好幾歲？","likes":2883,"views":594204,"reposts":106,"q":null},{"id":"2083438823548293140","ts":"2026-08-01T06:24:58.000Z","url":"https://x.com/aleabitoreddit/status/2083438823548293140","text":"$LITE CEO Michael Hurlston at the RAISE Summit warned that the supply gap for InP lasers for AI DCs:\n\nIs facing a more severe supply chain crisis than memory. \n\nAnd with Lumentum's 5 InP fabs, shipments would be more than 30%+ below customer demand.\n\nThis is especially visible with EMLs today but is already expanding to CW, especially as CPO ramps.\n\nI've always been a fan of the laser chokepoint + bottleneck from $AAOI, $SIVE, $LITE, and $COHR. And glad this thesis is starting to see validation.","zh":"$LITE 執行長 Michael Hurlston 在 RAISE 高峰會上警告，AI 資料中心用 InP（磷化銦）雷射的供給缺口：\n\n面臨的供應鏈危機比記憶體更嚴重。\n\n而且即使 Lumentum 有 5 座 InP 晶圓廠，出貨量仍會比客戶需求低 30% 以上。\n\n這在今天的 EML（電吸收調變雷射）上特別明顯，而且已經開始擴散到 CW（連續波），尤其在 CPO（共封裝光學）放量之後。\n\n我一直都很推從 $AAOI、$SIVE、$LITE 到 $COHR 的雷射咽喉點與瓶頸論點。很高興看到這個論點開始得到驗證。","likes":1905,"views":450967,"reposts":164,"q":null},{"id":"2083324920214536208","ts":"2026-07-31T22:52:21.000Z","url":"https://x.com/aleabitoreddit/status/2083324920214536208","text":"The media framing and X reactions around Leopold are egregious.\n\nFraming his successful multi-year thesis from $SNDK to $BE as a \"collapse\" or \"failure\".\n\nAfter July's surprising crash, then personally attacking him on top is just pathetic to witness. \n\nIt's almost like everyone is cheering for the downfall of others. \n\nYes, July's crash exposed problems with SA’s leverage, liquidity management, and hedging. \n\nBut his current YTD performance remains +80%, ranking among the best performing hedge funds. And he still has public equities after all this (just removed leverage). \n\nI think he's doing something unique while being successful at it. And this draws the envy of others.","zh":"媒體與 X 上針對 Leopold 的框架方式實在太過分了。\n\n把他從 $SNDK 到 $BE 這套成功了好幾年的論點，說成是「崩潰」或「失敗」。\n\n在 7 月那場出乎意料的崩跌之後，還要再對他進行人身攻擊，看了真的很可悲。\n\n這幾乎就像是每個人都在為別人的失敗歡呼。\n\n是的，7 月的崩盤暴露了 SA 在槓桿、流動性管理和避險上的問題。\n\n但他今年至今的績效仍是 +80%，在避險基金中名列前茅。而且經歷這一切之後他手上還是有公開市場的股票（只是把槓桿拿掉了）。\n\n我認為他在做一件很獨特的事，而且做得很成功。這就招來了別人的嫉妒。","likes":3319,"views":504081,"reposts":114,"q":null},{"id":"2083270545320386734","ts":"2026-07-31T19:16:17.000Z","url":"https://x.com/aleabitoreddit/status/2083270545320386734","text":"As a earnings recap: $AMZN, $META, $GOOGL, and $MSFT guided a 2026 combined capex forecast to ~$720-$745 Billion.\n\nUp from $695-$725B Billion previously.\n\nAmazon: $220B\nGoogle: $195B-$205B\nMeta: $130B-$145B\nMicrosoft: $175B\n\nWe've already seen significant deleveraging and retail/institutional margin liquidations (maybe it continues for more time, who knows). \n\nBut medium-long term, I'm not quite sure how anyone can be bearish the upstream semis or neoclouds. \n\nGiven each hyperscaler has flagged either compute shortages, rising cloud demand + pricing power, or increased spending for chips/networking.  \n\nMy \"bottleneck\" thesis with many of these upstream semi supply chains is that when trillions in capital flows into things from InP substrates or memory (which were both treated as cheap commodities) or even energy. \n\nLot of these current AI names that were treated as useless before in telecom cycles or even toilet sellers. \n\nGets rerated when their inflection period hits and capex flows into their balance sheets. \n\nAs seen with $NVDA GPUs past few years, memory this year, CPUs/MLCCs next few years, CPO in 2027, Glass Substrates in 2027, 800V in 2027, and so on.","zh":"財報總回顧：$AMZN、$META、$GOOGL、$MSFT 對 2026 年的合計資本支出預估已上調至約 7,200-7,450 億美元。\n\n原本是 6,950-7,250 億美元。\n\nAmazon：2,200 億美元\nGoogle：1,950-2,050 億美元\nMeta：1,300-1,450 億美元\nMicrosoft：1,750 億美元\n\n我們已經看到顯著的去槓桿，以及散戶／機構的融資斷頭（也許還會再持續一陣子，誰知道呢）。\n\n但就中長期而言，我不太懂怎麼會有人看空上游半導體或 neocloud（新型雲端算力商）。\n\n畢竟每一家超大規模業者都點出了算力短缺、雲端需求上升加上定價能力、或是增加晶片／網路支出其中之一。\n\n我對這些上游半導體供應鏈的「瓶頸」論點是：當數兆美元的資本流入 InP（磷化銦）基板、記憶體（這兩者過去都被當成廉價大宗商品）、甚至能源這些東西時。\n\n很多現在的 AI 個股，過去在電信循環裡被視為毫無用處，甚至被當成賣馬桶的。\n\n它們會在自己的轉折期到來、資本支出流入資產負債表時被重新評價。\n\n就像過去幾年的 $NVDA GPU、今年的記憶體、接下來幾年的 CPU／MLCC、2027 年的 CPO、2027 年的玻璃基板、2027 年的 800V，以此類推。","likes":1191,"views":346247,"reposts":106,"q":null},{"id":"2083225872207937687","ts":"2026-07-31T16:18:47.000Z","url":"https://x.com/aleabitoreddit/status/2083225872207937687","text":"$RDDT ER in a nutshell:\n\nRevenue: $804.9M vs. $730.4M (expected).\nEPS: $1.25 vs. ~$0.95.\nNet income: $252.8M vs. $196.5M\n\nQ3 guidance:\nRevenue: $860–870M vs. 829.1M\nAdjusted EBITDA: $385-395M vs. $369M\n\nBlowout financials, market always like to explain the drop 22.6% off some new BS narrative. \n\nLast quarter: \"AI will disrupt Reddit causing revenue loss!\"\n\nThis quarter: \"See, DAU fell .6%!\" (proceeds to ignore any revenue/profitability growth)","zh":"$RDDT 財報一句話總結：\n\n營收：8.049 億美元 vs 預期 7.304 億美元。EPS：1.25 美元 vs 預期約 0.95 美元。淨利：2.528 億美元 vs 預期 1.965 億美元\n\n第三季財測：\n營收：8.6-8.7 億美元 vs 預期 8.291 億美元\n調整後 EBITDA：3.85-3.95 億美元 vs 預期 3.69 億美元\n\n財務數字全面爆表，而市場總是喜歡用某種新的鬼扯敘事來解釋股價為什麼跌 22.6%。\n\n上一季：「AI 會顛覆 Reddit，導致營收流失！」\n\n這一季：「你看，日活躍用戶掉了 0.6%！」（然後完全無視營收與獲利成長）","likes":1617,"views":510839,"reposts":66,"q":null},{"id":"2083133191112843575","ts":"2026-07-31T10:10:30.000Z","url":"https://x.com/aleabitoreddit/status/2083133191112843575","text":"Just a TLDR of this week:\n\nMedia: Hyperscalers overbuilt and are selling excess compute.\n-> $GOOGL, $MSFT, $META, and $AMZN: Demand for compute far exceeds capacity. Capex go brrr.\n\nInstitutions: Emergency rate hike or 3x rate hikes, it's all over.\n-> Kevin Warsh: No rate Hike.\n\nRetail/Media: AI is crashing because it's a bubble. \n-> Citadel looking to buy AI leveraged hedge funds positions: 👀\n\nJim Cramer: Sell all your leveraged DC stocks.\n-> Koreans: SK Hynix +30%, Samsung +26.81%","zh":"本週重點總結：\n\n媒體：超大規模業者建設過度，正在賣掉多餘的算力。\n→ $GOOGL、$MSFT、$META、$AMZN：算力需求遠超過產能。資本支出爽爆。\n\n機構：緊急升息、或升息三次，一切都完了。\n→ Kevin Warsh：不升息。\n\n散戶／媒體：AI 在崩盤，因為它是泡沫。\n→ Citadel 正打算買下 AI 槓桿避險基金的部位：👀\n\nJim Cramer：把你所有用槓桿買的資料中心股票都賣掉。\n→ 韓國人：SK 海力士 +30%、三星 +26.81%","likes":1938,"views":340869,"reposts":98,"q":null},{"id":"2083114743729107236","ts":"2026-07-31T08:57:11.000Z","url":"https://x.com/aleabitoreddit/status/2083114743729107236","text":"Now that I think of it more, $POET optical interposer piece is actually a little more material than I thought with $SIVE. \n\nOriginally the wording was \"readiness\" for EOY 2026. \n\nBut $POET upgraded that wording, by stating \"production\" with Sivers lasers projected EOY 2026. \n\nSo a volume orders from across $JBL to $POET, should hit in H1 2027. Which makes a bit of sense, since Sivers did raise an institutional oversubscribed round for future mass production.  \n\nOn a side note, can't believe it's already August and 5 months left until 2027... Which was my inflection window for glass substrates, CPO, 800v, and new architectures to ramp.","zh":"仔細想想，$POET 的光學中介層這一塊，對 $SIVE 的實質意義其實比我原先想的更大。\n\n原本的措辭是 2026 年底「準備就緒」。\n\n但 $POET 把措辭升級了，表示搭配 Sivers 雷射的「量產」預計在 2026 年底。\n\n所以從 $JBL 到 $POET 的量產訂單，應該會在 2027 年上半年進來。這也說得通，因為 Sivers 確實為了未來量產完成了一輪超額認購的機構募資。\n\n順帶一提，不敢相信已經 8 月了，距離 2027 年只剩 5 個月⋯⋯而 2027 年正是我認為玻璃基板、CPO、800V 與新架構開始放量的轉折窗口。","likes":1170,"views":492754,"reposts":98,"q":"A22GEO：@aleabitoreddit Did you see POET blogged yesterday mentioning SIVE orders?"},{"id":"2083106805949878330","ts":"2026-07-31T08:25:39.000Z","url":"https://x.com/aleabitoreddit/status/2083106805949878330","text":"For $XFAB ER transcript:  \n\nJust to recap, my idea on $XFAB foundry growth opportunities stemmed from SiC for 800v and photonixfab/MTP for CPO applicability.   \n\n- $XFAB: \"We are making progress in co-packaged optics\".  \n\n- \"The transition to 800v... is expected to support demand for both SiC and GaN... for XFAB\"  \n\nSo those analysts/people that were confidently bearposting about $XFAB that they had \"0 exposure to 800V, photonics, CPO\" just turned out plainly wrong. \n\nAt the time I shared my idea, industry materials showed ASE and others cited photonixfab + XFAB as an upcoming CPO player in EU. And filings showed they had exposure names like $NVTS / $POWI in general. \n\nSo glad $XFAB went out to explicitly clear things up to state they were developing in CPO/800v.   \n\nOkay back to the ER:  \n\n- \"We continue to expect photonics volume production to start in 2028\".  Company currently has three silicon photonics projects in development with key partners.   \n\nI thought it would ramp sometime in H2 2027, but was probably early by a few months. \n\n- Several new data center design wins, eg. 3 new SiC design wins (consistent with general 2027 ramp as 800v deployment takes off).  \n\nSo once those ramp in 2027-2028, (markets tend to price things ahead of time), I'd expect $XFAB to be rerated based on growth opportunities.   \n\nTLDR:  \n- Current revenue numbers not as impressive.\n- $XFAB confirmed direct exposure to CPO and 800V shifts (biggest win for thesis) \n- 800V exposure opportunities for SiC (should be 2027)\n-  Timeline is 2028 ramp for photonics volume production  \n\nHappy exposure thesis to CPO/800V was confirmed from this ER. Might be a bit of waiting for revenue ramp.","zh":"關於 $XFAB 的法說逐字稿：\n\n先回顧一下，我對 $XFAB 晶圓代工成長機會的想法，來自於 800V 用的碳化矽（SiC），以及 photonixfab／MTP 在 CPO（共封裝光學）上的適用性。\n\n- $XFAB：「我們在共封裝光學上正取得進展」。\n\n-「向 800V 的轉換⋯⋯預期將同時支撐 SiC 與 GaN（氮化鎵）的需求⋯⋯對 XFAB 而言」\n\n所以那些信誓旦旦唱衰 $XFAB、說他們「對 800V、光子、CPO 完全沒有曝險」的分析師／網友，就這樣被證明是徹底錯了。\n\n我當初分享這個想法時，產業資料就顯示日月光等業者把 photonixfab 加 XFAB 列為歐洲即將登場的 CPO 玩家。而申報文件也顯示他們對 $NVTS／$POWI 這類公司有曝險。\n\n所以很高興 $XFAB 出面明確澄清，說明他們正在開發 CPO／800V。\n\n好，回到財報：\n\n-「我們持續預期光子的量產將於 2028 年開始」。該公司目前有三個矽光子專案正與關鍵夥伴共同開發。\n\n我原本以為會在 2027 下半年某個時候放量，看來我大概早了幾個月。\n\n- 拿下數個新的資料中心設計案，例如 3 個新的 SiC 設計案（與 800V 部署起飛帶動的 2027 年整體放量一致）。\n\n所以等這些在 2027-2028 年放量後（市場通常會提前反映），我預期 $XFAB 會因為成長機會而被重新評價。\n\n總結：\n- 目前的營收數字沒那麼亮眼。\n- $XFAB 確認對 CPO 與 800V 轉換有直接曝險（這是對論點最大的加分）\n- 800V 帶來的 SiC 曝險機會（應該是 2027 年）\n- 光子量產的時程是 2028 年放量\n\n很高興這次財報確認了 CPO／800V 的曝險論點。營收放量可能還要再等一陣子。","likes":563,"views":295681,"reposts":33,"q":"jim29223471：@aleabitoreddit What are your thoughts on the XFAB earnings yesterday? thank you in advance!"},{"id":"2083088870942642391","ts":"2026-07-31T07:14:23.000Z","url":"https://x.com/aleabitoreddit/status/2083088870942642391","text":"Few earnings TLDRs with my favorite $AXTI and $AMZN:\n\nAmazon:\n- Raised 2026 capex to $220B vs. prior $200B (partly due to higher memory costs, which is bullish on $MU to Samsung) \n- Even at $220B, Amazon will not have enough capacity to meet all 2026 demand; Jassy expects the same in 2027.\n- Most incoming 2027 capacity is already reserved, with substantial 2028 capacity also reserved.\n\nMostly read through on upstream semis. $GOOGL, $META, $AMZN, and $MSFT all identified compute shortage. \n\nAll the narratives a few weeks earlier was \"excess compute\" from Meta and others + hyperscalers cutting back on spend... All BS. \n\nAmazon earnings was very bullish on AI semi trade. \n\nAXTI:\n\n- AXT to double InP capacity during 2026. Then double again in 2027. \n\nThis is expected to make AXT \"by far the largest indium phosphide producer in the world.\" - LFG\n\n- Q2 rev was $47.6M, the highest quarterly revenue in AXT history (InP revenue reached a record $30.7M, from DC applications.)\n- Revenue increased 77% sequentially and 164% year over year.\n- InP revenue-capacity targets: $60M per quarter exiting 2026.\n- $130M per quarter exiting 2027 \n\nThat $130m target could be hiked too since management stated they find \"whatever ways to increase that capacity expansion\"\n\n- Management said the reported backlog remains well above $100M, but that number no longer reflects all available demand.\n\n\"Customer demand continues to outpace supply, no matter how fast we add capacity.\" 800G/1.6T is driving the current cycle, while NPO/CPO extends it beyond 2027. \n\nAlso they're targeting 50%-plus gross margin: \"We should definitely be targeting a number that begins with a five.\"\n\nChina demand more than doubled, and their agreements with Casela, $COHR and $LITE did not materially drive Q2. \n\nThis is not even considering my projected massive ASP hikes yet as InP substrates get more bottlenecked. \n\nTLDR:\n\n- Amazon too much compute demands, needs capex to fufill it, so upstream semis go brrr. \n- AXT world largest InP substrate supplier, high gross margins, expansion, and supply can't keep up with demand.  \n\nBullish on demand side from Amazon + capex. Bullish on upstream optical supply chains from too much demand.","zh":"幾則財報重點，包含我最愛的 $AXTI 和 $AMZN：\n\nAmazon：\n- 將 2026 年資本支出上調至 2,200 億美元，原本是 2,000 億美元（部分原因是記憶體成本上升，這對 $MU 到三星是利多）\n- 即使拉到 2,200 億美元，Amazon 仍無法滿足 2026 年的全部需求；Jassy 預期 2027 年也一樣。\n- 2027 年即將到位的產能大多已被預訂，2028 年也有相當大一部分已被預訂。\n\n這主要是對上游半導體的讀數。$GOOGL、$META、$AMZN、$MSFT 全都點出了算力短缺。\n\n幾週前那些「算力過剩」、「超大規模業者要縮減支出」的敘事⋯⋯全都是鬼扯。\n\nAmazon 的財報對 AI 半導體交易非常有利。\n\nAXTI：\n\n- AXT 將在 2026 年將 InP（磷化銦）產能翻倍，2027 年再翻一倍。\n\n這預計會讓 AXT 成為「遙遙領先的全球最大磷化銦生產商」——衝啊\n\n- 第二季營收 4,760 萬美元，是 AXT 史上最高的單季營收（InP 營收來到創紀錄的 3,070 萬美元，來自資料中心應用。）\n- 營收季增 77%、年增 164%。\n- InP 營收產能目標：2026 年底達到每季 6,000 萬美元。\n- 2027 年底達到每季 1.3 億美元。\n\n那個 1.3 億美元的目標也可能被上調，因為管理層表示他們正在「想盡各種辦法加速產能擴充」。\n\n- 管理層表示，公布的在手訂單仍遠高於 1 億美元，但這個數字已經無法反映所有可取得的需求了。\n\n「不管我們加產能的速度有多快，客戶需求仍持續超過供給。」800G／1.6T 正驅動當前這個循環，而 NPO／CPO 則會把它延長到 2027 年之後。\n\n他們也把毛利率目標訂在 50% 以上：「我們絕對應該以一個 5 開頭的數字為目標。」\n\n中國需求成長超過一倍，而他們與 Casela、$COHR 和 $LITE 的協議在第二季並未帶來實質貢獻。\n\n而這還沒把我預期的、隨著 InP 基板愈來愈吃緊而出現的大幅漲價算進去。\n\n總結：\n- Amazon 算力需求太大，需要資本支出來滿足，所以上游半導體爽爆。\n- AXT 是全球最大的 InP 基板供應商，毛利率高、正在擴產，而且供給追不上需求。\n\n需求面看好 Amazon 加資本支出。上游光通訊供應鏈因需求過剩而看好。","likes":1141,"views":330974,"reposts":77,"q":null},{"id":"2082896789880119590","ts":"2026-07-30T18:31:07.000Z","url":"https://x.com/aleabitoreddit/status/2082896789880119590","text":"Did Citadel really just liquidate Situational Awareness…\n\nThen brought up entire markets the next day?\n\n$NBIS +26.25%\n$IREN +25.96%\n$SHAZ +22.82%\n$SNDK + 23.98%\n$BE +23.67%\n$SKHY +16.98%\n$INTC +12.16%\n\nAmid many others. This has gotta be one of the wildest liquidations I’ve seen.","zh":"Citadel 該不會真的把 Situational Awareness 清算掉了⋯⋯\n\n然後隔天就把整個市場拉起來？\n\n$NBIS +26.25%\n$IREN +25.96%\n$SHAZ +22.82%\n$SNDK +23.98%\n$BE +23.67%\n$SKHY +16.98%\n$INTC +12.16%\n\n還有很多其他的。這絕對是我看過最誇張的清算之一。","likes":3661,"views":536441,"reposts":246,"q":null},{"id":"2082740477795745942","ts":"2026-07-30T08:10:00.000Z","url":"https://x.com/aleabitoreddit/status/2082740477795745942","text":"There's a lot of stupid commentary around Leopold raising funds. After names like $BE, $SNDK, $SHAZ, and others all had very sharp drawdowns in July.\n\nJust remember... here's a man in finance that's\n\n1.  6'5\n2. Blue Eyes\n3. Hedge Fund\n\nProbably better looking than you, and was up 439% through June YTD.  \n\nRegarding the drawdown, Aschenbrenner acknowledged that the fund had \"not been immune\" to the market turmoil, particularly in Asia.  FT separately reported that leverage amplified both its extraordinary gains and recent losses.\n\nHe described the sell-off as potentially the best buying opportunity since early 2025\n\nI'd agree with him and hope he succeeds with the raise.\n\nSince a lot of the current selloff looks like it overshot its mark through forced deleveraging.","zh":"關於 Leopold 募資這件事，有很多愚蠢的評論。在 $BE、$SNDK、$SHAZ 等個股 7 月都出現非常急遽的回檔之後。\n\n只是提醒一下⋯⋯這位金融圈的男人：\n1. 身高 196 公分\n2. 藍眼睛\n3. 開避險基金\n\n大概長得比你好看，而且到 6 月為止今年報酬率高達 439%。\n\n至於回檔，Aschenbrenner 承認該基金「並未免疫」於市場動盪，尤其是在亞洲。\n\n《金融時報》另外報導，槓桿同時放大了他的驚人獲利與近期虧損。\n\n他形容這波賣壓可能是 2025 年初以來最好的買點。\n\n我同意他的看法，也希望他募資順利。\n\n因為目前這波賣壓看起來有很大一部分是被強制去槓桿推過頭了。","likes":2456,"views":562312,"reposts":96,"q":null},{"id":"2082720873908494456","ts":"2026-07-30T06:52:06.000Z","url":"https://x.com/aleabitoreddit/status/2082720873908494456","text":"Just some interesting takeaways from $FORM earnings call on CPO:\n\nSince they attributed systems revenue nearly doubled due to: \"accelerating growth in co-packaged optics or CPO\". \n\nQ1 2026: \"we now expect 2026 CPO revenues to come in at the high end of the $10 million to $20 million range\"\n\nQ2 2026 (now): \"expect to exceed that range by the end of the third quarter, and to significantly exceed the $20 million level for the year overall.\"\n\nManagement stated \"We’re seeing some significant acceleration in this [CPO] business\". \n\nQ: CPO adoption outlook. Are we perhaps expecting the timeline to accelerate a little bit?\n\nA: \"What I would say is there’s acceleration here in the very short term.\" But management stated there's not a significant pull-in on timelines. \n\nCiting production infrastructure (not just R&D) for:\n\n- The growing volumes of CPO chips planned for later this year + test insertion for scale-up and scale-out switches. \n- Seems like that CPO piece flows through $TSM COUPE [ likely maps to $NVDA CPO products] - \"The CPO piece does flow through that 10% customer\"\n\nSo now, test is ramping given management cited growing volumes of CPO chips. \n\n\"The rapid recent growth of our CPO business is an exciting development, which we believe represents the very early stages of widespread adoption of silicon photonics in the broader semiconductor industry\"\n\nTLDR: Fundamentally, CPO as a theme is very early, and should start to go brrr soon since it's starting to show up in earnings now (equipment/test players usually appear up first before optical engines / laser volumes ramp). \n\nPersonally once all the deleveraging stops, I think markets will start to care more.","zh":"$FORM 法說會上關於 CPO（共封裝光學）的一些有趣重點：\n\n因為他們把系統營收近乎翻倍歸功於：「共封裝光學（CPO）業務的成長加速」。\n\n2026 年第一季：「我們現在預期 2026 年的 CPO 營收會落在 1,000 萬到 2,000 萬美元區間的高端」\n\n2026 年第二季（現在）：「預期在第三季結束前就會超過該區間，且全年將顯著超過 2,000 萬美元的水準。」\n\n管理層表示「我們在這塊（CPO）業務上看到相當顯著的加速」。\n\n問：CPO 採用的展望如何。時程是不是可能會稍微提前？\n\n答：「我會說，在非常短期內確實有加速。」但管理層表示時程並沒有大幅提前。\n\n他們提到這關乎生產基礎設施（而不只是研發），用於：\n\n- 今年稍晚規劃中不斷成長的 CPO 晶片產量，以及縱向擴展與橫向擴展交換器的測試導入。\n- 看起來這塊 CPO 業務是流經 $TSM 的 COUPE〔很可能對應到 $NVDA 的 CPO 產品〕——「CPO 這一塊確實是流經那個佔比 10% 的客戶」\n\n所以既然管理層提到 CPO 晶片產量正在成長，測試業務現在正在放量。\n\n「我們 CPO 業務近期的快速成長是一個令人振奮的發展，我們相信這代表矽光子在更廣泛的半導體產業中被大規模採用的最初期階段」\n\n總結：就基本面而言，CPO 這個主題還非常早期，而且應該很快就會爽爆，因為它現在已經開始出現在財報上了（設備／測試業者通常會比光引擎／雷射放量更早浮現）。\n\n我個人認為，等去槓桿全部結束後，市場會開始更在意這件事。","likes":798,"views":361284,"reposts":57,"q":null},{"id":"2082605568699871284","ts":"2026-07-29T23:13:55.000Z","url":"https://x.com/aleabitoreddit/status/2082605568699871284","text":"Just some takeaways from $META | $MSFT earnings calls:\n\nMicrosoft:\n- Expected to be FCF positive in 2027, despite the increase in capex (extremely positive for AI buildout that it's funded by operating income)\n- \"Free cash flow was $19.6 billion, reflecting higher capital expenditures\"\n- Quartely capex was $41B, roughly 2/3rds were \"short lived assets, primarily CPUs and GPUs\"\n- Expects capex spend will be over $50 billion for next quarter\n- Capex Guidance at ~$175 billion and 2027 capex roughly the same. Spending plans unchanged and in line. \n- \"Extending the estimated useful life of our data centers from 15 to 25 years\"\n- \"We will be among the first cloud providers to deploy next generation rack-scale AI infrastructure based on $AMD Helios and $NVDA Vera Rubin\"\n- \"Customer demand continues to exceed available capacity\"\n\nMeta:\n- Capex $130-$145 billion (narrowed range), from $125B-$145B. \n- Meta is receiving offers at a \"significant premium\" to what they paid for it (compute scarcity, positive for neoclouds like $IREN / $NBIS )\n- Expects significant portion of compute (like the 1 GW DC in El Paso) to develop internal models. \n- Meta has multiple ROI-positive uses for additional compute across its core business (internally, not Meta Compute)\n- \"Finally, we believe that overall industry capacity is going to remain tight for the foreseeable future\" \n- \"The industry has under-built historically for the wave of AI adoption, making existing capacity, including our own, extremely valuable\" - Susan Li\n\nTLDR:\n- $MSFT and $GOOGL largely sustaining AI capex buildout while remaining FCF positive or through operating incomes.\n- $META flags available compute materially below demand at least through 2027. And $MSFT also flags compute demand far exceeds supply. \n- All three hyperscaler capex largely in line with Google hiking capex figures.\n\nAI selloff seems extremely overblown now, hyperscalers continuing capex in line (with Microsoft being FCF positive) or even hiked with $GOOGL. \n\nCompute scarcity is visible throughout every single hyperscaler ER.","zh":"$META 與 $MSFT 法說會的一些重點：\n\n微軟：\n- 預計 2027 年自由現金流轉正，儘管資本支出增加（AI 建置能由營業收入支應，這是極度正面的訊號）\n-「自由現金流為 196 億美元，反映資本支出增加」\n- 本季資本支出 410 億美元，其中約三分之二為「短生命週期資產，主要是 CPU 與 GPU」\n- 預期下季資本支出將超過 500 億美元\n- 資本支出財測約 1,750 億美元，2027 年大致相同。支出計畫維持不變，符合預期。\n-「將資料中心的預估使用年限從 15 年延長到 25 年」\n-「我們將是最早部署基於 $AMD Helios 與 $NVDA Vera Rubin 的下一代機櫃級 AI 基礎設施的雲端業者之一」\n-「客戶需求持續超過可用產能」\n\nMeta：\n- 資本支出 1,300-1,450 億美元（區間收窄），原本是 1,250-1,450 億美元。\n- Meta 收到的報價相對於他們自己的取得成本有「顯著溢價」（算力稀缺，對 $IREN／$NBIS 這類 neocloud 是利多）\n- 預期會有相當大一部分算力（例如艾爾帕索那座 1GW 資料中心）用於開發內部模型。\n- Meta 在其核心業務中，對額外算力有多種投資報酬率為正的用途（是內部使用，不是 Meta Compute）\n-「最後，我們認為在可預見的未來，整個產業的產能都會保持吃緊」\n-「這個產業在歷史上對 AI 採用浪潮的建設是不足的，這讓既有產能——包括我們自己的——變得極為珍貴」——Susan Li\n\n總結：\n- $MSFT 與 $GOOGL 大致維持 AI 資本支出建置，同時仍保持自由現金流為正、或以營業收入支應。\n- $META 指出至少到 2027 年，可用算力都將明顯低於需求。$MSFT 也指出算力需求遠超供給。\n- 三家超大規模業者的資本支出大致符合預期，Google 還上調了數字。\n\n現在看來這波 AI 賣壓實在過頭了，超大規模業者的資本支出照原計畫進行（微軟還是自由現金流為正），$GOOGL 甚至還往上加。\n\n算力稀缺這件事，在每一家超大規模業者的財報裡都看得見。","likes":1759,"views":646148,"reposts":119,"q":"stockprodigyman：@aleabitoreddit @LeaderInvests Thought on meta and Microsoft earnings?"},{"id":"2082578803189268855","ts":"2026-07-29T21:27:33.000Z","url":"https://x.com/aleabitoreddit/status/2082578803189268855","text":"$AXTI enters long term agreement with $LITE for InP substrates. \n\nLumentum has agreed to pay a deposit of $43.5M as a reservation for capacity. https://t.co/5Dl3L9EYRa","zh":"$AXTI 與 $LITE 簽訂 InP（磷化銦）基板的長期供貨合約。\n\nLumentum 同意支付 4,350 萬美元的訂金以保留產能。","likes":1301,"views":384348,"reposts":61,"q":null},{"id":"2082557648298516918","ts":"2026-07-29T20:03:30.000Z","url":"https://x.com/aleabitoreddit/status/2082557648298516918","text":"To show solidarity with the $IREN holders:\n\nI now own 1 share of IREN.","zh":"為了聲援 $IREN 的持股人：\n\n我現在持有 1 股 IREN。","likes":2738,"views":913025,"reposts":41,"q":null},{"id":"2082529316655763703","ts":"2026-07-29T18:10:55.000Z","url":"https://x.com/aleabitoreddit/status/2082529316655763703","text":"Federal Reserve leaves rates unchanged at unchanged at 3.50% - 3.75%.  \n\nSo far so good, since markets would have sold off on an immediate rate hike (seem to have largely frontran hike expectations off already).   \n\nThink everyone is waiting for the Fed Chair commentary now. https://t.co/2bZtg5UKEb","zh":"聯準會維持利率在 3.50%-3.75% 不變。\n\n目前為止還算順利，因為如果立刻升息，市場早就賣壓出籠了（看來市場已經大幅提前反映了升息預期）。\n\n我想現在大家都在等聯準會主席的談話了。","likes":1305,"views":375160,"reposts":62,"q":null},{"id":"2082513405219631384","ts":"2026-07-29T17:07:41.000Z","url":"https://x.com/aleabitoreddit/status/2082513405219631384","text":"US Gov to take 1% stake in $GFS, and award them $300m for the US CHIPS ACT.\n\nThis is actually a strong read through on $SIVE / $LITE, given this CHIPS ACT is specifically aimed at advancing CPO + Silicon Photonics. \n\n(For reference, Sivers and Lumentum were the only two public laser suppliers named in GFS presentation slides. Sivers laser arrays was named recently as a reference design in Globalfoundries SCALE for CPO).  \n\nPer US Gov announcement: \"GlobalFoundries will receive up to $300 million to accelerate domestic CPO R&D by two to three years\" (NIST)\n\nNever thought we'd see the US Gov / $INTC foundry playbook for CPO in specific...","zh":"美國政府將取得 $GFS 1% 的股權，並依據晶片法案撥給他們 3 億美元。\n\n這其實是對 $SIVE／$LITE 很強的正面讀數，因為這筆晶片法案資金明確是為了推進 CPO（共封裝光學）與矽光子。\n\n（作為參考，Sivers 和 Lumentum 是 GFS 簡報投影片中唯二被點名的公開上市雷射供應商。Sivers 的雷射陣列近期被指定為 GlobalFoundries SCALE 平台在 CPO 上的參考設計。）\n\n根據美國政府公告：「GlobalFoundries 將獲得最高 3 億美元，以將美國本土的 CPO 研發加速二到三年」（來自 NIST）\n\n沒想到我們會看到美國政府把 $INTC 那套晶圓代工劇本，套用在 CPO 上⋯⋯","likes":1527,"views":372457,"reposts":111,"q":null},{"id":"2082230983487803755","ts":"2026-07-28T22:25:27.000Z","url":"https://x.com/aleabitoreddit/status/2082230983487803755","text":"I personally see it as extreme short term deleveraging that overshot many individual names. \n\n- $BE to $TER reported blowout results, with Bloom reporting 166% Y/Y rev growth + expanding margins + raised 2026 guidance... Teradyne reported 104% Y/Y revenue growth with 300%+ EPS growth. \n\nYour leading optical players over in China reported amazing preliminary earnings + extremely strong read through for the Western photonics sector. \n\nThink earnings season tend to remind markets about continued AI acceleration. I'm expecting $LITE, $SNDK / SK Hynix, and sector leader ERs to continue that trend.   \n\nBut it does feel like markets are rewarding existing acceleration more rather than future growth a year out over near-term revisions as seen with $AMKR. \n\nBut as a TLDR, looks very positive for the themes I'm tracking.  \n\n- Then you have $GOOGL capex raised to $195-$205B, which is typically the biggest AI demand signal from hyperscalers. \n\n- 77% 0bps change est. next FOMC decision from prediction markets. Trump administration on Monday called for the Fed to lower interest rates. \n\nSo your 3x rate hikes fears this year seem kinda overblown. \n\n- Chinese fears from DUV to $CXMT overflooding are extremely overblown as well. We see this with every sector from time to time until people remember that lasers or HBM bottlenecks for a reason. \n\nAs for personal thoughts, it was unhealthy seeing everything rise up or down together, especially with these themes. But I'm personally not worried since I have full conviction in my names, especially optical interconnects like $SIVE or $AAOI. \n\n$META compute and $GOOGL GCP margins/growth shows increasing demand for $NBIS and similar neocloud business models. \n\n$META + other hyperscaler notes around LTAs with $SNDK and Samsung/SK Hynix, $MU point to structural memory demand. \n\nCan go on and on... \n\nBut when you have Jim Cramer telling every margined DC trader to \"sell everything\" at market open and news saying there's an AI bubble. \n\nI do hate it when others say \"it's dropping so sell\". My belief is that the important thing to look is accelerating revenue/EPS growth. And if that thesis stays in-tact with revenue acceleration in line with hyperscaler capex. \n\nTLDR: I see signs of AI demand / revenue acceleration, hyperscaler capex is one of the most important things to track. \n\nAnd my guess is that we'll see the theme recover broadly. But I can't predict what hour, day, or week that happens.","zh":"我個人認為這是極端的短期去槓桿，讓許多個股跌過頭了。\n\n- 從 $BE 到 $TER 都繳出爆炸性的財報，Bloom 營收年增 166%、利潤率擴張、並上調 2026 年財測⋯⋯Teradyne 營收年增 104%，EPS 成長超過 300%。\n\n中國那邊的光通訊龍頭也公布了驚人的財報預告，對西方光子板塊是極強的正面讀數。\n\n我覺得財報季通常會提醒市場：AI 仍在持續加速。我預期 $LITE、$SNDK／SK 海力士以及各板塊龍頭的財報會延續這個趨勢。\n\n不過確實有種感覺是，市場比較獎勵當下已經發生的加速，而不是一年後的成長，就像 $AMKR 的情況那樣。\n\n但總結來說，對我在追蹤的這些主題非常正面。\n\n- 再來是 $GOOGL 把資本支出上調到 1,950-2,050 億美元，這通常是超大規模業者能給出的最強 AI 需求訊號。\n\n- 預測市場顯示下次 FOMC 決議有 77% 機率維持利率不變。川普政府週一則呼籲聯準會降息。\n\n所以你們今年那個「升息三次」的恐慌看起來有點誇大了。\n\n- 從 DUV 到 $CXMT 大舉洪水式供應的中國恐懼，同樣被過度放大。每個板塊三不五時都會來這麼一次，直到大家想起來雷射或 HBM 之所以是瓶頸是有原因的。\n\n至於個人想法，看到所有東西一起漲一起跌是不健康的，尤其是這些主題。但我個人並不擔心，因為我對手上的持股完全有信心，特別是 $SIVE 或 $AAOI 這類光互連。\n\n$META 的算力狀況與 $GOOGL 的 GCP 利潤率／成長，顯示 $NBIS 及類似 neocloud（新型雲端算力商）商業模式的需求正在增加。\n\n$META 與其他超大規模業者關於與 $SNDK、三星／SK 海力士、$MU 簽長約的說法，都指向結構性的記憶體需求。\n\n可以一直講下去⋯⋯\n\n但當你看到 Jim Cramer 在開盤時叫每個用融資買資料中心股的人「全部賣掉」，新聞又在說 AI 泡沫。\n\n我真的很討厭有人說「它在跌所以快賣」。我的信念是，重點應該看營收／EPS 的加速成長。以及那個論點是否完好，營收加速是否與超大規模業者的資本支出一致。\n\n總結：我看到 AI 需求／營收加速的跡象，而超大規模業者的資本支出是最值得追蹤的指標之一。\n\n我的猜測是這個主題會全面復甦。但我沒辦法預測那會發生在哪一小時、哪一天或哪一週。","likes":2580,"views":984146,"reposts":166,"q":"zhuwenbin168：@aleabitoreddit @wannabepanacea 祝你早日康复，AI硬件要见底了吗？还要跌多少"},{"id":"2082175588555702410","ts":"2026-07-28T18:45:19.000Z","url":"https://x.com/aleabitoreddit/status/2082175588555702410","text":"FCC set to ban Chinese imports of humanoid and quadruped robots per Reuters.  \n\nTo protect American Humanoid/Robotics programs.\n\nAgility Robotics ( $CCXI ) and other US humanoid players should be happy to hear this. https://t.co/s2dFWTA4EX","zh":"根據路透社，FCC 準備禁止從中國進口人形與四足機器人。\n\n目的是保護美國的人形機器人／機器人計畫。\n\nAgility Robotics（$CCXI）與其他美國人形機器人業者聽到這消息應該會很開心。","likes":1321,"views":449554,"reposts":107,"q":null},{"id":"2081579593815978273","ts":"2026-07-27T03:17:03.000Z","url":"https://x.com/aleabitoreddit/status/2081579593815978273","text":"Wow, $CMXT is up a very normal +469.98% after going public today.\n\nNow valuing it at ~$487.31 billion, up from $85.5 billion. \n\nDid any of my Chinese followers buy into the IPO? https://t.co/TlibjHe799","zh":"哇，$CMXT 今天掛牌後上漲了非常「正常」的 469.98%。\n\n估值來到約 4,873.1 億美元，掛牌前是 855 億美元。\n\n有中國的追蹤者參與這次 IPO 嗎？","likes":2212,"views":879689,"reposts":103,"q":null},{"id":"2081548360818004299","ts":"2026-07-27T01:12:57.000Z","url":"https://x.com/aleabitoreddit/status/2081548360818004299","text":"Nvidia in talks to backstop $250B worth of OpenAI DC financing.\n\n- Softbank’s SB energy develops 10 GW Ohio campus \n\n- OpenAI signs long term lease\n\n- $NVDA guarantees $250B in financing\n\n- OpenAI discussing separate agreement to buy up to $350B in Nvidia chips.\n\nNot quite sure if this circular financing is healthy long term, but given the massive size of AI infrastructure spending…\n\nFeels like capex beneficiaries will be extremely happy.","zh":"Nvidia 正在洽談為 OpenAI 價值 2,500 億美元的資料中心融資做擔保。\n\n- 軟銀旗下 SB Energy 開發俄亥俄州 10GW 園區\n- OpenAI 簽下長期租約\n- $NVDA 為 2,500 億美元的融資提供擔保\n- OpenAI 另在洽談一份最高 3,500 億美元的 Nvidia 晶片採購協議。\n\n我不太確定這種循環融資長期而言是否健康，但考量到 AI 基礎設施支出的龐大規模⋯⋯\n\n感覺資本支出的受惠者會非常開心。","likes":1201,"views":498054,"reposts":59,"q":null},{"id":"2081472671129501729","ts":"2026-07-26T20:12:11.000Z","url":"https://x.com/aleabitoreddit/status/2081472671129501729","text":"Just some TLDR news:\n\n- $CXMT IPO tomorrow if you like Chinese memory. \n\n- Samsung Electronics reportedly struggling to secure large FC-BGA substrates. Ibiden (4062) reportedly requested LTA guarantees, Samsung Electro-Mechanics sought prepayments. \n\n- Samsung + $AVGO sign memory + foundry AI framework through 2030, expected to exceed $200b\n\n- $SOI expects FY2027 silicon photonics revenue to double compared to the previous year, surpassing Morgan Stanley's 60% growth projection. Photonics thesis go brrr. \n\n- SK Group + $NVDA sign $500B+ partnership to build out AI DCs and HBM4 memory. \n\n- SKC Absolics glass core delay to 2027 from reports. Targeting final reliability testing EOY, mass production next year. So if you're curious, this does push back some ramps from $LPK and others (hence drop on ER). \n\n- $QCOM price hikes by double digits for smartphone processors, due to upstream supplier hike pricing.\n\n- $META expected to issue $12B in project-level/SPV financing for El Paso, Texas AI DC expansion \n\n- Naver announced a $10 billion investment from $NVDA and Brookfield to construct a 1GW-scale AI Factory. Near term plan is 200MW by 2028. (Nvidia $1B investment, Brookfield nonbinding $9B)\n\n- 64GB DDR5 server modules rises 146% versus end-June contract pricing\n\n- $INTC brought forward 14A process mass production  by a year, risk production H2 2027 and volume production in 2028, vs. 2029 HVM expectations. \n\n- Samsung Electro-Mechanics wins $200m MLCC order (existing bottleneck).  \n\n- $AMD (the Bandana bottleneck), announces Helios is in full production with shipments Q3 2026. Including an up to 2GW MI455X GPU deployment with Anthropic and a 6GW infrastructure rollout with OpenAI. Gave new >50% CAGR TAM to $220B by 2030 from $26b in 2025 for CPU market. \n\nRolls out optical interconnects for Mi500 in 2027. From channel checks, AMD is heading down to the CPO route (seems likely to use Ayar).  \n\n- $ORCL wins $7B Department of War enterprise software contract\n\n- JX metal doubles semi target capacity at its KR subsidary with a 4B yen investment, with operations to begin H2 2027, amid surging demand from major customers Samsung Electronics and SK Hynix\n\n- Tungsten hexafluoride spot prices surged 2.1-2.5x Y/Y following Japan's Kanto Denka and Chuo Gas announcing permanent production halts. Fluorinated liquid supply faces a vacuum as 3M plans to exit PFAS production. \n\n- From the four optical chipmaker earnings, Yuanjie/Eoptolink/TFC Optical/Dongshan Precision: no major order cuts, 1.6T shipments expected to accelerate into 2027. Optical chip suppliers expected to capture outsized margins from shortages. \n\n- Unitree Robotics Targets 30,000 Humanoid Robot Production Capacity by 2026. Read through on humanoid TAM scaling like $CCXI and others. \n\n- Energy storage lithium batteries orders increase first half orders by 2,900% apparently in China. Not as familiar with EVE Energy and other battery makers.","zh":"一些新聞重點整理：\n\n- 如果你喜歡中國記憶體，$CXMT 明天 IPO。\n\n- 據報三星電子難以取得大尺寸 FC-BGA 載板。傳 Ibiden（4062）要求提供 LTA（長期供貨合約）保證，三星電機則被要求預付款。\n\n- 三星與 $AVGO 簽訂記憶體加晶圓代工的 AI 框架協議，效期至 2030 年，規模預計超過 2,000 億美元\n\n- $SOI 預期 2027 財年矽光子營收將較前一年翻倍，超越摩根士丹利 60% 的成長預估。光子論點爽爆。\n\n- SK 集團與 $NVDA 簽訂逾 5,000 億美元的合作案，共同建置 AI 資料中心與 HBM4 記憶體。\n\n- 據報 SKC Absolics 的玻璃核心延至 2027 年。目標年底完成最終可靠度測試，明年量產。所以如果你好奇的話，這確實延後了 $LPK 等公司的部分放量時程（也因此財報後下跌）。\n\n- $QCOM 因上游供應商漲價，智慧型手機處理器價格調漲雙位數百分比。\n\n- $META 預計為德州艾爾帕索的 AI 資料中心擴建，發行 120 億美元的專案級／特殊目的公司融資\n\n- Naver 宣布獲得 $NVDA 與 Brookfield 100 億美元投資，興建 1GW 等級的 AI 工廠。近期計畫是 2028 年前完成 200MW。（Nvidia 投資 10 億美元，Brookfield 為無約束力的 90 億美元）\n\n- 64GB DDR5 伺服器模組價格較 6 月底的合約價上漲 146%\n\n- $INTC 將 14A 製程量產時程提前一年，2027 下半年風險試產、2028 年量產，原本市場預期是 2029 年才量產。\n\n- 三星電機拿下 2 億美元 MLCC 訂單（既有瓶頸）。\n\n- $AMD（頭巾瓶頸本尊）宣布 Helios 已全面投產，2026 年第三季出貨。包括與 Anthropic 最高 2GW 的 MI455X GPU 部署，以及與 OpenAI 的 6GW 基礎設施建置。並給出 CPU 市場複合年成長率逾 50% 的新 TAM 預估，從 2025 年的 260 億美元成長到 2030 年的 2,200 億美元。\n\n2027 年為 MI500 導入光互連。從通路查訪來看，AMD 正朝 CPO（共封裝光學）路線前進（看來很可能會用 Ayar）。\n\n- $ORCL 拿下美國國防部 70 億美元的企業軟體合約\n\n- JX 金屬以 40 億日圓投資將其韓國子公司的半導體目標產能翻倍，2027 下半年開始營運，以因應三星電子與 SK 海力士等大客戶的需求激增\n\n- 在日本關東電化與中央瓦斯宣布永久停產後，六氟化鎢現貨價格年增 2.1-2.5 倍。而隨著 3M 計畫退出 PFAS 生產，氟化液的供給面臨真空。\n\n- 從源杰、新易盛、天孚通信、東山精密四家光晶片廠的財報來看：沒有重大砍單，1.6T 出貨預計將加速進入 2027 年。光晶片供應商預計將因短缺而攫取超額利潤。\n\n- 宇樹科技目標在 2026 年前達到 3 萬台人形機器人產能。這對 $CCXI 等公司的人形機器人 TAM 擴張是個參考讀數。\n\n- 據說中國儲能鋰電池上半年訂單成長 2,900%。我對億緯鋰能等電池廠不太熟。","likes":1290,"views":503257,"reposts":88,"q":null},{"id":"2080750537121874206","ts":"2026-07-24T20:22:41.000Z","url":"https://x.com/aleabitoreddit/status/2080750537121874206","text":"There you have it, $GOOGL Waymo to explore split with $UBER per FT.\n\nMy view last year was that Uber partnering with Waymo was a bad choice… since Uber would just serve as a distribution funnel that Google needed as they scale up.\n\nAnd that $NBIS Avride, other neutral players, or vertical integration would be the optimal path forward.\n\nNow their own partner Waymo looks to be the strongest disruptor to Uber.","zh":"果然來了，根據英國《金融時報》，$GOOGL 的 Waymo 正在研究與 $UBER 拆夥。\n\n我去年的看法是，Uber 與 Waymo 合作是個錯誤的選擇⋯⋯因為在 Google 擴張規模的過程中，Uber 只會淪為 Google 需要的流量漏斗。\n\n而 $NBIS 的 Avride、其他中立玩家、或垂直整合，才是最理想的路徑。\n\n現在他們自己的合作夥伴 Waymo，看起來反而成了 Uber 最強的顛覆者。","likes":914,"views":688945,"reposts":43,"q":"aleabitoreddit：@Jason I'm 100% sure $UBER would not partner with Waymo in all cities. If you were Uber, why would you funnel all your users into the Waymo app one day?\n\nInstead of partnering with another FSD-4 player $NBIS avride that they partially own + doesn't have a standalone competitor? h"},{"id":"2080689966045348047","ts":"2026-07-24T16:21:59.000Z","url":"https://x.com/aleabitoreddit/status/2080689966045348047","text":"Jensen from $NVDA has joined X for the first time to share his letter on open models.","zh":"$NVDA 的黃仁勳首次加入 X，分享他關於開放模型的公開信。","likes":1357,"views":651543,"reposts":40,"q":"JensenHuang：For my first post, I’m sharing a letter @NVIDIA signed on why open models matter.\n\nAI will transform every industry, power every company, and be built by every country.\n\nOpen models strengthen safety and cybersecurity, accelerate innovation and diffusion, and enable sovereignty.\n"},{"id":"2080445777395298454","ts":"2026-07-24T00:11:40.000Z","url":"https://x.com/aleabitoreddit/status/2080445777395298454","text":"Not exactly for $AAOI (they're working on CPO too, just a little further behind in commercialization).\n\nThere's a podcast that featured the $SIVE CEO recently called: \"Market Insights: Photonics & AI\".\n\nMost interesting take was: \n\n\"Pluggables will be around for the next 10 years\".\n\nThere's a lot of CPO + RNG/MRC optimization TAM cannablization arguments for pluggables recently, but looks like it's here to stay.\n\nAnd that there's going to be multiple architecture paths going forward (CEO also NPO alongside CPO as an major opportunity in the next 5 years). \n\nAs for challenges: Vickram stated manufacturing capacity + availability of raw material is the main bottleneck. Likely referencing the existing bottlenecks with upstream CW laser ramp. \n\nFrom the podcast, seems like a large focus was on pluggable markets due to larger near-term TAM (which is understandable with $JBL + other players), with CPO being the north star. \n\nSo it might be interesting if $SIVE M&A ambitions were to acquire more pluggable optical transceiver IP, like what $LITE did with Cloud Light.\n\nBut TLDR:\n\nLot of different paths moving forward, pluggable here to stay, CPO seems like North Star for where industry is heading. \n\nFeels like there's room for every qualified laser supplier given the industry demand is growing faster than what they can all collectively make.","zh":"對 $AAOI 來說不完全是這樣（他們也在做 CPO，只是商業化進度稍微落後一點）。\n\n最近有個 podcast 訪問了 $SIVE 執行長，節目叫「Market Insights: Photonics & AI」。\n\n最有意思的觀點是：\n\n「可插拔模組未來 10 年都還會存在。」\n\n近期有很多關於 CPO 加上 RNG／MRC 最佳化會吃掉可插拔模組 TAM（總潛在市場）的論點，但看來它是不會消失的。\n\n而且未來會有多條架構路線並存（執行長也把 NPO（近封裝光學）與 CPO 並列為未來 5 年的重大機會）。\n\n至於挑戰：Vickram 表示製造產能與原料供給是主要瓶頸。這很可能是在指上游 CW（連續波）雷射放量的既有瓶頸。\n\n從 podcast 聽起來，重心大多放在可插拔市場，因為近期 TAM 較大（考量到 $JBL 等業者，這也可以理解），而 CPO 則是北極星。\n\n所以如果 $SIVE 的併購企圖是要取得更多可插拔光收發模組的智慧財產，就像 $LITE 收購 Cloud Light 那樣，那會很有意思。\n\n但總結來說：\n\n未來有很多不同路線，可插拔模組不會消失，CPO 看起來是產業前進的北極星。\n\n感覺每一家通過認證的雷射供應商都還有空間，因為產業需求成長的速度，比他們全部加起來能生產的速度還快。","likes":1130,"views":640374,"reposts":63,"q":"Std4ge：@aleabitoreddit Is AAOI in trouble if CPO is coming soon?"},{"id":"2080440952859365612","ts":"2026-07-23T23:52:30.000Z","url":"https://x.com/aleabitoreddit/status/2080440952859365612","text":"RT @AMD: The feeling’s mutual. 🤝","zh":"轉推 @AMD：我們也有同感 🤝","likes":0,"views":48152,"reposts":64,"q":null},{"id":"2080394259535221222","ts":"2026-07-23T20:46:57.000Z","url":"https://x.com/aleabitoreddit/status/2080394259535221222","text":"From $AMD Advancing AI, channel checks:\n\nHelios networking partners told me they expect AMD to pursue CPO for future generations of Helios scale up networking. \n\nAnd expects other hyperscalers + industry to go down the CPO route.\n\nOne AI infra executive at a company involved in a hyperscaler CPO programs said they had seen no indication of CPO scale up supply chain delays.\n\nPushing back on recent 3rd party delay reports.\n\nThis was informal commentary, not official AMD or partner guidance.","zh":"來自 $AMD Advancing AI 活動的通路查訪：\n\nHelios 的網路合作夥伴告訴我，他們預期 AMD 未來世代的 Helios 縱向擴展網路會採用 CPO（共封裝光學）。\n\n而且預期其他超大規模業者與整個產業也會走上 CPO 路線。\n\n一位任職於參與超大規模業者 CPO 專案公司的 AI 基礎設施主管表示，他們並未看到任何 CPO 縱向擴展供應鏈延遲的跡象。\n\n這反駁了近期第三方的延遲報導。\n\n以上為非正式談話內容，並非 AMD 或其合作夥伴的官方指引。","likes":965,"views":268547,"reposts":36,"q":null},{"id":"2080379612736221325","ts":"2026-07-23T19:48:45.000Z","url":"https://x.com/aleabitoreddit/status/2080379612736221325","text":"$AMD reached out directly to hand me some special swag!\n\nApparently they only made 30 of these bandanas? \n\nI love AMD and Lisa Su now. https://t.co/KgcYjBUcTv","zh":"$AMD 直接聯繫我，要送我一些特別的周邊！\n\n聽說這款頭巾他們只做了 30 條？\n\n我現在愛上 AMD 和蘇姿丰了。","likes":2540,"views":922449,"reposts":69,"q":null},{"id":"2080334612807758136","ts":"2026-07-23T16:49:57.000Z","url":"https://x.com/aleabitoreddit/status/2080334612807758136","text":"I have this feeling that Lisa from $AMD likes AI.\n\nIt’s cool getting to meet some of you at the event! https://t.co/AWdGS349xF","zh":"我有種感覺，$AMD 的蘇姿丰很喜歡 AI。\n\n在活動上見到你們其中一些人真的很棒！","likes":1757,"views":339986,"reposts":35,"q":null},{"id":"2080153334888182065","ts":"2026-07-23T04:49:37.000Z","url":"https://x.com/aleabitoreddit/status/2080153334888182065","text":"$INTC and $AMD to sign CPU LTAs with Chinese customers for AI DCs (Reuters). \n\n- Prices of some CPU products have risen more than 40% in China since the start of the year from sources. \n\n- Month-on-month increases topping 10% for some products\n\nCPUs were already a bottleneck, following CPU ratios due to AI inference... \n\nBut the broader trend of LTAs seems to be appearing from: \n\n- Memory, with $MU, Samsung, $SNDK, and SK Hynix signing DRAM/NAND LTAs.\n\n- Photonics, with $LITE, $COHR signing EML LTAs. And recent Trendforce reports that $AMD and hyperscalers are now pursuing CW LTAs. \n\nAnd I'm sure there's many more from MLCCs to all the way to substrates. \n\n+1 for the bottleneck investors... hard to be a \"bubble that pops\" if you have take or pay demand spanning multiple years.","zh":"$INTC 與 $AMD 將與中國客戶簽訂 AI 資料中心用的 CPU LTA（長期供貨合約）（路透社）。\n\n- 消息人士指出，部分 CPU 產品在中國的價格自年初以來已上漲超過 40%。\n\n- 某些產品的月增幅甚至超過 10%。\n\nCPU 本來就已經是瓶頸了，這跟 AI 推論所需的 CPU 配比有關⋯⋯\n\n但更廣泛的長約趨勢看起來正在浮現：\n\n- 記憶體方面，$MU、三星、$SNDK 和 SK 海力士都在簽 DRAM／NAND 長約。\n\n- 光子方面，$LITE、$COHR 已簽 EML（電吸收調變雷射）長約。而 TrendForce 近期報告指出，$AMD 與超大規模業者現在也在追 CW（連續波）雷射的長約。\n\n而我相信從 MLCC 一路到載板，還有更多類似的例子。\n\n瓶頸投資人再得一分⋯⋯當你手上握有橫跨多年的照付不議需求時，很難說這是一個「會破的泡沫」。","likes":1201,"views":416173,"reposts":94,"q":null},{"id":"2080149813065396454","ts":"2026-07-23T04:35:37.000Z","url":"https://x.com/aleabitoreddit/status/2080149813065396454","text":"Just some notes from $TSLA transcripts:\n\nElon Musk: \"I think Optimus will be the biggest product ever\" from Q2 earnings transcripts.\n\nEven from Q1, Elon Stated: \"I think Optimus will be our biggest product. Not just Tesla's biggest product ever, but probably the biggest product ever.\n\nAnd I remain convinced of that conclusion\". \n\nIt's very rare to see such high conviction reiterated from Elon regarding humanoids both directionally and TAM-wise.\n\nIn terms of upstream suppliers opportunities, Karn Budhiraj, VP of $TSLA supply chains stated: \n\n\"We’re seeing the same level of investment going to memory and also new specific items like metal injection molded parts, flexible printed circuits, and all sorts of nonlinear technologies...\" \n\nAnd that they had to build new supply chains from scratch. So would be interesting to look at for new supply chain supplier opportunities apart from the known ones.  \n\nJust pulled older slides and it looks like capacity targets for Fremont are 1M and Giga Texas was 10M, so at scale, $TSLA seems to be the clear US leader. If you're looking at that S-Curve opportunity ramp. \n\nOn a side note, Elon also gave a shoutout to $MU with likely reasonably priced LTAs, given his statement: \n\n\"We really appreciate Micron making room for Tesla in the years to come and giving us actually a very significant allocation on reasonable terms given the pretty insane pricing of memory these days.\" (Just for structural memory demand).  \n\nElon also gave a shoutout to Panasonic which had invested many billions in increasing battery cell production (will need to do deeper DD into Panasonic after this), then Samsung and $TSM. \n\nJust takeaways from Tesla earnings TLDR: \n\nElon tends to be directionally correct on where the future is heading, such as with EV or Space. \n\nHe seems extremely bullish on humanoids.","zh":"$TSLA 法說逐字稿的一些筆記：\n\n馬斯克在第二季法說中表示：「我認為 Optimus 會是史上最偉大的產品」。\n\n早在第一季，馬斯克就說過：「我認為 Optimus 會是我們最大的產品。不只是特斯拉史上最大的產品，而可能是史上最大的產品。\n\n我至今仍然堅信這個結論。」\n\n很少看到馬斯克針對人形機器人，在方向與 TAM（總潛在市場）兩個層面上反覆表達這麼高的信心。\n\n關於上游供應商的機會，$TSLA 供應鏈副總裁 Karn Budhiraj 表示：\n\n「我們看到同樣規模的投資正流向記憶體，以及一些新的特定品項，像是金屬射出成型零件、軟性印刷電路板，還有各式各樣的非線性技術⋯⋯」\n\n而且他們必須從零開始建立新的供應鏈。所以除了已知的那些之外，去找新的供應鏈供應商機會應該會很有意思。\n\n我剛翻了舊簡報，Fremont 廠的產能目標是 100 萬台、德州超級工廠是 1,000 萬台，所以規模化之後，$TSLA 看起來是美國明確的領導者。如果你在看 S 曲線的爬坡機會的話。\n\n另外，馬斯克也點名感謝 $MU，看來是拿到了價格合理的 LTA（長期供貨合約），因為他說：\n\n「我們非常感謝美光在未來幾年為特斯拉騰出空間，而且在現在記憶體價格這麼瘋狂的情況下，還以合理的條件給了我們相當可觀的配額。」（純粹就結構性記憶體需求而言。）\n\n馬斯克也點名感謝了投入數十億美元擴充電池芯產能的 Panasonic（這之後得對 Panasonic 做更深入的 DD 盡職調查），接著是三星和 $TSM。\n\n特斯拉財報重點總結：\n\n馬斯克對未來走向的判斷通常在方向上是對的，像電動車或太空產業都是。\n\n而他看起來對人形機器人極度看多。","likes":1818,"views":465236,"reposts":128,"q":null},{"id":"2080035769062916479","ts":"2026-07-22T21:02:27.000Z","url":"https://x.com/aleabitoreddit/status/2080035769062916479","text":"$GOOGL updates FY 2026 capex guidance:\n\nTo $195B-$205B. Up from $180B-$190B. \n\nGoogle is also expected to significantly increase capex in 2027.  \n\nThis is perhaps the most bullish read through on upstream semis from a hyperscaler. https://t.co/dXiI0Ien8X","zh":"$GOOGL 更新 2026 財年資本支出財測：\n\n上調至 1,950-2,050 億美元，原本是 1,800-1,900 億美元。\n\nGoogle 預計 2027 年還會大幅增加資本支出。\n\n這大概是超大規模業者能給出的、對上游半導體最強的利多讀數。","likes":2366,"views":420035,"reposts":193,"q":null},{"id":"2080031508656746874","ts":"2026-07-22T20:45:31.000Z","url":"https://x.com/aleabitoreddit/status/2080031508656746874","text":"$GOOGL now has 950M monthly Gemini users and processes 22B API tokens/min. \n\nCompared to 750M back in February. \n\nAbsurd growth adding 200 million more users in a few months.  Kinda explains why they ran out of compute, then cut allocations to $META and others. \n\nVery unlikely AI capex will slow down given.","zh":"$GOOGL 現在有 9.5 億 Gemini 月活躍用戶，每分鐘處理 220 億個 API token。\n\n相較之下，2 月時是 7.5 億。\n\n短短幾個月增加 2 億用戶，成長幅度誇張。\n\n某種程度上也解釋了為什麼他們算力會用完，然後削減 $META 等客戶的配額。\n\n照這樣看，AI 資本支出極不可能放緩。","likes":2106,"views":591973,"reposts":174,"q":"aleabitoreddit：$GOOGL reported earnings today:\n\nEPS: $9.11 actual vs $2.91 expected - retail reactions to EPS blowout is kinda just accounting noise, since $SPCX, Anthropic, and others were likely large contributors. \n\nRevenue: $119.7B actual vs. $116.98B expected\n\nGoogle Cloud Revenue: $24.77B"},{"id":"2080027058063958323","ts":"2026-07-22T20:27:50.000Z","url":"https://x.com/aleabitoreddit/status/2080027058063958323","text":"$GOOGL reported earnings today:\n\nEPS: $9.11 actual vs $2.91 expected - retail reactions to EPS blowout is kinda just accounting noise, since $SPCX, Anthropic, and others were likely large contributors. \n\nRevenue: $119.7B actual vs. $116.98B expected\n\nGoogle Cloud Revenue: $24.77B +82% Y/Y, vs. 63-65% expected ($22.2-$22.6B) - this is a very large beat and most material part so far. \n\nCloud Operating Income: ~$8.81B, implying 35.6% margin vs. 32.9% Q1. \n\nCapex: $44.92B vs ~$44.15B (basically in line).\n\nSo initial read through is Google Cloud accelerating growth with expanding margins is genuinely bullish for AI demand.\n\nTheir former $180-$190B capex guidance is already extremely large, and as long as we get around these numbers in the earnings call + forward projections... \n\nShould be good to go for $LITE and the other optics/networking trade. (eg. last earnings, they said DC and networking would be ~40% of capex spend). \n\nHyperscaler earnings transcripts are probably the most important thing to pay attention to with the AI capex trade. \n\nAnd that should be in 3 minutes.","zh":"$GOOGL 今天公布財報：\n\nEPS：實際 9.11 美元 vs 預期 2.91 美元——散戶對 EPS 大幅超標的反應其實只是會計上的雜訊，因為 $SPCX、Anthropic 等很可能是主要貢獻來源。\n\n營收：實際 1,197 億美元 vs 預期 1,169.8 億美元\n\nGoogle 雲端營收：247.7 億美元，年增 82%，遠高於預期的 63-65%（222-226 億美元）——這是幅度非常大的超標，也是目前為止最有實質意義的部分。\n\n雲端營業利益：約 88.1 億美元，營益率 35.6%，優於第一季的 32.9%。\n\n資本支出：449.2 億美元 vs 預期約 441.5 億美元（基本上符合預期）。\n\n所以初步判讀是：Google 雲端在利潤率擴張的同時還在加速成長，這對 AI 需求是實實在在的利多。\n\n他們先前 1,800-1,900 億美元的資本支出財測本來就極為龐大，只要法說會與前瞻預估維持在這個數字附近⋯⋯\n\n對 $LITE 和其他光通訊／網路交易來說應該就沒問題了。（例如上次財報他們說資料中心與網路約佔資本支出的 40%。）\n\n在 AI 資本支出這條交易線上，超大規模業者的法說逐字稿大概是最值得關注的東西。\n\n而那應該再 3 分鐘就開始了。","likes":2082,"views":910028,"reposts":121,"q":null},{"id":"2079947242455335379","ts":"2026-07-22T15:10:40.000Z","url":"https://x.com/aleabitoreddit/status/2079947242455335379","text":"$AMD to invest $5B in Anthropic.\n\nAnthropic in turn will sign a 2 GW deal to buy AMD’s latest chips, worth tens of billions of dollars.\n\nLooks like they’re copying the $NVDA playbook with Anthropic last year. https://t.co/SXBUq65u6P","zh":"$AMD 將投資 Anthropic 50 億美元。\n\n作為交換，Anthropic 將簽下 2GW 的協議採購 AMD 最新晶片，價值數百億美元。\n\n看來他們是在複製 $NVDA 去年對 Anthropic 的那套劇本。","likes":1261,"views":313929,"reposts":76,"q":null},{"id":"2079673469567226149","ts":"2026-07-21T21:02:48.000Z","url":"https://x.com/aleabitoreddit/status/2079673469567226149","text":"OpenAI models reportedly escaped from its controlled environment, with no internet access.\n\nExploited zero day vulnerabilities and hacked into Hugging Face to cheat on benchmarks.\n\nHugging face then used China GLM models to carry out its defense. \n\nOpenAI said it was an “an unprecedented cyber incident.”\n\nWe’re getting closer and closer to Skynet. \n\nAnd I’m sure markets will love it.","zh":"據報 OpenAI 的模型從其受控環境中逃脫，而該環境並沒有連上網路。\n\n它利用零時差漏洞入侵 Hugging Face，藉此在基準測試上作弊。\n\nHugging Face 隨後動用中國的 GLM 模型進行防禦。\n\nOpenAI 稱這是「一起前所未見的網路事件」。\n\n我們離天網愈來愈近了。\n\n而且我相信市場一定會很愛這個消息。","likes":2704,"views":552989,"reposts":218,"q":null},{"id":"2079622706572804368","ts":"2026-07-21T17:41:05.000Z","url":"https://x.com/aleabitoreddit/status/2079622706572804368","text":"Wow, a historic single day recovery.\n\n$SIVEF +30.89%\n$IQEF +28.6%\n$AEHR +26.53%\n$CIFR +17.82%\n$NBIS +17.3%\n$AAOI +15.6%\n$LPK +14.48%\n$AXTI +14.12%\n$MU +12.54%\n$SNDK +12.8%\n$SOI +11.1%\n$TSEM +10.39%\n$LITE +9.25%\n$INTC +8.22%\n$AMD +8.11%\n$MRVL +7.27%","zh":"哇，史詩級的單日反彈。\n\n$SIVEF +30.89%\n$IQEF +28.6%\n$AEHR +26.53%\n$CIFR +17.82%\n$NBIS +17.3%\n$AAOI +15.6%\n$LPK +14.48%\n$AXTI +14.12%\n$MU +12.54%\n$SNDK +12.8%\n$SOI +11.1%\n$TSEM +10.39%\n$LITE +9.25%\n$INTC +8.22%\n$AMD +8.11%\n$MRVL +7.27%","likes":4572,"views":718007,"reposts":262,"q":null},{"id":"2079495178793201678","ts":"2026-07-21T09:14:20.000Z","url":"https://x.com/aleabitoreddit/status/2079495178793201678","text":"It's slightly more nuanced. Basically, $AMD SF event is tomorrow, Wed/Thurs (July 22, 23).\n\nFrom Jefferies client note, AMD is expected to provide additional disclosures around their likely scale-up CPO roadmap + MI500. \n\nIf they confirm CPO route, would positive thematically since it's not just $NVDA forcing the transition. \n\nAs for $SIVE, we'll get a better read if they're directly in AMD supply chains. \n\nSince right now, it's possible to map it through $GFS (reportedly involved in AMD MI500 CPO work) or AYAR (which AMD invested in). But no formal confirmations. \n\nSo if you're turning in: \n\n- CPO thematic positive: MI500 explicitly commits to CPO/optical UALink.\n\n- AMD gives details using Ayar Labs or GF SCALE for MI500 CPO:  That would be extremely positive for $SIVE, given they're the upstream laser supplier / reference laser.  \n\nCurrently, Blayne Curtis from Jefferies expect AMD to work with $ALAB on UAL and $AVGO on ESUN... but juicy details are here: \n\n\"We are looking for whether AMD commits to a CPO based scale up solution and who supplies the optical engine\"\n\nWe'll get a broader read through on the supply chain come Wednesday/Thursday, too early to tell today.","zh":"這件事稍微複雜一點。基本上，$AMD 的舊金山活動就在明天，週三／週四（7 月 22、23 日）。\n\n根據 Jefferies 給客戶的報告，AMD 預計會針對他們可能的縱向擴展 CPO（共封裝光學）路線圖與 MI500 提供更多揭露。\n\n如果他們確認走 CPO 路線，對整個主題是正面的，因為這代表不是只有 $NVDA 在推動這場轉換。\n\n至於 $SIVE，我們可以藉此更清楚判斷他們是否直接在 AMD 的供應鏈裡。\n\n因為目前只能透過 $GFS（據報參與 AMD MI500 的 CPO 工作）或 AYAR（AMD 有投資）來推測，但都沒有正式確認。\n\n所以如果你要關注的話：\n\n- CPO 主題面利多：MI500 明確承諾採用 CPO／光學 UALink。\n\n- AMD 說明 MI500 的 CPO 使用 Ayar Labs 或 GF SCALE：這對 $SIVE 會是極度正面的消息，因為他們是上游雷射供應商／參考雷射設計。\n\n目前 Jefferies 的 Blayne Curtis 預期 AMD 會在 UAL 上與 $ALAB 合作、在 ESUN 上與 $AVGO 合作⋯⋯但真正的重點在這句：\n\n「我們想知道 AMD 是否會投入以 CPO 為基礎的縱向擴展方案，以及由誰供應光引擎」\n\n週三／週四我們會對供應鏈有更全面的判讀，今天下定論還太早。","likes":992,"views":558111,"reposts":60,"q":"HealytheGOATT：@aleabitoreddit You going to unpack the AMD - GFS news? Looks pretty tasty for sivers…"},{"id":"2079479755481776221","ts":"2026-07-21T08:13:03.000Z","url":"https://x.com/aleabitoreddit/status/2079479755481776221","text":"Memory names from Kioxia finished up a whopping +17.18%. Samsung up +6.15%. \n\nOptical networking from $SIVE, $LITE, and $AAOI are showing signs of recovery, all up 4%+. \n\nNeoclouds from $NBIS to $IREN all up 4%+ premarket. \n\n$INTC to $AMD to $MRVL all up 4%+. \n\nDoes the Cramer effect work on the entire AI trade?","zh":"以鎧俠為首的記憶體股大漲 17.18%。三星上漲 6.15%。\n\n從 $SIVE、$LITE 到 $AAOI 的光通訊網路股出現復甦跡象，全部上漲 4% 以上。\n\n從 $NBIS 到 $IREN 的 neocloud（新型雲端算力商）盤前也全都上漲 4% 以上。\n\n$INTC、$AMD、$MRVL 同樣全部上漲 4% 以上。\n\n難道 Cramer 效應對整個 AI 交易都有效？","likes":2189,"views":593365,"reposts":111,"q":"jimcramer：Miserable close... Miserable market for the moment. watch tonight...."},{"id":"2079319999915925938","ts":"2026-07-20T21:38:14.000Z","url":"https://x.com/aleabitoreddit/status/2079319999915925938","text":"If you’re curious why $NBIS is up after hours.\n\n$NVDA disclosed it owns 9.3% beneficial ownership of Nebius via SEC filings.\n\nNot exactly too new since it dates back to Nvidia’s existing share position of 1.19M shares + $2B prefunded warrant of ~21M shares.\n\nBut great for sentiment having Nvidia be a large shareholder of the Neocloud leader.","zh":"如果你好奇 $NBIS 為什麼盤後上漲。\n\n$NVDA 透過 SEC 申報文件揭露，他們持有 Nebius 9.3% 的實質受益股權。\n\n這其實不算太新的消息，因為這可以追溯到 Nvidia 既有的 119 萬股持股，加上約 2,100 萬股的 20 億美元預付權證。\n\n但有 Nvidia 這個大股東，對這家 neocloud 龍頭的市場情緒來說是很棒的事。","likes":2034,"views":419691,"reposts":136,"q":null},{"id":"2079289335351062693","ts":"2026-07-20T19:36:23.000Z","url":"https://x.com/aleabitoreddit/status/2079289335351062693","text":"TBH, casually posting novel information discovery to X is how research should be done. \n\nApparently this was #16 on the Smale's list of Mathematical Problems for the Next Century?\n\nKinda shows that the value generated from AI does not scale linearly with token costs... After seeing this, bears are still probably going to say: \n\n\"B-but where's the profit coming from after AI usage?\"\n\nAI + capex is likely going to keep going brrr.","zh":"老實說，隨手在 X 上發表新發現的資訊，才是研究該有的樣子。\n\n據說這是「下個世紀的 Smale 數學問題清單」上的第 16 題？\n\n某種程度上顯示了 AI 產生的價值並不會跟 token 成本呈線性關係⋯⋯看完這個之後，空方大概還是會說：\n\n「可、可是 AI 用完之後獲利在哪裡？」\n\nAI 加上資本支出，大概會繼續爽爆下去。","likes":701,"views":407847,"reposts":36,"q":"__alpoge__：hello there the jacobian conjecture is false thanx to my close friend akhil for asking about it and my other close friend fable for working during the world cup final\n\n((1+xy)^3 z + y^2 (1+xy) (4+3xy), y + 3 x (1+xy)^2  z + 3 x y^2 (4+3xy), 2 x - 3 x^2 y - x^3 z): \\C^3\\to \\C^3, h"},{"id":"2079254669793316962","ts":"2026-07-20T17:18:38.000Z","url":"https://x.com/aleabitoreddit/status/2079254669793316962","text":"$IREN +19.69% after revising ARR target to $4B+ from new AI cloud contracts. Its customer base now includes Microsoft, Nvidia, Perplexity, and Figure.\n\n$HUT +10.45% off a 15Y $9.8B AI DC lease\n\n$CIFR +16.76%\n$CLSK +13.7%\n$WYFI +9.18%\n\n$NBIS and $CRWV are taking their time in the shower.\n\nBut does look like Neoclouds/Colo players are sharply recovering following new catalysts, such as Kimi compute shortage news and new contracts.","zh":"$IREN 上漲 19.69%，因新的 AI 雲端合約把 ARR（年化經常性收入）目標上修到 40 億美元以上。其客戶群現在包括微軟、Nvidia、Perplexity 和 Figure。\n\n$HUT 上漲 10.45%，簽下 15 年、98 億美元的 AI 資料中心租約\n\n$CIFR 上漲 16.76%\n$CLSK 上漲 13.7%\n$WYFI 上漲 9.18%\n\n$NBIS 和 $CRWV 還在慢慢洗澡。\n\n但看起來 neocloud（新型雲端算力商）／代管業者在 Kimi 算力短缺新聞與新合約等催化劑之後，正強勁反彈。","likes":1698,"views":438925,"reposts":106,"q":null},{"id":"2079089592385610023","ts":"2026-07-20T06:22:41.000Z","url":"https://x.com/aleabitoreddit/status/2079089592385610023","text":"Some updates on bottleneck timelines: \n\n- ABF substrates: 1 year \n/ eg. Ajinomoto (2802) for ABF film, Ibiden, Unimicron, Nan Ya PCB, etc make the substrates \n\n- HDI Boards: Over 6 months \n/ Victory Giant (300476), Zhen Ding (4958), Unimicron, Compeq (2313), Meiko (6787)\n\n- Multilayer boards: ~6 months \n/ Victory Giant, WUS (002463), $TTMI, Gold Circuit Electronics (2368), \n\n- CCL: Over 6 months (severe shortages of materials) \n/ Elite Material (2383), Shengyi (600183), TUC (6274), ITEQ (6213), Nan Ya Plastics (1303), Resonac (4004)\nMitsui Kinzoku (5706) / HVLP copper foil.  Nittobo / glass fiber/cloth\n\n- MLCCs, chip resistors, tantalum capacitors, aluminum electrolytic capacitors: 15-20 weeks to 1 year+\n\nMLCC: Murata (6981), Samsung Electro-Mechanics, TDK (6762), Taiyo Yuden (6976), Yageo (2327), Walsin (2492)\nChip Resistors: Yageo, Walsin, KOA (6999), Rohm (6963) and $VSH\nTantalum capacitors: Kyocera/AVX, Yageo/KEMET, $VSH again\n\nAluminum electrolytic capacitors: Nippon Chemi-Con (6997) Nichicon (6996) | Timelines sourced from Digitimes, did the honors of adding in related companies. \n\nBut it's slightly more nuanced since MLCCs and others mix. in commodity types vs. AI DCs.\n\nRegardless, just some helpful mapping.","zh":"一些瓶頸交期的更新：\n\n- ABF 載板：1 年\n／例如味之素（2802）提供 ABF 膜，而載板由 Ibiden、欣興、南亞電路板等製造\n\n- HDI 板：超過 6 個月\n／勝宏科技（300476）、臻鼎（4958）、欣興、健鼎（2313）、名幸電子（6787）\n\n- 多層板：約 6 個月\n／勝宏科技、滬電股份（002463）、$TTMI、金像電（2368）\n\n- CCL（銅箔基板）：超過 6 個月（原料嚴重短缺）\n／台光電（2383）、生益科技（600183）、台燿（6274）、聯茂（6213）、南亞塑膠（1303）、力森諾科（4004）\n三井金屬（5706）／HVLP 銅箔。日東紡／玻璃纖維與玻纖布\n\n- MLCC、晶片電阻、鉭質電容、鋁質電解電容：15-20 週到 1 年以上\n\nMLCC：村田（6981）、三星電機、TDK（6762）、太陽誘電（6976）、國巨（2327）、華新科（2492）\n晶片電阻：國巨、華新科、KOA（6999）、羅姆（6963）以及 $VSH\n鉭質電容：京瓷／AVX、國巨／KEMET，還是 $VSH\n\n鋁質電解電容：日本貴彌功（6997）、尼吉康（6996）｜交期資料來自 Digitimes，相關公司是我另外加上去的。\n\n不過這裡有點微妙，因為 MLCC 等零件會混合一般規格與 AI 資料中心規格。\n\n無論如何，就當作一份好用的對照表。","likes":1025,"views":455472,"reposts":93,"q":null},{"id":"2078914447180263438","ts":"2026-07-19T18:46:43.000Z","url":"https://x.com/aleabitoreddit/status/2078914447180263438","text":"There’s nothing quite like the scent of more AI capex on a Sunday.\n\nProbably some ways to go if leading frontier models are out of capacity from too much demand. https://t.co/d8mnuAQdLz","zh":"沒有什麼比週日聞到更多 AI 資本支出的味道更棒的了。\n\n如果領先的前沿模型都因為需求太大而算力耗盡，那大概還有一段路要走。","likes":2931,"views":531266,"reposts":158,"q":null},{"id":"2078338950150959558","ts":"2026-07-18T04:39:54.000Z","url":"https://x.com/aleabitoreddit/status/2078338950150959558","text":"For anyone watching the 25%+ premium in $SKHY versus SK Hynix's Korean shares:\n\nThe ADRs and local shares become convertible on July 29.\n\nShould open the door for arbitrage and likely compress the ADR premium. Maybe lifting Korean shares or pressuring US shares. \n\n2.5% currently is the US ADR stock, so an additional 22.5% can be converted.","zh":"給正在關注 $SKHY 相對 SK 海力士韓國股票有 25% 以上溢價的人：\n\nADR 與當地股票將在 7 月 29 日開始可以互相轉換。\n\n這應該會打開套利空間，並可能壓縮 ADR 的溢價。也許會拉抬韓股，或是壓低美股。\n\n目前美國 ADR 佔 2.5%，所以還有額外 22.5% 可以轉換。","likes":1470,"views":797956,"reposts":135,"q":null},{"id":"2078283847612186739","ts":"2026-07-18T01:00:56.000Z","url":"https://x.com/aleabitoreddit/status/2078283847612186739","text":"Thanks! I’ve always shared personal research and core thoughts for free. Not trying to sell anything or tell others what to do.\n\nAnd above all, just being transparent about my own returns (win or loss)\n\nMaybe this information democratization upsets some business models…\n\nWhen others try and pitch their $40 TA subscriptions that are always right and predicted the semis crash.\n\nBut if they really believed it, they would have made 5000%+ buying puts and wouldn’t need to market a paywall.\n\nYes, if I’m on 1.4x leverage, and if a portfolio concentrated in memory/photonics underlying crashes -35% on avg… you get a 49% drawdown.\n\nI’m just sharing what happens. \n\nBut I expect AI names to recover since I see demand from compute to energy to memory to networking to be structural.","zh":"謝謝！我一直都是免費分享個人研究和核心想法，沒有想賣什麼東西，也沒有想告訴別人該怎麼做。\n\n而且最重要的是，對自己的報酬（不管賺賠）保持透明。\n\n也許這種資訊民主化讓某些商業模式不太爽⋯⋯\n\n當別人試圖推銷那些「永遠都是對的、而且早就預測到半導體崩盤」的 40 美元技術分析訂閱時。\n\n但如果他們真的相信自己說的，早就買賣權賺 5000% 以上了，
