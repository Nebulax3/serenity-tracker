根本不需要推銷付費牆。\n\n是的，如果我用 1.4 倍槓桿，而一個集中在記憶體／光子的投資組合平均跌了 35%⋯⋯你就會得到 49% 的回檔。\n\n我只是把實際發生的事分享出來。\n\n但我預期 AI 個股會復甦，因為我看到從算力、能源、記憶體到網路的需求都是結構性的。","likes":2247,"views":605550,"reposts":55,"q":"FrancisCashFlow：everybody hating on serenity posting his -49% pnl is so lame to me\n\nits normal to have pullbacks as a trader and he still has a better ytd than all of you\n\nits all jealousy that he's grown to 1m followers and they wish they had the same numbers to sell their shitty substack"},{"id":"2078228019584668121","ts":"2026-07-17T21:19:06.000Z","url":"https://x.com/aleabitoreddit/status/2078228019584668121","text":"Thanks, love reading the comments!\n\nGoldman Sachs raised Innolight PT to 2581 RMB. Roughly 163.6% upside from current valuations.\n\nBut the largest thing is its 2026–2028 earnings est revision raised by a whopping 65%/108%/119%, based on:\n\n-  Much higher silicon photonics module volumes\n- scale out, scale up, scale across volumes\n- 1.6T/3.2T lifting blended ASP + margins\n- increase in AI capex\n\nThis is typically very material read through on the optical sector since:\n\nI tend to think of Innolight as a $TSM (semi capex) type read on how the photonics landscape is doing.\n\nEg. Higher silicon photonics penetration means more TAM for cw lasers like $SIVE (cw) / SOI wafer demand for $SOI. ASP hikes for future gen is positive for the other optical markers too.\n\nThink my other takeaway outside the report was Innolight stating 800g demand was growing more significantly than expected from their transcript on the 12th. \n\nWhich in turn signals more demand for names like $AAOI to $LITE next earnings.\n\nTLDR: GS gives high earnings projections during a time of massive corrections. \n\nFundamentally, broader photonics ecosystem should be happy when it’s ER time.","zh":"謝謝，我很喜歡看大家的留言！\n\n高盛把中際旭創的目標價調高到 2,581 人民幣，相較目前估值約有 163.6% 的上檔空間。\n\n但最重要的是，他們把 2026-2028 年的獲利預估分別上調了驚人的 65%／108%／119%，理由是：\n\n- 矽光子模組出貨量高出許多\n- 橫向擴展、縱向擴展、跨域擴展的量\n- 1.6T／3.2T 拉高混合平均售價與利潤率\n- AI 資本支出增加\n\n這對整個光通訊板塊通常是非常有實質意義的讀數，因為：\n\n我傾向把中際旭創當成光子產業的「$TSM（半導體資本支出）式風向球」。\n\n例如：矽光子滲透率提高，代表 $SIVE（CW 連續波）這類 CW 雷射的 TAM（總潛在市場）更大，也代表 $SOI 的 SOI 晶圓需求更多。而下一代產品的售價調漲，對其他光通訊業者同樣是正面的。\n\n我覺得報告之外的另一個重點，是中際旭創在 12 日的逐字稿裡表示 800G 需求的成長比預期更顯著。\n\n這反過來又預示了 $AAOI 到 $LITE 這些公司下次財報會有更多需求。\n\n總結：高盛在市場大幅修正的時候給出了很高的獲利預估。\n\n就基本面而言，整個光子生態系在財報季到來時應該會很開心。","likes":1110,"views":788082,"reposts":92,"q":"Cedricsx9：@aleabitoreddit long time lurker, just wanted to update you on a recent development: Goldman Sachs updated Innolights price target to an insane 2581 Yuan/share during this downturn. Today's trading session saw the stock trading at 979.46 a share."},{"id":"2078175882620059719","ts":"2026-07-17T17:51:55.000Z","url":"https://x.com/aleabitoreddit/status/2078175882620059719","text":"$META in talks to lease compute to Anthropic in a $10B dollar deal.\n\nSeems like they saw how profitable \n$SPCX $45B compute deal was.\n\nBut just goes to validate Neocloud business models like $NBIS, $IREN, and co if hyperscalers are copying their homework.\n\nSource: NYT https://t.co/3Mu3UXQtFT","zh":"$META 正在洽談以 100 億美元的規模，把算力租給 Anthropic。\n\n看來他們是看到 $SPCX 那筆 450 億美元的算力合約有多賺。\n\n但這也正好驗證了 $NBIS、$IREN 這類 neocloud（新型雲端算力商）的商業模式——如果連超大規模業者都在抄他們的作業的話。\n\n來源：紐約時報","likes":1247,"views":349928,"reposts":77,"q":null},{"id":"2078161322769068533","ts":"2026-07-17T16:54:04.000Z","url":"https://x.com/aleabitoreddit/status/2078161322769068533","text":"Wow, apparently there’s claims ~3.4% of the adult population in Korea faces liquidation risk?\n\n“As of July 13, over 1.2 million leveraged retail traders' accounts hit margin call lines, with 320,000 to 360,000 accounts force-liquidated by brokers.”\n\n(There were other sources claiming this data came from Goldman Sachs desks rather than SK financial supervisory service data)\n\nRegardless, just evidence recent crash was accelerated by liquidation cascades/deleveraging rather than fundamentals:","zh":"哇，據說韓國約有 3.4% 的成年人口面臨強制平倉風險？\n\n「截至 7 月 13 日，超過 120 萬個使用槓桿的散戶帳戶觸及追繳線，其中 32 萬到 36 萬個帳戶已被券商強制平倉。」\n\n（也有其他消息來源說這份數據是來自高盛的交易台，而非韓國金融監督院。）\n\n無論如何，這都證明了近期的崩跌是被強制平倉的連鎖效應／去槓桿所加速，而非基本面問題：","likes":1233,"views":363706,"reposts":67,"q":null},{"id":"2078150537074373117","ts":"2026-07-17T16:11:12.000Z","url":"https://x.com/aleabitoreddit/status/2078150537074373117","text":"Feels bad, -49.4% drawdown this month after the recent crash.\n\nMy portfolio is mainly AI chokepoints and bottlenecks. \n\nIn the memory, photonics, robotics, and upstream semis, (on margin) which all tend to be higher beta than others. But reduced leverage recently from the crash.\n\nI see a lot of people making fun of the drop or AI names, saying it’s obvious that:\n\n- “AI is a bubble”\n- “memory/kospi is a bubble”\n- “photonics is a bubble”\n- “humanoids won’t get anywhere”\n- “neoclouds will get replaced by hyperscalers like Meta”\n\nAnd a bunch of retail + bots saying “sell everything, it’s never going to recover”.\n\nBut I have conviction that all these themes are backed by structural revenue growth or technological shifts.\n\nAnd I’ve had similar drawdowns back when there admin threatened global tariffs, before markets pulled off a recovery.\n\nI personally have a longer horizon + higher tolerance for volatility than others, to see how this plays out.\n\nEspecially considering a lot of retail view things on a week to week basis: no, my thesis isn’t wrong yet if I project revenue inflection in H2 2027 and it’s 2026 now. \n\nAnyway, feels bad short term just wanted to share anyway for transparency.","zh":"心情很差，這個月在近期崩盤後回檔了 49.4%。\n\n我的投資組合主要是 AI 的咽喉點與瓶頸。\n\n集中在記憶體、光子、機器人和上游半導體（有用融資），這些的 beta 通常都比其他標的高。不過崩盤後我最近降低了槓桿。\n\n我看到很多人在嘲笑這波跌勢或 AI 個股，說這不是很明顯嗎：\n\n-「AI 是泡沫」\n-「記憶體／韓股是泡沫」\n-「光子是泡沫」\n-「人形機器人成不了氣候」\n-「neocloud（新型雲端算力商）會被 Meta 這類超大規模業者取代」\n\n還有一堆散戶和機器人帳號在喊「全部賣掉，永遠回不來了」。\n\n但我有信心，這些主題背後都有結構性的營收成長或技術轉換在支撐。\n\n而且在政府揚言要對全球課關稅那次，我也經歷過類似的回檔，之後市場照樣反彈回來。\n\n我個人的投資期限比較長、對波動的容忍度也比較高，會看這件事怎麼發展下去。\n\n尤其考量到很多散戶是用週為單位在看事情：不，如果我預估的營收轉折點在 2027 下半年，而現在是 2026 年，那我的論點還不算錯。\n\n總之，短期是很難受，但為了透明還是分享一下。","likes":8376,"views":2617071,"reposts":364,"q":"aleabitoreddit：Agreed! It’s nice to remember your thesis during a market crash.\n\nFrom my own personal thesis, if $AAOI hits $1.4B quarterly revenue start of Q3 2027. Which is annualized $5.6B off a $8B MC. \n\nIs it “over” for the company if that revenue ramp hasn’t even shown up in the quarterly"},{"id":"2078130772121399553","ts":"2026-07-17T14:52:40.000Z","url":"https://x.com/aleabitoreddit/status/2078130772121399553","text":"Agreed! It’s nice to remember your thesis during a market crash.\n\nFrom my own personal thesis, if $AAOI hits $1.4B quarterly revenue start of Q3 2027. Which is annualized $5.6B off a $8B MC. \n\nIs it “over” for the company if that revenue ramp hasn’t even shown up in the quarterly earnings… when it’s 2026?\n\nSame applies to my CPO sector exposure like $SIVE, an architecture shift led by $NVDA. \n\nIf scale out volume ramps from H2 2026 into 2027, and scale up heavily volume ramps into 2028.\n\nIs it “over” that $0 -> $91B TAM expansion (per GS) hasn’t even hit yet?\n\nWith robotics like Agility, is it over in 2026 if the listing hasn’t even happened yet and humanoids haven’t ramped?\n\nI personally think current market conditions are a reflection of liquidity and leverage, not individual fundamentals.\n\nIt’s brutal for everyone to see KOSPI, TW, Nikkei, and AI, space, robotics sector stocks crash recently. \n\nEspecially when there’s a lot of irrational behavior stemming from those leverage.\n\nIn the end, we can’t tell you what stocks to buy, what timeframe you should sell, how to size your positions, or what you should do. \n\nOnly share personal thoughts or research and track if they get validated over time.\n\nSo it’s extremely important to build your own thesis, since everyone has unique risk tolerance or investing timeframes.\n\nAnd that usually leads to having higher conviction during crashes.","zh":"同意！在市場崩盤時想起自己的論點是件好事。\n\n以我個人的論點來說，如果 $AAOI 在 2027 年第三季初達到 14 億美元的季營收，年化就是 56 億美元，而市值是 80 億美元。\n\n如果那個營收爬坡根本還沒出現在季報上——現在才 2026 年——這家公司就「完蛋了」嗎？\n\n同樣的邏輯也適用於我在 CPO（共封裝光學）板塊的曝險，例如 $SIVE，這是一場由 $NVDA 主導的架構轉換。\n\n如果橫向擴展（scale out）的量從 2026 下半年放到 2027 年，而縱向擴展（scale up）的量在 2028 年才大幅放量。\n\n那麼在那個從 0 到 910 億美元的 TAM（總潛在市場）擴張都還沒發生之前，就說「完蛋了」？（TAM 數字來自高盛）\n\n以 Agility 這類機器人來說，2026 年就說完蛋了？可是掛牌都還沒發生，人形機器人也還沒放量。\n\n我個人認為當前的市場狀況反映的是流動性與槓桿，不是個別公司的基本面。\n\n看到韓國、台灣、日本股市，以及 AI、太空、機器人板塊近期崩跌，對每個人來說都很難受。\n\n尤其當中有很多是源自那些槓桿的非理性行為。\n\n說到底，我們沒辦法告訴你該買什麼股票、該在什麼時間點賣、部位該開多大、或你該怎麼做。\n\n只能分享個人的想法或研究，並追蹤它們是否隨時間被驗證。\n\n所以建立自己的論點極為重要，因為每個人的風險承受度和投資時間框架都不一樣。\n\n而這通常也會讓你在崩盤時擁有更高的信心。","likes":1657,"views":1736410,"reposts":104,"q":"pepemoonboy：Stop panicking.\n\nTake a second and really evaluate what you’re holding in your portfolio.\n\nNow ask yourself…\n\nWhy did you buy it in the first place?\n\nWhat was your investment thesis?\n\nRelax.\n\nTake a deep breath.\n\nDid you buy it for a quick trade?\n\nOr did you invest because you be"},{"id":"2077955479742173422","ts":"2026-07-17T03:16:07.000Z","url":"https://x.com/aleabitoreddit/status/2077955479742173422","text":"Kim Sunwoo of Meritz Securities: \"This Is Not the Time to Sell Samsung Electronics and $SKHY\"\n\nThey claim markets are excessively misunderstanding the situation with semis. And that DRAM shortage will intensify in the second half of this year.  \n\n- H2 2026: \"suppliers can fulfill only 75%–80% of DRAM demand\". \n- 2027: \"fulfillment is expected to fall into the 60% range.\"\n\nIn the article, they attached market forecasts that show SK Hynix with a 2027 3.5x P/E and Samsung a 3.9x P/E. \n\nThink the $INTC CEO said it best around timeframes with his quote \"no relief in memory supply or pricing until at least 2028\". \n\nEspecially after $MU 16 LTAs with favorable take or pay volume contracts... memory demand seems structural.","zh":"Meritz 證券的 Kim Sunwoo：「現在不是賣出三星電子與 $SKHY 的時候」\n\n他們認為市場對半導體的處境有著過度的誤解，而且 DRAM 短缺在今年下半年將會加劇。\n\n- 2026 下半年：「供應商只能滿足 75-80% 的 DRAM 需求」。\n- 2027 年：「滿足率預計將落到 60% 區間。」\n\n文章中附上的市場預估顯示，SK 海力士 2027 年本益比僅 3.5 倍，三星 3.9 倍。\n\n關於時間點，我覺得 $INTC 執行長那句話講得最好：「至少在 2028 年之前，記憶體的供給或價格都不會有任何緩解」。\n\n尤其是在 $MU 簽下 16 份帶有優惠 take-or-pay（照付不議）條件的長約之後⋯⋯記憶體需求看起來是結構性的。","likes":1644,"views":546119,"reposts":152,"q":null},{"id":"2077784594959725056","ts":"2026-07-16T15:57:05.000Z","url":"https://x.com/aleabitoreddit/status/2077784594959725056","text":"My guess is we’re close to market bottom on semis from $INTC to $LITE.\n\nA good indicator is if everyone on $RDDT blew up their portfolios to $0. https://t.co/X1m9Yv1JuX","zh":"我猜從 $INTC 到 $LITE，半導體差不多接近市場底部了。\n\n一個好用的指標是：看 $RDDT 上是不是每個人的投資組合都已經歸零了。","likes":4089,"views":932554,"reposts":224,"q":null},{"id":"2077768896061563339","ts":"2026-07-16T14:54:42.000Z","url":"https://x.com/aleabitoreddit/status/2077768896061563339","text":"Lot of people were curious about $SIVE capacity volume ramp modeling through fab-light (Win Semi + others):\n\nUsing 10% of Win's wafer capacity as a low-end allocation (65% yield assumption, $50-$75 ASP):\n\nSivers would support $341-$512M worth of annual array revenue. Given upper end of managements 50-60%+ gross margin target, would be roughly:\n\n$205–307M of annual gross profit.\n\nAgainst Sivers current ~$1.1B MC, would be ~:\n\n3.6–5.4× MC/gross profit if this capacity scenario plays out in 2028.  \n\nAnd at 15% would be $307–461M in gross profit (2.4–3.6× MC/gross profit)\n\nSivers CEO also replied that they're working with more fabs for capacity. And from an older deck, there looks to be more qualifications since 2024.  \n\nSo capacity targets might be larger than what's stated here as CPO takes off. \n\nI also expect to see revenue pipeline projections hiked in future quarters, as more qualification suppliers to into HVM. \n_\n\nAs for demand side, CW also happens to be very bottlenecked. \n\nLumentum are buying CW off the open market due to EML obligations from their ER transcript. \n\nAnd $AMD are signing LTAs to secure CW capacity (from Trendforce). So when Sivers is ramping with $GFS, $JBL, Ayar, $POET, O-NET and others... \n\nGiven the current constraints, it's highly likely any  independent qualified capacity that comes online would be absorbed.  \n\nAnd as a cherry on top, Morgan Stanley named $SIVE (~$1.1B) as one of the three leading CPO laser players .\n\nAlongside $55B+ players Coherent and Lumentum in their recent note for a reason...\n\n_\n\nTLDR: Sivers only needs a low end allocation from Win to make substantial gross income relative to current valuations. \n\nI think the largest revenue upside that isn't modeled in if they TAM expansion with M&A after US NASDAQ listing. \n\nBy copying the Lumentum playbook with Cloud Light to build out entire transceiver modules or with optical engines.","zh":"很多人好奇 $SIVE 透過輕晶圓廠模式（穩懋等）的產能放量模型：\n\n以穩懋晶圓產能的 10% 作為低標配置（假設良率 65%、售價 50-75 美元）：\n\nSivers 可支撐 3.41-5.12 億美元的年度雷射陣列營收。若以管理層 50-60% 以上毛利率目標的上緣計算，大約是：\n\n年毛利 2.05-3.07 億美元。\n\n對照 Sivers 目前約 11 億美元的市值，大約是：\n\n若這個產能情境在 2028 年實現，市值／毛利約 3.6-5.4 倍。\n\n若配置提高到 15%，毛利則為 3.07-4.61 億美元（市值／毛利 2.4-3.6 倍）\n\nSivers 執行長也回覆說他們正在洽談更多晶圓廠的產能。而從較早的簡報來看，2024 年以來似乎又多了不少認證。\n\n所以隨著 CPO（共封裝光學）起飛，產能目標可能比這裡列的還大。\n\n我也預期未來幾季營收管線的預估會被上調，因為會有更多通過認證的供應商進入量產。\n_\n\n至於需求面，CW（連續波）雷射同樣極度吃緊。\n\n從 Lumentum 的財報逐字稿來看，他們因為 EML（電吸收調變雷射）的供貨義務，正在公開市場上採購 CW。\n\n而根據 TrendForce，$AMD 正在簽 LTA（長期供貨合約）以鎖定 CW 產能。所以當 Sivers 與 $GFS、$JBL、Ayar、$POET、O-NET 等業者一起放量時⋯⋯\n\n在目前的限制條件下，任何獨立且通過認證的產能只要開出來，極可能立刻被吸收掉。\n\n錦上添花的是，摩根士丹利近期報告把市值約 11 億美元的 $SIVE，點名為三大 CPO 雷射玩家之一。\n\n與市值 550 億美元以上的 Coherent 和 Lumentum 並列，這是有原因的⋯⋯\n_\n\n總結：Sivers 只需要從穩懋拿到低標的產能配置，就能相對目前估值產生可觀的毛利。\n\n我認為最大的、還沒被納入模型的營收上檔空間，是他們在美國那斯達克掛牌後透過併購擴大 TAM（總潛在市場）。\n\n也就是複製 Lumentum 收購 Cloud Light 的劇本，往整組收發模組或光引擎發展。","likes":1233,"views":1117864,"reposts":102,"q":"StormDirac：Your assumptions are wrong. Win Semiconductors has a InP capacity of 35.000 wafers per year. Assume even a low number 10% of that is 3500 wafers. There are approximately 3000 CW arrays on a wafer, price per Array >$50. At only 10% of this capacity Sivers could sell for more than "},{"id":"2077753660592033828","ts":"2026-07-16T13:54:10.000Z","url":"https://x.com/aleabitoreddit/status/2077753660592033828","text":"Today, $MU announced it signed memory LTAs with $QCOM.\n\nInteresting reaction to see Micron proceeded to drop 5.37% right after.\n\nDoesn’t quite feel like there’s anything individually wrong with memory or AI names with all these structural agreements signed?\n\nMore like the tail end of deleveraging / margin cascades.","zh":"$MU 今天宣布與 $QCOM 簽訂記憶體 LTA（長期供貨合約）。\n\n有意思的是，美光隨後反而下跌了 5.37%。\n\n在簽了這麼多結構性協議的情況下，感覺記憶體或 AI 個股本身並沒有什麼問題？\n\n比較像是去槓桿／保證金追繳連鎖效應的尾端。","likes":2216,"views":720253,"reposts":154,"q":null},{"id":"2077741631135191234","ts":"2026-07-16T13:06:22.000Z","url":"https://x.com/aleabitoreddit/status/2077741631135191234","text":"I hope there's someone at X can fix this subscription bug. \n\nMany people are reporting that subscriptions don't renew anymore. https://t.co/0MvdfJmBg3","zh":"希望 X 有人可以修一下這個訂閱的 bug。\n\n很多人回報訂閱不會自動續訂了。","likes":230,"views":256534,"reposts":14,"q":"XtineFang：Why does X automatically unsubscribe me from Serenity??\n\nI have had to re-sub 3 times already @aleabitoreddit @nikitabier https://t.co/mILffASRxV"},{"id":"2077437150715666900","ts":"2026-07-15T16:56:28.000Z","url":"https://x.com/aleabitoreddit/status/2077437150715666900","text":"Anthropic to IPO as early as October per Bloomberg.\n\nThis is following their $65B financing at a $965 billion  valuation last May.\n\nHmm, would you all invest in Anthropic at a $1T+ valuation? https://t.co/iFIY1WulvO","zh":"據彭博報導，Anthropic 最快可能在 10 月 IPO。\n\n這是繼他們去年 5 月以 9,650 億美元估值募得 650 億美元之後的動作。\n\n嗯，如果估值超過 1 兆美元，你們會投資 Anthropic 嗎？","likes":1492,"views":466800,"reposts":91,"q":null},{"id":"2077421268991926703","ts":"2026-07-15T15:53:21.000Z","url":"https://x.com/aleabitoreddit/status/2077421268991926703","text":"$AAPL looks to acquire AI chip companies for running AI (Source: The Information)\n\nRight now, $MSFT, $META, Amazon, Google are carrying AI capex spend.\n\nBut what if Apple joined the others after M&A? \n\nA possible scenario is that they revise capex largely upward for their own AI buildout. \n\nSince they probably witnessed Google cutting off Meta from compute constraints... or what happens when you partner with OpenAI for LLMs. \n\nThen learned how important it is to have your own infrastructure. \n\nThis scenario would be quite bullish thematically from optical networking to foundries and something markets would not expect? We'll see what happens.","zh":"$AAPL 有意併購 AI 晶片公司來執行 AI（來源：The Information）\n\n現在 AI 資本支出是由 $MSFT、$META、Amazon、Google 在扛。\n\n但如果蘋果在併購之後也加入戰局呢？\n\n一個可能的情境是，他們為了自建 AI 基礎設施，大幅上修資本支出。\n\n因為他們大概親眼見識到 Google 因算力吃緊而切斷 Meta 的配額⋯⋯或是跟 OpenAI 合作大型語言模型會發生什麼事。\n\n然後學到了擁有自有基礎設施有多重要。\n\n這個情境從光通訊網路到晶圓代工，在主題面上都會相當有利，而且是市場沒有預期到的？我們拭目以待。","likes":1030,"views":372359,"reposts":76,"q":null},{"id":"2077406548012466390","ts":"2026-07-15T14:54:52.000Z","url":"https://x.com/aleabitoreddit/status/2077406548012466390","text":"$NVDA CEO, Jensen Huang in Tokyo today said:\n\n\"The reports are not true. Vera Rubin is already in production. Giant amounts of production incoming\"\n\nAs a flat denial to the accusation that their AI servers would be delayed. \n\nJensen appears to be using the Umbrella term for Rubin Ultra/Kyber, then pointed to current gen ramp. \n\nRegardless, lot of damage has been done already to Nvidia supply chains stock prices, after the multiple delay reports. Even if Nvidia refuted them by clarifying Kyber change was an architecture optimization, not impacting timelines.\n\nIt's a very dangerous and growing trend for folks to post  overreaching broader claims from technical nuances to grow viewcount... Especially if they get Jensen has to respond.\n\nIn the end, I'm trusting $NVDA on timelines since they probably have the greatest visibility into their own supply chain.","zh":"$NVDA 執行長黃仁勳今天在東京表示：\n\n「那些報導不是真的。Vera Rubin 已經在量產了。大量的產出正在路上。」\n\n這是對「他們的 AI 伺服器將延遲」這項指控的直接否認。\n\n黃仁勳看起來是用 Rubin Ultra／Kyber 這個統稱來回應，然後指向現行世代的放量情況。\n\n無論如何，在多篇延遲報導之後，Nvidia 供應鏈的股價已經受到不小傷害。即便 Nvidia 已澄清 Kyber 的變更屬於架構最佳化，不影響時程。\n\n這種為了衝觀看數，而從技術細節推導出過度延伸的廣泛結論的風潮，非常危險而且還在擴大⋯⋯尤其當它嚴重到要黃仁勳親自回應。\n\n最後，在時程這件事上我選擇相信 $NVDA，因為他們對自家供應鏈的能見度大概是最高的。","likes":1415,"views":402501,"reposts":106,"q":null},{"id":"2077228758491386121","ts":"2026-07-15T03:08:23.000Z","url":"https://x.com/aleabitoreddit/status/2077228758491386121","text":"Well, looks like SLC NAND is forcasted to rise up 120-170% for H2 2026 per Trendforce. \n\nThere's $MU (21%), Kioxia (20%) as largest share, but clearer beneficiaries appears to be:\n\n1. Winbond (2344): ~15% of the SLC NAND market\n2. Macronix (2337): ~11% market share\n3. SkyHigh Memory via Puya Semi: ~14% market share\n\nGiven Micron at $1T and others are a bit large relative to SLC NAND TAM. \n\n(source: Q1 2026 Winbond presentation/Trendforce).","zh":"根據 TrendForce，SLC NAND 在 2026 年下半年預估將漲價 120-170%。\n\n市佔最大的是 $MU（21%）和鎧俠（20%），但更明確的受惠者看起來是：\n\n1. 華邦電（2344）：約佔 SLC NAND 市場 15%\n2. 旺宏（2337）：約 11% 市佔\n3. SkyHigh Memory（透過普冉半導體）：約 14% 市佔\n\n因為以美光 1 兆美元的規模等來說，相對於 SLC NAND 的 TAM（總潛在市場）而言體量太大了。\n\n（資料來源：華邦電 2026 年第一季簡報／TrendForce）","likes":1042,"views":414192,"reposts":80,"q":null},{"id":"2077208587005542464","ts":"2026-07-15T01:48:14.000Z","url":"https://x.com/aleabitoreddit/status/2077208587005542464","text":"$AEHR back up +36.4% today off earnings!\n\n2027 guide: $130-$150m (160-200% growth) from 2026 revenue.  Sees opportunity to guide higher (assumes no memory revenue or little to none from newly benchmarked AI customer).\n\nQ4 bookings: $60.7M, effective backlog is $100.6M.\n\n- Lead AI processor wafer-level burn-in customer is significantly ramping their products. \n\n- Engaged with additional AI processor customers who are evaluating wafer-level burn-in. \n\n- Benchmark customer, which was a “major supplier of AI accelerators, CPUs and network processors” “exceeded their expectations. \n\nFrom management: The potential revenue opportunity from one of these devices is \"significant to Aehr\". So another benchmark win for potential HVM in the future.\n\n- Wafer level burn-in benchmark with a \"global leader in NAND flash completed\". Now evaluating a development agreement for HBM/NAND\n\nSeems like $SNDK since there was HBF related discussions from last quarter I think.\n\n- \"Our package level burn-in business for AI processors also gained  momentum over the year … from our lead hyperscale customer for Sonoma systems\"\n\n- Silicon photonics customer already ramping, newer networking customers     has forecast additional systems  \n\nBasically the amount of global semi companies that map to $AEHR is pretty ridiculous across silicon photonics, memory, AI processors, and others. \n\nI don’t quite think that $130-$150m guidance is representative of actualized revenue for 2027 if these hyperscalers/semi companies convert to HVM. \n\nTypically with these types of qualification into HVM players, markets don’t really judge it by current quarter, but what’s to come.  \n\nAnd it looks very positive so far in terms of reactions...\n\n$116 -> $60 -> $94 all in the span of a month is pretty insane volatility tho, so good to know what you're holding.","zh":"$AEHR 今天因財報大漲 36.4%！\n\n2027 年財測：1.3-1.5 億美元（相較 2026 年營收成長 160-200%）。並認為有機會上修（此財測假設來自新完成基準測試的 AI 客戶的記憶體營收為零或極少）。\n\n第四季接單：6,070 萬美元，有效在手訂單 1.006 億美元。\n\n- 主要 AI 處理器晶圓級預燒客戶的產品正大幅放量。\n\n- 已與更多正在評估晶圓級預燒的 AI 處理器客戶接洽。\n\n- 那位「AI 加速器、CPU 與網路處理器的主要供應商」基準客戶「超出了他們的預期」。\n\n管理層表示：其中單一元件的潛在營收機會對 Aehr 而言「相當可觀」。所以這是又一個可能導向未來量產的基準測試斬獲。\n\n-「與一家 NAND 快閃記憶體全球龍頭的晶圓級預燒基準測試已完成」。目前正評估 HBM／NAND 的開發合約\n\n看起來像是 $SNDK，因為我記得上一季有討論到 HBF 相關的東西。\n\n-「我們針對 AI 處理器的封裝級預燒業務，今年也獲得動能⋯⋯來自我們 Sonoma 系統的主要超大規模客戶」\n\n- 矽光子客戶已在放量，較新的網路客戶則預估會再增加系統採購\n\n基本上，能對應到 $AEHR 的全球半導體公司數量誇張地多，橫跨矽光子、記憶體、AI 處理器等領域。\n\n如果這些超大規模業者／半導體公司真的轉入量產，我不太認為 1.3-1.5 億美元的財測能代表 2027 年的實際營收。\n\n通常這類進入量產認證的公司，市場評價的不是當季表現，而是接下來會發生什麼。\n\n而目前為止的市場反應看起來非常正面⋯⋯\n\n不過一個月內從 116 美元跌到 60 美元再回到 94 美元，波動實在誇張，所以搞清楚自己手上抱的是什麼很重要。","likes":1227,"views":562814,"reposts":68,"q":"aleabitoreddit：$AEHR looks extremely promising at ~$1.1B MC. \n\nAehr is starting to remind me of an early $TER, mixed with pre-earnings $AAOI.  \n\nIf we look at the timeline and speculated customers:\n\nFeb 11th: Sonoma production win for Hyperscaler's AI ASIC processors. (likely $GOOGL, $AMZN, $ME"},{"id":"2077044786402660829","ts":"2026-07-14T14:57:21.000Z","url":"https://x.com/aleabitoreddit/status/2077044786402660829","text":"$NBIS signs $1B+ compute agreement with Reflection AI, for GB300 access through 2029.\n\nReflection also signed a multi-billion dollar agreement with $SPCX earlier. \n\nInteresting to say the least, seeing Nebius drop -5% off the news today. \n\nAlso... counterparty to get this done kinda reminds me of OpenAI, where they might not have the funds to actually execute on these LTAs yet compared to $META or $MSFT. \n\nBut generally positive long term developments, customer diversification was one of the core strengths of Nebius.","zh":"$NBIS 與 Reflection AI 簽下逾 10 億美元的算力合約，提供 GB300 使用權至 2029 年。\n\nReflection 稍早也與 $SPCX 簽了數十億美元的合約。\n\n這件事至少可以說很有意思，看到 Nebius 因為這則消息今天反而跌了 5%。\n\n另外⋯⋯這種簽約對手方讓我有點想到 OpenAI，他們可能還沒有足夠的資金去真正履行這些長約，跟 $META 或 $MSFT 比起來是這樣。\n\n但整體而言是正面的長期發展，客戶多元化一直是 Nebius 的核心優勢之一。","likes":1517,"views":484149,"reposts":96,"q":null},{"id":"2077039373711970804","ts":"2026-07-14T14:35:50.000Z","url":"https://x.com/aleabitoreddit/status/2077039373711970804","text":"Two different capacity expansion announcements today across $TSEM and $AAOI.\n\nTower Semi, supported by the Japanese government, announced expansion of its 300mm Silicon Photonics (SiPho), Silicon Germanium (SiGe), and advanced packaging capabilities. \n\nTargeting $1.2B net profit, and $3.6B revenue in 2028 (with a ~$28B MC, that's ~23.3 2028 forward p/e).\n\nAAOI announced the commencement of its buildout, roughly 400,000 square feet of manufacturing to make 800g/1.6T production go brrr. \n\nThe overall expansion is also supported by the local city government in Texas. (they also $20.85M worth of subsidies from the State earlier).\n\nThis one isn't exactly as materially new as Tower, since AAOI originally announced these plans before. Just commencement of it. \n\nRegardless, glad to see both of these companies in their Anime training arc phase as they power up.","zh":"今天 $TSEM 和 $AAOI 分別公布了擴產計畫。\n\nTower Semi 在日本政府支持下，宣布擴充其 300mm 矽光子（SiPho）、矽鍺（SiGe）與先進封裝產能。\n\n目標 2028 年淨利 12 億美元、營收 36 億美元（以約 280 億美元市值計算，2028 年預估本益比約 23.3 倍）。\n\nAAOI 則宣布動工，將建置約 40 萬平方英尺的廠房，讓 800G／1.6T 產能爽爆。\n\n這次擴建同樣獲得德州當地市政府支持。（他們稍早也從州政府拿到 2,085 萬美元的補助。）\n\n這一則的實質新意不如 Tower，因為 AAOI 原本就宣布過這些計畫，這次只是動工而已。\n\n無論如何，很高興看到這兩家公司都進入了熱血動畫的修練篇，實力正在提升中。","likes":1251,"views":358129,"reposts":94,"q":null},{"id":"2076846994614792663","ts":"2026-07-14T01:51:24.000Z","url":"https://x.com/aleabitoreddit/status/2076846994614792663","text":"So Jensen himself went out to do damage control with $NVDA delays reports apparently:\n\n1. Jensen Huang said no delays: \n\n- 800V and rack-to-rack optical interconnects is progressing fully in line with the original plan with no material delay. \n\n- Debunked the rumor that the next-generation flagship, Rubin Ultra, would be delayed until 2028 and said it would be on track to ship next year\n\n- Rack system optimizations, like replacing Kyber with a new design are architectural optimizations, not impacting delivery timelines.\n\n2. On ASIC competition: no loss of market share.\n\n- Talked about how a leading frontier lab that previously relied heavily on internal ASICs has shifted nearly 50% of its compute load to Nvidia\n\n3. On over-reliance on hyperscalers.\n\n- AI frontier labs currently contributing to ~20% of demand.\n- Traditional cloud providers, Nvidia provides Vera CPUs and high-speed networking\n- Sovereign AI","zh":"看來黃仁勳親自出面，為 $NVDA 的延遲報導做危機處理：\n\n1. 黃仁勳表示沒有延遲：\n\n- 800V 與機櫃間光互連的進度完全符合原訂計畫，沒有實質延遲。\n\n- 駁斥下一代旗艦 Rubin Ultra 將延到 2028 年的傳聞，並表示明年就會如期出貨\n\n- 機櫃系統的最佳化，例如以新設計取代 Kyber，屬於架構最佳化，不影響交付時程。\n\n2. 關於 ASIC 競爭：市佔率沒有流失。\n\n- 他提到某家先前高度依賴內部 ASIC 的頂尖前沿實驗室，已經把將近 50% 的運算負載轉移到 Nvidia\n\n3. 關於過度依賴超大規模雲端業者：\n\n- AI 前沿實驗室目前約貢獻 20% 的需求。\n- 傳統雲端業者方面，Nvidia 提供 Vera CPU 與高速網路\n- 主權 AI","likes":1596,"views":723381,"reposts":124,"q":"aleabitoreddit：Apparently there’s a new popular trend to bearpost trillion dollar companies.\n\nLike $NVDA or $TSM.\n\nBy finding isolating technical details, then blowing it out of proportions by claiming their whole program is delayed.\n\n-> if the company doesn’t respond, stock prices/sentiment ar"},{"id":"2076808331453415674","ts":"2026-07-13T23:17:46.000Z","url":"https://x.com/aleabitoreddit/status/2076808331453415674","text":"TLDR of Innolight investor relations takeaways:\n\n1. \"Overall, 1.6T market demand has not contracted; instead, 800G demand has increased significantly compared with previous expectations\"\n\nProb most important takeaway as a whole was 800G demand revision (also longer tail demand). Which is a bullish read through on US transceiver makers like $AAOI, $COHR, $LITE. \n\nLot of new customers like neoclouds, AI model companies, contributing to overall demand rather than just hyperscalers, diversification always a bonus. \n\n2. Innolight said the shortage covers the module supply chain broadly including:\n\n- Optical chips.\n- Electrical chips.\n- PCBs.\n- Other module materials\n\nFrom last ER, I think they singled out EMLs and CW optical chips as the most constrained. So Innolight's bottleneck list mention broadened since then. \n\nThey expect some of the component availability to improve gradually from the second half of 2026 through the first half of 2027. \n\nThink a lot of this is already known from earlier though. \n\nBut just some confirmation + easing timelines (EML is extremely bottlenecked, same with CW, this is probably talking about other components). \n\n3.  Innolight said module-production equipment is not the constraint. Equipment lead times remain relatively short. \n\nSo this isn't really a bottleneck compared to others. \n\n4. The overall proportion of silicon photonics continues to trend upward. Last year it was mainly 800G. This year, some 800G customers are further increasing their silicon-photonics proportion. 1.6T also added some new customers\n\nPositive for SiPH penetration eg. $SIVE / $JBL, since this shifts away from EML toward CW. \n\nBasically: main surprising takeaway is just 800g demand go brrr. \n\nApart from that just reaffirming bottlenecks/timelines/market speculation.","zh":"中際旭創（Innolight）法人說明會重點整理：\n\n1.「整體而言，1.6T 的市場需求並未萎縮；反而是 800G 的需求相較先前預期有顯著增加」\n\n整場最重要的重點大概就是 800G 需求的上修（以及需求的長尾效應）。這對 $AAOI、$COHR、$LITE 等美系光收發模組廠是利多讀數。\n\n很多新客戶如 neocloud（新型雲端算力商）、AI 模型公司都在貢獻整體需求，而不只是 hyperscaler，客戶多元化永遠是加分。\n\n2. 旭創表示短缺涵蓋整個模組供應鏈，包括：\n\n- 光晶片\n- 電晶片\n- PCB\n- 其他模組材料\n\n我記得上次財報他們特別點名 EML（電吸收調變雷射）和 CW 光晶片最為吃緊。所以旭創提到的瓶頸清單，從那時候起擴大了。\n\n他們預期部分零組件的供給狀況，將從 2026 年下半年到 2027 年上半年逐步改善。\n\n不過我覺得這裡面很多其實先前就已經知道了。\n\n但至少算是一種確認，加上緩解的時程（EML 極度吃緊，CW 也一樣，這裡講的應該是其他零組件）。\n\n3. 旭創表示模組生產設備並非限制因素，設備交期仍相對短。\n\n所以跟其他環節比起來，這一塊算不上瓶頸。\n\n4. 矽光子的整體佔比持續上升。去年主要是 800G，今年有些 800G 客戶進一步提高矽光子比重，1.6T 也新增了一些客戶。\n\n這對矽光子滲透率是正面的，例如 $SIVE／$JBL，因為這代表架構正從 EML 轉向 CW。\n\n基本上：最令人意外的重點就是 800G 需求爽爆。\n\n除此之外，就是再次確認瓶頸、時程與市場猜測。","likes":931,"views":396818,"reposts":41,"q":null},{"id":"2076748688559587338","ts":"2026-07-13T19:20:46.000Z","url":"https://x.com/aleabitoreddit/status/2076748688559587338","text":"Morgan Stanley note on CPO today. Key participants include:\n\n- $SIVE, $COHR, and $LITE in laser supply\n- Broadcom and Nvidia in switch platforms\n- Lightmatter, Ayar Labs, Marvell/Celestial, and POET in optical engines and photonics, \n- $TSM, $GFS, and $TSEM in silicon photonics foundry capacity\n\nI’ve covered all of these before, like Tower Semi. \n\nBut I’m especially happy that Morgan Stanley validated my research that $SIVE is one of the critical global players in CPO.\n\nA small $1.5B laser company next to your two leading $60B+ companies…\n\nIf you also synthesize Rosenblatt Securities recent note that China laser suppliers were quite far from having CPO lasers.\n\nThis kinda magnifies importance of the three Western leaders of that laser chokepoint.","zh":"摩根士丹利今天發布了 CPO（共封裝光學）報告。主要參與者包括：\n\n- 雷射供應：$SIVE、$COHR、$LITE\n- 交換器平台：博通與 Nvidia\n- 光引擎與光子元件：Lightmatter、Ayar Labs、Marvell／Celestial、POET\n- 矽光子代工產能：$TSM、$GFS、$TSEM\n\n這些我以前全都寫過，像 Tower Semi。\n\n但我特別開心的是，摩根士丹利驗證了我的研究：$SIVE 是全球 CPO 的關鍵玩家之一。\n\n一家市值只有 15 億美元的小型雷射公司，被放在兩家 600 億美元以上的龍頭旁邊⋯⋯\n\n如果再結合 Rosenblatt Securities 近期指出中國雷射供應商距離做出 CPO 用雷射還很遠這一點。\n\n這就更凸顯了西方三強在雷射咽喉點上的重要性。","likes":2126,"views":516286,"reposts":177,"q":null},{"id":"2076467953995071881","ts":"2026-07-13T00:45:13.000Z","url":"https://x.com/aleabitoreddit/status/2076467953995071881","text":"Just a semi recap TLDR:\n\n- $GLW glass bridge per Morgan Stanley has potential, but hard to displace FAU (like FOCI) in short term\n\n- $SPCX Starlink Gen 3 is scaling to 100,000 units (10x prev gen) creating possible capacity constraints for suppliers of switches to CCL.\n\n- PCB supply shortages are projected to persist until 2028, and component shortages/price hikes are already forcing ODMs like Inventec to issue  conservative H2 shipment\n\n- DeepSeek and Zhipu are developing custom ASICs to bypass $NVDA (kinda expected by now). \n\n- Anthropic has achieved a $30B ARR and is projected to hit >$1B in Q3 profit. Turns out these frontier labs are more profitable than people think. \n\n- US admin pressured $AAPL to source from $INTC, in exchange for tariff exception. Kinda pressuring alignment away from TSM.  \n\n- $TSM plans a 30x expansion of its Photonic Integrated Circuit (PIC)  capacity by 2028, growing from 500 to 25,000 wafers per month\n\n- Hanmi Semiconductor is entering the CoWoS packaging equipment market\n\n- $NVDA and NTT hosting a conference July 24th to discuss CPO strategies. \n\n- 5x general NAND flash price hike this year, market size $489B by next year triggered by RAG/inference. Samsung and SK Hynix make emergency fab investments, NAND equipment suppliers go brrrr.  \n\n- Gas turbine bottleneck, 40% supply gap accompanied by staggering 5-year delivery cycles (mega-fabs need them for mass production).\n\n- AI probe card assembly has hit a severe bottleneck apparently. Which is attempted to by solved with things like Innovation Service's machines. \n\n- Nanya, 79.5% gross margins reported, memory go brr. 4x capex for capacity/advanced packaging. \n\n- CXMT's STAR Market IPO on July 16, so should bring a lot of attention to memory players in that supply chain. \n\n- KYEC $1.4B investment into US for $TSM Arizona output test facilities. Lot of these players like $AMKR and others should go brr in 2028.\n\n- $INTC CEO warned last month that helium could hinder the manufacturing costs and delivery times of AI chips\n\n- 3D NAND word lines are shifting from Tungsten to Molybdenum starting at the 375-layer node\n\n- SambaNova secured JPM for AI inference and raised $1B at an $11B valuation.\n\n- HBM prices projections to double in 2027 as $NVDA Rubin platform drives demand.\n\n- $MU provides $500 million in funding to support GlobalWafers' US manufacturing capacity \n\n- $META 'Iris' will enter mass production in September  via $AVGO and TSMC and Meta aims to double computing power to 14GW by 2027.\n\n- Largan Precision has secured its first CPO FAU order, mass production slated for middle of next year (kinda indication around Foci and others). \n\n- Samsung and SK Hynix have delayed the implementation of hybrid bonding packaging technology for HBM4 apparently \n\n- Memory costs (DRAM/NAND) have reached 60% of the BOM for sub-$400 smartphones, causing a severe volume contraction.\n\n- SK Hynix successfully rasied $26.5 billion through a Nasdaq ADR\n\n- $TSLA issued procurement guidelines requiring suppliers to reach weekly production of 1,000 units by September and double to 2,000-2,500 by year end for its 3rd gen Optimus robot. Apparently Alliance Technology and A-Link may be in this supply chain harmonic reducers and vision lenses?\n\nKinda go through all this stuff every day, but don't wanna be a news reporter so just consolidated stuff I found interesting.","zh":"半導體近況重點整理：\n\n- 摩根士丹利認為 $GLW 的玻璃橋接技術有潛力，但短期內難以取代 FAU（如 FOCI）\n\n- $SPCX 的 Starlink 第三代將擴產到 10 萬台（前一代的 10 倍），可能造成從交換器到 CCL（銅箔基板）供應商的產能吃緊\n\n- PCB 供應短缺預計將持續到 2028 年，零組件短缺與漲價已迫使英業達等 ODM 廠對下半年出貨給出保守預估\n\n- DeepSeek 和智譜正在開發自研 ASIC 以繞開 $NVDA（現在也算意料之中了）\n\n- Anthropic 的 ARR（年化經常性收入）已達 300 億美元，第三季獲利預估將超過 10 億美元。看來這些前沿實驗室比大家想的還會賺\n\n- 美國政府施壓 $AAPL 向 $INTC 採購，以換取關稅豁免。有點像在逼他們遠離台積電\n\n- $TSM 計畫在 2028 年前將光子積體電路（PIC）產能擴充 30 倍，從每月 500 片增加到 25,000 片\n\n- 韓美半導體正跨入 CoWoS 封裝設備市場\n\n- $NVDA 與 NTT 將在 7 月 24 日舉辦研討會討論 CPO（共封裝光學）策略\n\n- 今年一般 NAND 快閃記憶體漲價 5 倍，受 RAG／推論帶動，明年市場規模上看 4,890 億美元。三星和 SK 海力士緊急投資建廠，NAND 設備供應商爽爆\n\n- 燃氣渦輪機出現瓶頸，供給缺口達 40%，交期更是誇張的 5 年（超大晶圓廠量產需要它們）\n\n- AI 探針卡組裝據說已嚴重卡關。目前試圖用 Innovation Service 的機台等方案來解決\n\n- 南亞科毛利率 79.5%，記憶體爽爆。資本支出增為 4 倍，用於產能與先進封裝\n\n- CXMT 將於 7 月 16 日在科創板 IPO，應該會為該供應鏈的記憶體業者帶來大量關注\n\n- 京元電投資 14 億美元赴美，為 $TSM 亞利桑那廠的產出提供測試設施。$AMKR 等這類業者在 2028 年應該都會很旺\n\n- $INTC 執行長上個月警告，氦氣可能會影響 AI 晶片的製造成本與交期\n\n- 3D NAND 的字元線從 375 層節點開始，將從鎢轉向鉬\n\n- SambaNova 拿下摩根大通的 AI 推論訂單，並以 110 億美元估值募得 10 億美元\n\n- 隨著 $NVDA 的 Rubin 平台帶動需求，HBM 價格預估將在 2027 年翻倍\n\n- $MU 提供 5 億美元資金，支援環球晶的美國產能\n\n- $META 的「Iris」將於 9 月透過 $AVGO 與台積電進入量產，Meta 目標在 2027 年前將算力翻倍至 14GW\n\n- 大立光拿下首張 CPO 用 FAU 訂單，量產預定明年年中（某種程度上也暗示了 Foci 等業者的狀況）\n\n- 三星與 SK 海力士據傳已延後 HBM4 的混合鍵合封裝技術導入\n\n- 記憶體成本（DRAM／NAND）已佔 400 美元以下智慧型手機物料成本的 60%，導致出貨量嚴重萎縮\n\n- SK 海力士透過那斯達克 ADR 成功募得 265 億美元\n\n- $TSLA 發出採購指引，要求供應商在 9 月前達到每週 1,000 台產能，年底前翻倍到 2,000-2,500 台，供其第三代 Optimus 機器人使用。據說 Alliance Technology 和 A-Link 可能在諧波減速器與視覺鏡頭的供應鏈中？\n\n這些東西我大概每天都在看，但也不想當新聞台，所以就把我覺得有意思的整理在一起。","likes":2034,"views":674536,"reposts":170,"q":null},{"id":"2076372905450188998","ts":"2026-07-12T18:27:32.000Z","url":"https://x.com/aleabitoreddit/status/2076372905450188998","text":"Looks like the Strait of Hormuz is open for the 50th time this year per Trump.\n\nI’m getting tired looking at macro. https://t.co/GuYgkwC2Q8","zh":"根據川普的說法，荷莫茲海峽今年第 50 次開放了。\n\n我看總體經濟看到累了。","likes":1468,"views":443086,"reposts":49,"q":null},{"id":"2076266613675069628","ts":"2026-07-12T11:25:10.000Z","url":"https://x.com/aleabitoreddit/status/2076266613675069628","text":"Apparently there’s a new popular trend to bearpost trillion dollar companies.\n\nLike $NVDA or $TSM.\n\nBy finding isolating technical details, then blowing it out of proportions by claiming their whole program is delayed.\n\n-> if the company doesn’t respond, stock prices/sentiment are damaged. \n\n-> if the company issues a response, they can’t go into detail since supply chains are confidential… but people still doubt them\n\n-> Poster gain more impressions, then does it again with more views the next time.\n\nDon’t quite think this is very healthy, with more folks copying that playbook. Especially around incentive structures.","zh":"看來現在流行一種新風潮，就是唱衰兆美元級公司。\n\n像是 $NVDA 或 $TSM。\n\n做法是找出孤立的技術細節，然後無限放大，宣稱他們整個計畫都延遲了。\n\n→ 如果公司不回應，股價／市場情緒就受損。\n\n→ 如果公司出面回應，因為供應鏈屬機密，他們沒辦法講細節⋯⋯結果大家還是懷疑。\n\n→ 發文者獲得更多曝光，然後下次再操作一次，觸及數更高。\n\n我不覺得這樣很健康，而且愈來愈多人在複製這套劇本。尤其考量到背後的誘因結構。","likes":1908,"views":1053445,"reposts":95,"q":null},{"id":"2076248337863639506","ts":"2026-07-12T10:12:33.000Z","url":"https://x.com/aleabitoreddit/status/2076248337863639506","text":"So there's a IBK Research report on Boston Dynamics value chains from last month. \n\nJust a summary: \n\nIBK maps these companies to Atlas as suppliers:\n- Hwashin (010690) / body, arms, legs\n- LG Energy (373220) / battery \n- Hyundai Autoever (307950) / integration\n- Hyundai Mobis (012330) / actuators\n\nAs for humanoid volume ramps: \n\nThey're modeling for, 11.29K in 2028, 20k 2029, 30k in 2030... 40k in 2031, and 50k in 2032. \n\nNot quite sure why IBK and other institutions are a fan of linearly modeling S-curve volume ramps... \n\nLike adding +10K per year, don't quite think it's volume ramp is going to work like that... if I had to guess it would look more like: \n\n- 15-20k 2028\n- 40k-70k 2029\n- 90k-140k for 2030\n\nSince Boston Dynamics is projecting 30k capacity by 2028 (I'm sure they'd aim to get more online by 2029-2030), as China collectively is already doing 100k EOY in 2026.  \n\nIn terms of competitive landscape they name:\n\n- $TSLA, Figure, Apptronik, $CCXI (Agility), as US  players. Then Boston Dynamics (Korea parent owned now)\n- Unitree, Fourier, AGibot, UBtech, $XPEV as the Chinese leaders. \n- Neura, Pal Robotics, Wandercraft, Oversonic, as the EU leaders.  \n\nThey also did quite a lot of valuation modeling around Hyundai Mobis/Hyundai Autoever/Glovis. \n\nRegarding the BD economic ownership from 27.9% from Hyundai Motor, 11.3% from Mobis, and 11.3% from Glovis. So at least institution are valuing humanoid segments inside companies lot more now. \n\nThen from report assumptions:\n- 31 actuators per Atlas\n- $1K per actuator in 2028\n- $134K Atlas ASP,\n\nWhich implies actuator cost of final selling price is roughly 23–28%. \n\nProbably the more interesting statement was IBK stated that actuator capacity is biggest signal for volume ramp. eg. every 310,000 units of actuator capacity supports 10,000 more robots. \n\nSo tracking actuator outputs, yields, ASP is a cleaner read on 2028-2030 ramp.\n\nI didn't have much personal takeaways, but hopefully others find it interesting, maybe around Hwashin as a core supplier or around actuator capacity as an indicator.","zh":"上個月 IBK Research 出了一份關於 Boston Dynamics 價值鏈的報告。\n\n簡單摘要如下：\n\nIBK 把這些公司對應為 Atlas 的供應商：\n- 華信（010690）／機身、手臂、腿部\n- LG Energy（373220）／電池\n- 現代 Autoever（307950）／系統整合\n- 現代 Mobis（012330）／致動器\n\n至於人形機器人的量產爬坡：\n\n他們模型預估 2028 年 11,290 台、2029 年 2 萬台、2030 年 3 萬台⋯⋯2031 年 4 萬台、2032 年 5 萬台。\n\n不太懂為什麼 IBK 和其他機構這麼愛用線性方式去模擬 S 曲線型的量產爬坡⋯⋯\n\n像這樣每年加一萬台，我不太認為放量會是這樣走的⋯⋯如果要我猜，應該比較像：\n\n- 2028 年 1.5-2 萬台\n- 2029 年 4-7 萬台\n- 2030 年 9-14 萬台\n\n因為 Boston Dynamics 預計 2028 年產能達 3 萬台（我相信他們會設法在 2029-2030 年拉更多產能上線），而中國整體在 2026 年底就已經做到 10 萬台了。\n\n競爭格局方面他們點名：\n\n- 美國玩家：$TSLA、Figure、Apptronik、$CCXI（Agility）。再來是 Boston Dynamics（現在母公司在韓國）\n- 中國領導者：宇樹、傅利葉、智元、UBtech、$XPEV\n- 歐洲領導者：Neura、Pal Robotics、Wandercraft、Oversonic\n\n他們也對現代 Mobis／現代 Autoever／現代 Glovis 做了不少估值模型。\n\n關於 Boston Dynamics 的經濟持股：現代汽車 27.9%、Mobis 11.3%、Glovis 11.3%。所以至少機構現在對企業內部的人形機器人事業給予高得多的評價了。\n\n報告的假設條件：\n- 每台 Atlas 使用 31 顆致動器\n- 2028 年每顆致動器 1,000 美元\n- Atlas 售價 134,000 美元\n\n這意味著致動器成本約佔最終售價的 23-28%。\n\n可能更有意思的說法是，IBK 認為致動器產能是量產爬坡最重要的訊號。例如每 31 萬顆致動器產能，可支撐多 1 萬台機器人。\n\n所以追蹤致動器的產出、良率、售價，是判讀 2028-2030 年爬坡更乾淨的方式。\n\n我個人沒有太多心得，但希望其他人覺得有趣，也許可以從華信這個核心供應商、或從致動器產能這個指標切入。","likes":753,"views":353587,"reposts":70,"q":null},{"id":"2076030743655109063","ts":"2026-07-11T19:47:54.000Z","url":"https://x.com/aleabitoreddit/status/2076030743655109063","text":"Apparently, Korean Beauty was where all the alpha is.\n\nAPR (278470.KS) is up 529% over the past 2Y, wildly outperforming both $NVDA and $INTC.\n\nEvery female I know talks about their \"Medicube\" stick, then buying products... where you put a whole salmon's family tree on your face for better skin. \n\nThe world's female population creates a bigger structural demand than hyperscalers for memory or lasers? Should have known...","zh":"看來原來所有的超額報酬都在韓國美妝業。\n\nAPR（278470.KS）過去兩年上漲 529%，大幅跑贏 $NVDA 和 $INTC。\n\n我認識的每個女生都在聊她們的「Medicube」美容棒，然後買一堆產品⋯⋯那種把整條鮭魚的族譜都往臉上抹來讓皮膚變好的東西。\n\n全球女性人口創造出的結構性需求，居然比 hyperscaler 對記憶體或雷射的需求還大？我早該想到的⋯⋯","likes":1957,"views":582529,"reposts":130,"q":"wow_finwit：반도체 쏟아붓는 와중에 K뷰티가 또 터지네. 1Q 순익 41% 폭증에 하반기 대장주 예고라. \n\n수출 150억 달러 시대 문턱인데, 미국·유럽 기초 카테고리 중심으로 구조적 성장 중. ODM 쪽 레버리지 제대로 먹는 기업들 영업이익률 30%대 찍는 거 보면 단순 소비재가 아니라 기술+브랜드 모멘텀 섞인 플레이임. \n\n반도체 사이클 타임 기다리는 동안 이쪽 돈줄도 무시 못 할 수준. 실적 확인되면 또 한 번 판 흔들릴 거."},{"id":"2075894311741440041","ts":"2026-07-11T10:45:46.000Z","url":"https://x.com/aleabitoreddit/status/2075894311741440041","text":"Contrarian take, but Sam Altman / OpenAI is doing something right if he's pissing off every Mag7 like $AAPL. \n\nBy building their own ecosystem instead of being sucked into another. \n\nIt's been awhile since $GOOGL, Apple, Microsoft, and others had some genuine disruptors.","zh":"這是個逆向觀點，但如果 Sam Altman／OpenAI 把每一家 Mag7 巨頭（例如 $AAPL）都惹毛了，那代表他們做對了某些事。\n\n因為他們選擇建立自己的生態系，而不是被吸進別人的生態系裡。\n\n已經很久沒看到 $GOOGL、蘋果、微軟這些公司遇到真正的顛覆者了。","likes":1747,"views":519185,"reposts":70,"q":null},{"id":"2075645547978084371","ts":"2026-07-10T18:17:16.000Z","url":"https://x.com/aleabitoreddit/status/2075645547978084371","text":"Regarding $AMZN RNG + OpenAI’s MRC and VCSELs. \n\nIn what appears to be an indirect response on B. Riley's $AAOI sell report regarding optimizations that \"flattens networks and cuts transceiver TAM 40-50%\".\n\nRosenblatt TLDR: They've already modeled for this, even though each XPU may use fewer transceivers.\n\nThe number of XPUs is growing so quickly that total optical demand should still rise. \n\nOn lasers architectures for CPO: VCSELs are useful as a credible bridge for NPO/short reach. \n\nIdeal architecture though for CPO is UHP CW over other lasers, and cites Broadcom for that statements. Which happens to supports my core $SIVE thesis. \n\nI feel like Rosenblatt and I share the same views on a lot of things, I like the way they roll.","zh":"關於 $AMZN 的 RNG 以及 OpenAI 的 MRC 與 VCSEL。\n\n這看起來是對 B. Riley 那份 $AAOI 賣出報告的間接回應——該報告聲稱這些最佳化會「壓平網路架構，並砍掉 40-50% 的光收發模組 TAM（總潛在市場）」。\n\nRosenblatt 的結論是：他們早就把這件事模型化了，即使每顆 XPU 用到的收發模組變少，但 XPU 的數量成長得如此之快，光學總需求仍然會上升。\n\n關於 CPO 的雷射架構：VCSEL 在 NPO（近封裝光學）／短距傳輸上是可信的過渡橋樑。\n\n但 CPO 的理想架構是 UHP CW（超高功率連續波）雷射，而非其他雷射，並引用博通的說法為證。這剛好支持了我對 $SIVE 的核心論點。\n\n我覺得我跟 Rosenblatt 在很多事情上的看法一致，我滿欣賞他們的風格。","likes":919,"views":401810,"reposts":72,"q":null},{"id":"2075634064518955297","ts":"2026-07-10T17:31:39.000Z","url":"https://x.com/aleabitoreddit/status/2075634064518955297","text":"Rosenblatt on recent optical sector weakness from $AAOI to $LITE:\n\n\"Stocks in the Optical sector have traded poorly for the last 1-2 months\" due to CPO delay reports and China capacity scares.\n\n\"We think short sellers... do not actually strongly believe in the thesis.\"\n\nMultiple short sellers told them they will likely close their positions... late July and early August. Further, they say they plan to buy Optical stocks in 2027 for the scale up CPO opportunity.\n\nHilarious report on laser weakness, read is very positive for $SIVEF, $COHR, and others moving forward.\n\nI've been long on CPO sector, but seems like institutions want entry points, just a bit later on.","zh":"Rosenblatt 談近期從 $AAOI 到 $LITE 的光通訊板塊疲弱：\n\n「光通訊類股過去 1-2 個月表現不佳」，原因是 CPO（共封裝光學）延遲報導與中國產能疑慮。\n\n「我們認為放空的人⋯⋯其實並沒有那麼相信這套空方論述。」\n\n多位放空者告訴他們，很可能會在 7 月底到 8 月初回補部位。此外，他們還說打算在 2027 年買進光通訊股，押注 CPO 規模化的機會。\n\n這是一篇談雷射疲弱、讀起來卻很正面的好笑報告，對 $SIVEF、$COHR 等公司後續是利多。\n\n我一直都做多 CPO 板塊，但看來機構是想要進場點，只是時間點稍晚一些。","likes":1715,"views":486158,"reposts":136,"q":null},{"id":"2075611260771852590","ts":"2026-07-10T16:01:02.000Z","url":"https://x.com/aleabitoreddit/status/2075611260771852590","text":"Sk Hynix is now trading under $SKHYV!\n\nIt's now up an insane 16%.\n\nI wonder how Sk Hynix over in Korea is going to react on Monday. https://t.co/Mmqdu0poVY","zh":"SK 海力士現在以 $SKHYV 的代號交易了！\n\n現在誇張地漲了 16%。\n\n真好奇韓國那邊的 SK 海力士週一會怎麼反應。","likes":1578,"views":802734,"reposts":93,"q":"aleabitoreddit：Why do I have this weird feeling the main reason retail is excited SK Hynix NASDAQ listing.\n\nIs because they can do degen option calls instead of individual stock purchases. https://t.co/vXmrncXQOm"},{"id":"2075590371531493729","ts":"2026-07-10T14:38:01.000Z","url":"https://x.com/aleabitoreddit/status/2075590371531493729","text":"Why do I have this weird feeling the main reason retail is excited SK Hynix NASDAQ listing.\n\nIs because they can do degen option calls instead of individual stock purchases. https://t.co/vXmrncXQOm","zh":"為什麼我有種奇怪的感覺，散戶對 SK 海力士在那斯達克掛牌這麼興奮的主因，\n\n是因為他們可以去玩賭博式的選擇權買權，而不用直接買個股。","likes":1096,"views":1050652,"reposts":34,"q":null},{"id":"2075557588159058076","ts":"2026-07-10T12:27:45.000Z","url":"https://x.com/aleabitoreddit/status/2075557588159058076","text":"Mitsubishi Motors joins robotics race to deploy humanoid workers by 2027. \n\nPairing with Highlanders, a Japanese robotics company.\n\n- Agility $CCXI x Foxconn, Toyota\n- Apptronik x $JBL, Mercedes\n- Highlanders x Mitsubishi\n- Figure × BMW\n- Boston Dynamics x Hyundai (subsidiaries)\n- Optimus x Tesla (Internal)\n- Rainbow Robotics x Samsung (subsidiaries)\n\nIdk if it's just me of there's a lot of patterns with humanoid companies playing buddy-buddy up with a major auto player/manufacturer.  \n\nIf they're not already vertically integrated by one already. \n\nThen the Chinese players like UBTech/AgiBot/Unitree  don't seem to care and work with a wide variety of auto players in China. \n\nCurious how this trend plays out...","zh":"三菱汽車加入機器人競賽，目標在 2027 年前導入人形機器人勞動力。\n\n合作對象是日本機器人公司 Highlanders。\n\n- Agility $CCXI × 富士康、豐田\n- Apptronik × $JBL、賓士\n- Highlanders × 三菱\n- Figure × BMW\n- Boston Dynamics × 現代（子公司關係）\n- Optimus × Tesla（內部自研）\n- Rainbow Robotics × 三星（子公司關係）\n\n不知道是不是只有我這樣覺得，人形機器人公司跟大型車廠／製造商稱兄道弟的模式也太明顯了。\n\n如果他們還沒被其中一家垂直整合掉的話。\n\n至於中國玩家像 UBTech／智元／宇樹，看起來就不太在意這套，在中國跟各家車廠都合作。\n\n很好奇這個趨勢會怎麼發展⋯⋯","likes":784,"views":286552,"reposts":57,"q":null},{"id":"2075539824589860866","ts":"2026-07-10T11:17:10.000Z","url":"https://x.com/aleabitoreddit/status/2075539824589860866","text":"The \"Mythical Golden Egg Dragon Candle\" predicted the $SIVE rally today. \n\nIf you look at the Golden Egg hatching indicator I drew, you can tell it predicts Sivers CEO buying on the open market a day later. \n\nDo you guys think it's time I should sell courses on TA? https://t.co/LweBzWStuk","zh":"那個「神話級黃金蛋巨龍 K 棒」成功預測了 $SIVE 今天的反彈。\n\n如果你看我畫的黃金蛋孵化指標，就會發現它預測到了 Sivers 執行長隔天在公開市場買股。\n\n你們覺得我是不是該來賣技術分析課程了？","likes":1784,"views":620730,"reposts":70,"q":"aleabitoreddit：@EUlmsten wow the mythical golden egg dragon candle was spotted over the $SIVEF chart. \n\nSomething big is coming... https://t.co/V4CL41m5ax"},{"id":"2075496116481884524","ts":"2026-07-10T08:23:29.000Z","url":"https://x.com/aleabitoreddit/status/2075496116481884524","text":"Yep, it’s interesting to witness retail capitulation.\n\nAfter we got Bloomberg Meta compute article cleared up by their internal memo. \n\nAnd the 2 reports on delays were denied by Nvidia. \n\nBoth of which caused the selloff in the first place...\n\nSo Photonics / Nvidia’s roadmap hasn’t fundamentally changed:\n\n$LITE is still completely sold out for the next 2 years and likely into 2029.\n\n$SIVE is about to volume ramp with  GlobalFoundries, Jabil, Poet, Ayar, and other hyperscaler suppliers.\n\n$TSM COUPE and their TW suppliers from Shunsin to Foci aren’t randomly disappearing into the void.\n\n$AAOI and their $471m/month h2 2027 revenue projections haven’t changed.\n\n$IQE and their epiwafer contracts with Macom and Tower Semi haven’t disappeared.\n\n$AXTI ownership of 40% of the InP substrate supply chains haven’t suddenly disappeared.\n\nAs with any theme from Rocketlab + Space sector 50% drop back in 2025. \n\nOr Nebius + Neocloud 50% drop entering 2026.\n\nOr the Samsung/SK Hynix crash from Iran War LNG/Helium/Oil fears few months ago.\n\nVolatility from indiscriminate thematic selloffs isn’t typically representative of individual company fundamentals.\n\nRetail tends to build conviction over price movements and imaginary charts, then lose that when a stock drops.\n\nAnd institutions are probably placing limit orders to capitalize on that.\n\nConviction shouldn’t be tied to the quote of a stock on a certain day, but long term revenue or operating income growth.","zh":"是啊，看著散戶投降真的很有意思。\n\n在彭博那篇 Meta 算力的文章被他們自己的內部備忘錄澄清之後。\n\n以及那兩篇延遲報導被 Nvidia 否認之後。\n\n而這兩件事正是一開始引發賣壓的原因⋯⋯\n\n所以光子產業／Nvidia 的路線圖根本沒有本質上的改變：\n\n$LITE 未來兩年的產能仍然完全售罄，而且很可能延續到 2029 年。\n\n$SIVE 即將與 GlobalFoundries、Jabil、Poet、Ayar 以及其他 hyperscaler（超大規模雲端業者）供應商一起放量。\n\n$TSM 的 COUPE 以及從順新到 Foci 的台灣供應鏈，並沒有莫名其妙人間蒸發。\n\n$AAOI 那個 2027 年下半年每月 4.71 億美元的營收預測也沒有變。\n\n$IQE 與 Macom、Tower Semi 的 epiwafer（磊晶圓）合約也沒有消失。\n\n$AXTI 手握 InP（磷化銦）基板供應鏈 40% 的地位，也沒有突然不見。\n\n就像 2025 年 Rocketlab 與整個太空板塊下跌 50% 那次一樣。\n\n或是進入 2026 年時 Nebius 與 neocloud（新型雲端算力商）下跌 50% 那次。\n\n又或是幾個月前因伊朗戰爭引發 LNG／氦氣／原油疑慮，導致三星／SK 海力士崩跌那次。\n\n無差別的主題式賣壓所產生的波動，通常無法代表個別公司的基本面。\n\n散戶傾向於根據價格走勢和想像出來的線圖建立信心，然後在股價下跌時失去那份信心。\n\n而機構大概正掛著限價單，準備從中獲利。\n\n信心不該綁在某一天的股價報價上，而該建立在長期營收或營業利益的成長上。","likes":1694,"views":601151,"reposts":139,"q":"Lee_Trades：40% swing from the panic/X hysteria lows.\n\nI would not rely on X is an indicator but it can be a good contrarian tool.\n\nMore to the point I think photonic sector is starting to bottom. $SIVE"},{"id":"2075302956581449892","ts":"2026-07-09T19:35:56.000Z","url":"https://x.com/aleabitoreddit/status/2075302956581449892","text":"\"China is shipping ~90% of the world's humanoid robots. We cannot keep taking them lightly.\"\n\nElon's comment: \"For now\"\n\nMeanwhile, 1X today posts a video of the most advanced humanoid hand.\n\nLooks like the inflection point for American humanoid programs is here?\n\nBoth technologically with players like 1X and with mass production with $TSLA? \n\nI'm am personally long on Agility through $CCXI targeting commercialization with Amazon and others. \n\nBut I'm proud to see American robotics as a whole go brrrr.","zh":"「中國出貨了全球約 90% 的人形機器人。我們不能再輕視他們了。」\n\nElon 的回應：「目前是這樣」\n\n同時，1X 今天發布了一支影片，展示了目前最先進的人形機器人手部。\n\n看來美國人形機器人計畫的轉折點已經到了？技術面有 1X 這樣的玩家，量產面則有 $TSLA？\n\n我個人是透過 $CCXI 做多 Agility，看好它與 Amazon 等業者的商業化進程。\n\n但整體而言，看到美國機器人產業整個衝起來，我覺得很驕傲。","likes":1825,"views":784710,"reposts":144,"q":"elonmusk：@PeterDiamandis For now"},{"id":"2075289915697553697","ts":"2026-07-09T18:44:07.000Z","url":"https://x.com/aleabitoreddit/status/2075289915697553697","text":"Three new $SIVE insider purchases today. \n\nMost notably: $SIVEF CEO Vikram bought 1,000,000 SEK worth of shares on the open market today. \n\nThis is following the massive drop on Sivers stock following 2 misleading CPO delay reports, Meta Compute headlines, and another insider sale report from another photonics director. \n\nTypically, insider sells for any number of reasons. But having the  CEO buy on the open-market is the clearest signal in management confidence. \n\nFollowing $GFS, $JBL, and other laser supplier partnerships, and his goal of NASDAQ listing in the near term. \n\nFeels like the CEO sees a clear potential for Sivers to become the next photonics giant (myself included).","zh":"今天出現三筆 $SIVE 的內部人買進。\n\n最值得注意的是：$SIVEF 執行長 Vikram 今天在公開市場買進了價值 100 萬瑞典克朗的股票。\n\n這是發生在 Sivers 股價因兩篇誤導性的 CPO（共封裝光學）延遲報導、Meta Compute 相關新聞、以及另一位光子部門董事的內部人賣出報導而重挫之後。\n\n通常內部人賣股可能有各種原因。但執行長在公開市場買進，是管理層信心最明確的訊號。\n\n再加上與 $GFS、$JBL 及其他雷射供應商的合作關係，以及他近期要在那斯達克掛牌的目標。\n\n感覺執行長清楚看見了 Sivers 成為下一個光子巨頭的潛力（我自己也這麼認為）。","likes":1889,"views":586429,"reposts":150,"q":"StormDirac：$SIVE fell today on an EFN article claiming the photonics chief sold his entire holding — presented as alarming insider panic. Here is what I think the article can have missed.\n\nAndrew McKee founded CST now Sivers Photonics in 1999— 27 years ago. He built the photonics business f"},{"id":"2075199849507762279","ts":"2026-07-09T12:46:14.000Z","url":"https://x.com/aleabitoreddit/status/2075199849507762279","text":"Nothing like an internal $META memo getting published.\n\nShowing AI ramping as usual:\n\n- LTAs signed with Samsung and $SNDK for memory\n- LTAs signed with Sumitomo Electric for fiber optics\n- Expected to deploy 7GW compute infra this year, and doubling in 2027. \n- as much as $145B capex spend this year \n\n“It plans to launch a chip about every six months through 2027”","zh":"沒有什麼比 $META 的內部備忘錄外流更精彩的了。\n\n內容顯示 AI 一如既往地在加速推進：\n\n- 已與三星和 $SNDK 簽訂記憶體 LTA（長期供貨合約）\n- 已與住友電工簽訂光纖 LTA\n- 預計今年部署 7GW 算力基礎設施，2027 年再翻倍\n- 今年資本支出高達 1450 億美元\n\n「該公司計畫在 2027 年之前，大約每六個月推出一款晶片」","likes":2018,"views":532661,"reposts":223,"q":null},{"id":"2074979055410266452","ts":"2026-07-08T22:08:52.000Z","url":"https://x.com/aleabitoreddit/status/2074979055410266452","text":"Wow, looks like Elon + xAI at $SPCX managed to build an Anthropic Opus-level LLM with Grok 4.5.\n\nThat’s much more cost efficient as well… \n\nKinda emulating what Chinese vendors have been doing to compete on pricing + adoption. (Which is an ideal thing given Chinese model growth among US companies recently)\n\nNever doubt Elon, maybe they might end up leapfrogging Anthropic + Mythos?","zh":"哇，看來 $SPCX 的 Elon 加上 xAI，成功用 Grok 4.5 做出了 Anthropic Opus 等級的大型語言模型。\n\n而且成本效益還高出許多⋯⋯\n\n有點像是在複製中國廠商一直以來的做法，用價格與採用率來競爭。（考量到近期中國模型在美國企業間的成長，這算是相當理想的做法）\n\n永遠不要懷疑 Elon，也許他們最後真的會超車 Anthropic 和 Mythos？","likes":2125,"views":446122,"reposts":153,"q":null},{"id":"2074965761345642660","ts":"2026-07-08T21:16:03.000Z","url":"https://x.com/aleabitoreddit/status/2074965761345642660","text":"$META to build a new $10B DC in Canada to expand AI capacity.\n\nSo much for the media framing of “Meta Compute”as overbuilding and cutting capex. https://t.co/0QgSls0s9o","zh":"$META 將在加拿大興建一座 100 億美元的新資料中心，以擴充 AI 算能。\n\n所謂「Meta Compute 過度建設、砍資本支出」的媒體敘事，看來也就這樣而已。","likes":1428,"views":344561,"reposts":128,"q":null},{"id":"2074951295027568736","ts":"2026-07-08T20:18:34.000Z","url":"https://x.com/aleabitoreddit/status/2074951295027568736","text":"Let’s put it this way:\n\nRetail thinks a 30-60% drop is a “falling knife” where bagholders will never recover. \n\nAnd they end up panic selling after seeing swiggly line TAs and people comparing valuable chokepoints to memes.\n\nI see it as long term ownership over:\n\n- the next hyperscaler with $NBIS, projecting $7-9B ARR Q4\n- 40% of the InP supply chain with $AXTI\n- leader of the next optical shift with $SIVE with CW DFB lasers\n- leader of US humanoids with $CCXI inside a future trillion dollar theme\n\nAnd so on… At cheaper valuations. \n\nWhile I might do things like lowering margin or hedging with my own portfolio, I’m personally not panicking when something drops if the thesis didn’t change. \n\nNFA and obviously depends on people’s investing timeframes:\n\nSince a crash would be life changing for people that depend on investing for rent or tuition. (Which is why I personally think  others should do their own DD and choose longs in line with their own risk profile)\n\nBut my personal goal is maximizing exposure to the next-gen supercycles before they hit.\n\nI think institutions think the same way as well, which is why there’s a lot of induced volatility along the way to maximize their exposure.\n\nIf a thesis ends up correct, the valuation should be reflected in the long run.","zh":"這樣說好了：\n\n散戶認為 30-60% 的跌幅是「接落刀」，套牢的人永遠回不了本。\n\n然後他們在看了那些歪歪扭扭的技術線圖、看了有人把珍貴的產業咽喉點拿來跟迷因比較之後，就恐慌性賣出了。\n\n但我看到的是長期持有以下這些的機會：\n\n- $NBIS，下一個 hyperscaler（超大規模雲端業者），第四季 ARR（年化經常性收入）預估 70-90 億美元\n- $AXTI，掌握 InP（磷化銦）供應鏈的 40%\n- $SIVE，下一波光學轉換的領導者，主打 CW DFB（連續波分散式回饋）雷射\n- $CCXI，美國人形機器人的領導者，身處未來的兆美元級主題\n\n諸如此類⋯⋯而且是在更便宜的估值上。\n\n雖然我自己的投資組合可能會做一些降低保證金、或避險之類的動作，但只要論點沒變，個股下跌我本人是不會恐慌的。\n\nNFA（非投資建議），而且這顯然取決於每個人的投資時間框架：\n\n因為對那些得靠投資支付房租或學費的人來說，一次崩盤會徹底改變人生。（這也是為什麼我個人認為，大家應該自己做 DD（盡職調查），並選擇符合自身風險屬性的多頭部位）\n\n但我個人的目標，是在下一代超級循環真正到來之前，把曝險最大化。\n\n我認為機構的想法也是一樣，這也是為什麼過程中會有這麼多被誘發出來的波動——好讓他們把自己的曝險放到最大。\n\n如果一個論點最後被證明是對的，長期而言估值就會反映出來。","likes":2571,"views":1196581,"reposts":183,"q":"Laila54623：@aleabitoreddit 白毛股神，能不能给我点心理按摩，NBIS是否今晚能止跌？它已经亏了我太多了，接近腰斩了"},{"id":"2074838397341065516","ts":"2026-07-08T12:49:57.000Z","url":"https://x.com/aleabitoreddit/status/2074838397341065516","text":"Blue Origin reportedly raising $10B at a $130B valuation per NYT.\n\nSeems pretty positive for $RKLB, $ASTS, and other space names in terms of relative valuation anchoring. \n\nIf SpaceX and Blue Origin is able to set such high valuations. https://t.co/04W7phuIwr","zh":"據紐約時報報導，Blue Origin 正以 1300 億美元估值募資 100 億美元。\n\n就相對估值錨定而言，這對 $RKLB、$ASTS 等太空類股似乎相當正面。\n\n如果 SpaceX 與 Blue Origin 能訂出這麼高的估值的話。","likes":1688,"views":485400,"reposts":153,"q":null}],"mentions":[{"post_id":"2074838397341065516","ticker":"ASTS","stance":"bullish","note":"同上，太空板塊估值錨定受惠"},{"post_id":"2074838397341065516","ticker":"RKLB","stance":"bullish","note":"Blue Origin 以 1300 億估值募資，對太空股形成相對估值錨定"},{"post_id":"2074951295027568736","ticker":"AXTI","stance":"bullish","note":"掌握 InP 供應鏈 40%，逢低長期持有"},{" const P = {}; D.posts.forEach(p=>P[p.id]=p);
const LATEST = new Date(D.latest+'T23:59:59Z');
const VIEWS = [['d','📅 每日',1],['w','📆 每週',7],['m','📈 每月',28],['q','📊 每季',90]];
let view='d', q='';

const S = {bullish:['看多','bull'],bearish:['看空','bear'],neutral:['中性','neut'],mention:['提及','ment']};
const fmt = n => n==null?'—':(n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n);

function since(days){ const t=new Date(LATEST); t.setUTCDate(t.getUTCDate()-(days-1)); t.setUTCHours(0,0,0,0); return t; }

function agg(){
  const from=since(VIEWS.find(v=>v[0]===view)[2]);
  const out={};
  D.mentions.forEach(m=>{
    const p=P[m.post_id]; if(!p) return;
    if(new Date(p.ts)<from) return;
    (out[m.ticker]=out[m.ticker]||[]).push({...m,ts:p.ts});
  });
  return out;
}

function pxChange(tk,days){
  const s=D.prices[tk]; if(!s||s.d.length<2) return null;
  const end=s.d[s.d.length-1][1];
  const from=since(days).toISOString().slice(0,10);
  let i=s.d.findIndex(x=>x[0]>=from);
  if(i<0) return null;
  // 基準取區間開始「之前」的最後一個收盤；若沒有（資料起點就在區間內）才退回第一筆
  const base=s.d[i>0?i-1:0][1];
  if(i===0 && s.d.length>1 && s.d[0][0]>=from) return null;
  if(base===end && i===0) return null;
  return {pct:(end/base-1)*100, cur:s.cur, last:end};
}

function render(){
  document.getElementById('tabs').innerHTML=VIEWS.map(v=>`<div class="tab ${v[0]===view?'on':''}" data-v="${v[0]}">${v[1]}</div>`).join('');
  document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>{view=e.dataset.v;render()});
  const A=agg(), days=VIEWS.find(v=>v[0]===view)[2];
  const ALL={}; D.mentions.forEach(m=>{(ALL[m.ticker]=ALL[m.ticker]||[]).push(m)});
  let keys=Object.keys(A);
  if(q){const s=q.toUpperCase();keys=keys.filter(k=>k.includes(s)||((D.meta[k]||{}).name||'').toUpperCase().includes(s)||((D.sectors||{})[k]||'').includes(q));}
  keys.sort((a,b)=>A[b].length-A[a].length||a.localeCompare(b));
  const nPosts=new Set(Object.values(A).flat().map(m=>m.post_id)).size;
  document.getElementById('stats').textContent=`近 ${days} 天：${keys.length} 檔股票 · ${nPosts} 則貼文 · ${Object.values(A).flat().length} 次提及`;
  const g=document.getElementById('grid');
  if(!keys.length){g.innerHTML='<div class="empty">這個區間沒有資料</div>';return;}
  g.innerHTML=keys.map(k=>{
    const ms=A[k].slice().sort((a,b)=>a.ts<b.ts?1:-1);
    const c={}; ms.forEach(m=>c[m.stance]=(c[m.stance]||0)+1);
    const ch=pxChange(k,days);
    const nm=(D.meta[k]||{}).name||'';
    return `<div class="card" data-k="${k}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <span><span class="tk">$${k}</span>${(D.sectors||{})[k]?`<span class="mini"> - ${D.sectors[k]}</span>`:''}</span>
        ${ch?`<span class="chg ${ch.pct>=0?'up':'dn'}">${ch.pct>=0?'▲':'▼'} ${Math.abs(ch.pct).toFixed(1)}%</span>`:''}
      </div>
      <div class="co">${nm}</div>
      <div class="mini" style="margin:5px 0 3px">本區間（近 ${days} 天）</div>
      <div class="pills">${Object.entries(c).map(([s,n])=>`<span class="pill ${S[s][1]}">${S[s][0]} ${n}</span>`).join('')}</div>
      <div class="snip">${ms[0].note}</div>
      <div class="mini" style="margin-top:6px">最近提及 ${ms[0].ts.slice(0,10)} · 本區間 ${ms.length} 次 · 全部期間 ${(ALL[k]||[]).length} 次</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.card').forEach(e=>e.onclick=()=>detail(e.dataset.k));
}

function chart(tk,firstDate){
  const s=D.prices[tk]; if(!s) return '<div class="mini">（此標的沒有股價資料）</div>';
  const d=s.d.filter(x=>x[0]>=firstDate); if(d.length<2) return '<div class="mini">（股價資料不足）</div>';
  const W=840,H=210,PAD=42;
  const vs=d.map(x=>x[1]),mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;
  const X=i=>PAD+i*(W-PAD-14)/(d.length-1), Y=v=>14+(1-(v-mn)/rg)*(H-40);
  const path=d.map((x,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(x[1]).toFixed(1)}`).join('');
  const idx={}; d.forEach((x,i)=>idx[x[0]]=i);
  const marks=D.mentions.filter(m=>m.ticker===tk).map(m=>{
    const day=P[m.post_id].ts.slice(0,10); let i=idx[day];
    if(i===undefined){const c=d.findIndex(x=>x[0]>=day); if(c<0) return ''; i=c;}
    const col={bullish:'#1a7f37',bearish:'#cf222e',neutral:'#bf8700',mention:'#8c959f'}[m.stance];
    return `<circle cx="${X(i).toFixed(1)}" cy="${Y(d[i][1]).toFixed(1)}" r="3.4" fill="${col}" opacity=".95"><title>${day} ${S[m.stance][0]}</title></circle>`;
  }).join('');
  const chg=(d[d.length-1][1]/d[0][1]-1)*100;
  return `<div class="chart"><div class="mini" style="margin-bottom:4px">首次提及（${firstDate}）以來股價 · ${s.cur} · ${s.ex||''}
   <b class="${chg>=0?'up':'dn'}" style="float:right">${chg>=0?'+':''}${chg.toFixed(1)}%</b></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%">
   <line x1="${PAD}" y1="14" x2="${PAD}" y2="${H-26}" stroke="#d1d9e0"/>
   <line x1="${PAD}" y1="${H-26}" x2="${W-14}" y2="${H-26}" stroke="#d1d9e0"/>
   <text x="4" y="18" fill="#6e7781" font-size="10">${mx.toFixed(1)}</text>
   <text x="4" y="${H-28}" fill="#6e7781" font-size="10">${mn.toFixed(1)}</text>
   <text x="${PAD}" y="${H-10}" fill="#6e7781" font-size="10">${d[0][0]}</text>
   <text x="${W-70}" y="${H-10}" fill="#6e7781" font-size="10">${d[d.length-1][0]}</text>
   <path d="${path}" fill="none" stroke="#0969da" stroke-width="1.6"/>${marks}
  </svg></div>`;
}

function detail(tk){
  const ms=D.mentions.filter(m=>m.ticker===tk).map(m=>({...m,ts:P[m.post_id].ts})).sort((a,b)=>a.ts<b.ts?1:-1);
  const first=ms[ms.length-1].ts.slice(0,10);
  const nm=(D.meta[tk]||{}).name||'';
  const c={}; ms.forEach(m=>c[m.stance]=(c[m.stance]||0)+1);
  const esc=s=>(s||'').replace(/</g,'&lt;');
  const rows=ms.map((m,i)=>{const p=P[m.post_id];return `<tr>
    <td class="d">${m.ts.slice(0,10)}<div class="mini">${m.ts.slice(11,16)}</div></td>
    <td class="s"><span class="pill ${S[m.stance][1]}">${S[m.stance][0]}</span></td>
    <td><b>${m.note}</b>
      <div class="ptext">${esc(p.zh||p.text)}</div>
      ${p.zh?`<span class="lang" data-i="${i}">🔤 看英文原文</span><div class="en" id="en${i}">${esc(p.text)}</div>`:''}
      ${p.q?`<div class="qt">引用 @${esc(p.q)}</div>`:''}
      <div class="mini" style="margin-top:5px">♥ ${fmt(p.likes)} · 🔁 ${fmt(p.reposts)} · 👁 ${fmt(p.views)} · <a href="${p.url}" target="_blank">看原始貼文 ↗</a></div>
    </td></tr>`}).join('');
  document.getElementById('panel').innerHTML=`<span class="x" id="cx">✕</span>
    <div><span class="tk" style="font-size:24px">$${tk}</span>${(D.sectors||{})[tk]?`<span class="mini"> - ${D.sectors[tk]}</span>`:''}</div><div class="co">${nm}</div>
    <div class="mini" style="margin:10px 0 3px">全部期間（${first} 起，共 ${ms.length} 次提及）</div>
    <div class="pills">${Object.entries(c).map(([s,n])=>`<span class="pill ${S[s][1]}">${S[s][0]} ${n}</span>`).join('')}</div>
    <div class="mini" style="margin:9px 0 3px">目前檢視區間（${VIEWS.find(v=>v[0]===view)[1].replace(/^\S+\s/,'')}，近 ${VIEWS.find(v=>v[0]===view)[2]} 天）</div>
    <div class="pills">${(()=>{const w=ms.filter(m=>new Date(m.ts)>=since(VIEWS.find(v=>v[0]===view)[2]));
      if(!w.length) return '<span class="pill ment">此區間內沒有提及</span>';
      const cw={}; w.forEach(m=>cw[m.stance]=(cw[m.stance]||0)+1);
      return Object.entries(cw).map(([s,n])=>`<span class="pill ${S[s][1]}">${S[s][0]} ${n}</span>`).join('');})()}</div>
    ${chart(tk,first)}
    <div class="hd"><h3 style="margin-bottom:0">完整立場變化紀錄（${ms.length} 次提及）</h3>
      <span class="lang" id="allEn">🔤 全部顯示英文原文</span></div>
    <table>${rows}</table>`;
  document.getElementById('ov').classList.add('on');
  document.getElementById('cx').onclick=close_;
  document.querySelectorAll('.lang[data-i]').forEach(e=>e.onclick=()=>{
    const t=document.getElementById('en'+e.dataset.i);
    t.classList.toggle('on');
    e.textContent=t.classList.contains('on')?'🔤 收起英文原文':'🔤 看英文原文';
  });
  const all=document.getElementById('allEn');
  if(all) all.onclick=()=>{
    const els=[...document.querySelectorAll('.en')];
    const show=!els.every(x=>x.classList.contains('on'));
    els.forEach(x=>x.classList.toggle('on',show));
    document.querySelectorAll('.lang[data-i]').forEach(e=>e.textContent=show?'🔤 收起英文原文':'🔤 看英文原文');
    all.textContent=show?'🔤 全部收起英文原文':'🔤 全部顯示英文原文';
  };
  window.scrollTo(0,0);
}
function close_(){document.getElementById('ov').classList.remove('on')}
document.getElementById('ov').onclick=e=>{if(e.target.id==='ov')close_()};
document.onkeydown=e=>{if(e.key==='Escape')close_()};
document.getElementById('q').oninput=e=>{q=e.target.value.trim();render()};
document.getElementById('rng').textContent=D.range[0]+' ～ '+D.range[1];
document.getElementById('gen').textContent=D.generated;
render();
</script></body></html>
