<script>
const D = {"generated":"2026-08-21 09:38","latest":"2026-08-20","range":["2026-07-08","2026-08-20"],"posts":[{"id":"2090510568474231045","ts":"2026-08-20T18:45:33.000Z","url":"https://x.com/aleabitoreddit/status/2090510568474231045","text":"After seeing how the robotics and space sectors reacted to Unitree and $SPCX IPOs\n\nI’m not quite sure I want Anthropic to go public… https://t.co/hY6tM1r4Qb","zh":"看到機器人與太空板塊對宇樹和 $SPCX 的 IPO 分別是什麼反應之後⋯⋯\n\n我不太確定我希望 Anthropic 上市了⋯⋯","likes":745,"views":null,"reposts":14,"q":null},{"id":"2090490101260591481","ts":"2026-08-20T17:24:14.000Z","url":"https://x.com/aleabitoreddit/status/2090490101260591481","text":"Very positive. My opinion is that the optical sector underperformance recently from $AAOI to $SIVE has been absurd.\n\nThe demand visibility... is just way too stupidly high.\n\nAOI: “Even combined AOI, Coherent program altogether, is still very tough to meet the customer demand in the next 3 years” (2029)\n\nElazr GM: \"entire optical supply chain was facing major shortages.\" \"The shortage will continue to the next few years\"\n\nSivers CEO said the same thing about InP laser demand imbalances expected for the next 3-5 years.\n\nCan go on and on about $LITE, $MTSI and other comments.\n\nWe haven't even hit the inflection point with 1.6T, NPO, CPO scale out/up, and optics with memory (as seen with SK Hynix).\n\nYet the industry is already bottlenecked by EML/CW and all your other upstream components from PDs/TIA/DSPs, transceivers, and soon FAU + others when CPO scales… \n\nI'm personally extremely comfortable watching this all play out, but just a little confused that markets don't know how to math a year or two ahead.","zh":"非常正面。我的看法是，近期從 $AAOI 到 $SIVE 的光通訊板塊表現落後，實在荒謬。\n\n那個需求能見度⋯⋯高到有點誇張的程度。\n\nAOI：「就算把 AOI 和 Coherent 的產能全部加起來，未來 3 年（到 2029 年）要滿足客戶需求還是非常吃力」\n\n旭創總經理：「整條光學供應鏈都面臨嚴重短缺。」「短缺將持續到未來幾年」\n\nSivers 執行長也講過同樣的話，表示 InP（磷化銦）雷射的需求失衡預計會持續 3-5 年。\n\n$LITE、$MTSI 和其他公司的說法還可以一直列下去。\n\n而我們甚至還沒碰到 1.6T、NPO（近封裝光學）、CPO 橫向／縱向擴展，以及光學與記憶體結合（如 SK 海力士所展示的）這些轉折點。\n\n然而整個產業已經卡在 EML（電吸收調變雷射）／CW（連續波）以及所有上游零組件上了——從 PD（光二極體）、TIA、DSP 到收發模組，等 CPO 放量後很快還會輪到 FAU⋯⋯\n\n我個人非常安心地看著這一切慢慢兌現，只是有點困惑，為什麼市場不知道該怎麼把一兩年後的事算進去。","likes":1274,"views":null,"reposts":91,"q":"stekkerauto：@aleabitoreddit @EnamelEquity you’re still positive about $SIVE, right? just needs time to play out."},{"id":"2090374603264929981","ts":"2026-08-20T09:45:17.000Z","url":"https://x.com/aleabitoreddit/status/2090374603264929981","text":"I'm glad the leverage bros moved from AI stocks back to Hyerliquid and biotech like $MRNA, so maybe we'll see a faster recovery. \n\nAside from that just some TLDR stuff:\n\n- $EWY up, primarily from SK Hynix buybacks (they're just too profitable), and Samsung Foundry roughly ~10-15% price hikes. \n\n- $SKHY unveils CPO roadmap?? Apparently they're doing something with photonic interposer that links to memory, so I gotta look a bit deeper into this\n\nProbably going to be more TAM expansion, more supply chain beneficiaries (eg. lasers, PICs, packaging) off this.\n\n- $YMTC pursuing IPO next quarter following CMXT's successful IPO. \n\nThe Chinese IPO market is just going brrr from Unitree to memory makers. \n\nUS needs to do something similar rather than IPOing companies at trillion dollar valuations already. \n\n- Tyntek limit up there's now order visibility through 2028, given photodiode demand imbalance for photonics. \n\nElazr GM did say the entire optical supply chain was facing major shortages... I'll probably look more at high-end PD bottlenecks next.\n\n- MS forecasts a 50% Q/Q price increase for DDR4 for Q3, and 10%+ increase for Q4 2026. (Nanya/2408, Windbond/2344, should be happy). \n\n- China reportedly delays clearance from germanium, quartz-based materials, and neodymium magnets To taiwan. \n\nSo I'll probably have some fun looking into supply chains disruptions there over cup noodles.\n\n- High-end PCB drill shortage (still ongoing), Kawei (5498) said AI DCs, servers and optical communications are driving demand for PCBs, HDI and package substrates, while tungsten prices are rising. \n\nThough the world's five largest drill manufacturers are aggressively expanding capacity, supply remains far below overall market demand\n\nJust stuff I found interesting recently, obviously $MRNA stuff is too.","zh":"我很高興那些玩槓桿的兄弟已經從 AI 股轉戰 Hyperliquid 和 $MRNA 這類生技股了，也許這樣我們能看到更快的復甦。\n\n除此之外，一些重點整理：\n\n- $EWY 上漲，主因是 SK 海力士的庫藏股買回（他們實在太會賺了），以及三星晶圓代工約 10-15% 的漲價。\n\n- $SKHY 公布了 CPO（共封裝光學）路線圖？？看來他們正在做某種連接記憶體的光子中介層，我得再深入研究一下。\n\n這件事很可能會帶來更多 TAM（總潛在市場）擴張，以及更多供應鏈受惠者（例如雷射、PIC 光子積體電路、封裝）。\n\n- $YMTC 在長鑫存儲（CMXT）成功掛牌之後，也打算下一季 IPO。\n\n中國的 IPO 市場從宇樹到記憶體廠都爽爆。\n\n美國也該做點類似的事，而不是等公司估值已經上兆才讓它上市。\n\n- 台半（Tyntek）漲停，因為光子產業的光二極體（photodiode）需求失衡，訂單能見度已經看到 2028 年。\n\n旭創總經理確實說過整條光學供應鏈都面臨嚴重短缺⋯⋯我接下來大概會多研究高階 PD 的瓶頸。\n\n- 摩根士丹利預估 DDR4 在第三季將季增 50% 漲價，2026 年第四季再漲逾 10%。（南亞科／2408、華邦電／2344 應該會很開心。）\n\n- 據報中國延後對台灣的鍺、石英基材料與釹磁鐵的出口放行。\n\n所以我大概會邊吃泡麵邊研究那邊的供應鏈中斷問題。\n\n- 高階 PCB 鑽針短缺（仍在持續中），尖點（5498）表示 AI 資料中心、伺服器與光通訊正在帶動 PCB、HDI 與封裝載板的需求，同時鎢價正在上漲。\n\n儘管全球前五大鑽針製造商都在積極擴產，供給仍然遠低於整體市場需求。\n\n以上就是我最近覺得有意思的東西，$MRNA 那些當然也算。","likes":1008,"views":null,"reposts":37,"q":null},{"id":"2090103899302826302","ts":"2026-08-19T15:49:36.000Z","url":"https://x.com/aleabitoreddit/status/2090103899302826302","text":"$MRVL gives $GOOGL options to buy $12.2B of the company. \n\n\"The Marvell-Google deal covers a broad range of technologies used ​with TPUs, including processors that run AI models, manage data storage ​and  move information ⁠across networks.\"\n\nWhich could translate into ~$120 billion ​in revenue through 2033. \n\nMarvell also has separate warrants with $AMZN after their Celestial acquisition (for purchases of photonic fabric).\n\nRemember the good times when Jensen said Marvell would be the next $1T+ company?  \n\nSeems Nvidia knew Marvell was \"networking\" its way into all the hyperscalers with warrants.","zh":"$MRVL 給予 $GOOGL 認購該公司 122 億美元股份的選擇權。\n\n「Marvell 與 Google 的這筆交易涵蓋一系列與 TPU 相關的技術，包括執行 AI 模型的處理器、管理資料儲存的晶片，以及在網路間搬移資訊的元件。」\n\n這可能在 2033 年前轉化為約 1,200 億美元的營收。\n\nMarvell 在併購 Celestial 之後，另外還與 $AMZN 有認股權證（用於採購光子織構 photonic fabric）。\n\n還記得當年黃仁勳說 Marvell 會是下一家市值破 1 兆美元的公司那段美好時光嗎？\n\n看來輝達早就知道 Marvell 正靠著認股權證，一路「網路」進所有超大規模業者裡面。","likes":898,"views":null,"reposts":71,"q":null},{"id":"2089973586425766134","ts":"2026-08-19T07:11:47.000Z","url":"https://x.com/aleabitoreddit/status/2089973586425766134","text":"We got $LITE, $MTSI, $AAOI all pointing to extreme demand imbalances with lasers/TIA/DSP/etc from earnings... \n\nAnd now Elazr GM at their investor conference stated: \n\nOptical supply is still far behind the market demand, the expected AI optical supply chain are likely to continue for years.\n\n- \"the entire supply chain is out of stock\"\n\n- \"the supply is still far behind the market demand\"\n\n- \"the shortage will continue to the next few years\"\n\n\"Whether it is PCB, carrier board, laser chip, or even related packaging  capacity, as long as the AI supply chain link, almost all are in short supply.\" \n\nWhen demand visibility extends for years with the supply chain bottlenecked:\n\nIt's getting difficult not to see photonics echoing the memory supercycle entering 2027.","zh":"我們已經看到 $LITE、$MTSI、$AAOI 的財報全都指向雷射／TIA／DSP 等環節的極端需求失衡⋯⋯\n\n而現在旭創（Elazr）總經理在他們的投資人會議上表示：\n\n光學供應仍然遠遠落後市場需求，預期 AI 光學供應鏈的情況很可能會持續數年。\n\n-「整條供應鏈都處於缺貨狀態」\n\n-「供給仍然遠遠落後市場需求」\n\n-「短缺將持續到未來幾年」\n\n「不論是 PCB、載板、雷射晶片，甚至是相關的封裝產能，只要是 AI 供應鏈的環節，幾乎全部都在短缺。」\n\n當需求能見度延伸到好幾年，而供應鏈又處於瓶頸狀態時：\n\n愈來愈難不去覺得，光子板塊進入 2027 年就是記憶體超級循環的翻版。","likes":1182,"views":null,"reposts":74,"q":null},{"id":"2089908198694351064","ts":"2026-08-19T02:51:57.000Z","url":"https://x.com/aleabitoreddit/status/2089908198694351064","text":"Unitree (688836) is now public.\n\nAnd is valued at ~$53.3B, after rising +492.18%\n\nWe finally have a major public company benchmark for humanoids.\n\nFor reference, Agility (backed by $NVDA, $AMZN) via $CCXI is expected to go public at $2.5B premoney valuation Q4. \n\n$TSLA is $1T+, but Optimus is wrapped inside a much larger company.\n\nBut I think Unitree showed that the demand for pure play humanoid players is much larger… than people expected in public markets.","zh":"宇樹科技（688836）現在正式掛牌了。\n\n上漲 +492.18% 之後，估值約 533 億美元。\n\n我們終於有了一個人形機器人的大型上市公司對照基準。\n\n作為參考，由 $NVDA、$AMZN 投資的 Agility，透過 $CCXI 預計在第四季以 25 億美元的投前估值上市。\n\n$TSLA 市值超過 1 兆美元，但 Optimus 是包在一家大得多的公司裡面。\n\n但我認為宇樹證明了一件事：公開市場對純人形機器人標的的需求，比大家原本預期的大得多。","likes":1722,"views":null,"reposts":115,"q":null},{"id":"2089766053274661143","ts":"2026-08-18T17:27:07.000Z","url":"https://x.com/aleabitoreddit/status/2089766053274661143","text":"My $AAOI TLDR notes at Rosenblatt summit:\n\n- Expected to get paid premiums for US production of 800g/1.6T (very positive for ASP/margins).\n\n- Several LTAs on the table, but doesn't want to sign to get capacity blocked by other customers (cough cough $NVDA). \n\n- Sold out at least through second half of next year and beyond. (High demand visibility like $LITE)\n\n- Has 300-400 mW lasers already. \n\n- Expects margins to be above 40%+ once CPO comes about (probably most material for rerating). \n\nI can't see how anyone can be bearish on this company...","zh":"我在 Rosenblatt 高峰會上關於 $AAOI 的重點筆記：\n\n- 預期美國本土生產的 800G／1.6T 產品可以拿到溢價（對平均售價／毛利率非常正面）。\n\n- 手上有好幾份長約（LTA）待簽，但他們不想簽下去讓產能被其他客戶鎖死（咳咳，$NVDA）。\n\n- 產能至少已經售罄到明年下半年，甚至更久。（跟 $LITE 一樣有很高的需求能見度）\n\n- 已經有 300-400 mW 的雷射。\n\n- 預期等 CPO（共封裝光學）真正到來後，毛利率會在 40% 以上（這大概是重新評價最關鍵的一點）。\n\n我實在看不出來有人要怎麼看空這家公司⋯⋯","likes":1171,"views":null,"reposts":78,"q":null},{"id":"2089746797300432912","ts":"2026-08-18T16:10:36.000Z","url":"https://x.com/aleabitoreddit/status/2089746797300432912","text":"I'm getting Vietnam flashbacks to the launch of OpenAi. \n\nWhere with every model, it just keeps getting better... but now with hunanoids. \n\nUnitree has claimed that their humanoids:\n\n- Can now run faster than Usain Bolt.\n- Can now jump higher than any human. \n\nAnd with their IPO tomorrow, it seems like China is leading the hardware race.","zh":"我又有那種既視感了，像是當年 OpenAI 剛推出的時候。\n\n每出一代模型，就是不斷變得更好⋯⋯只是這次換成人形機器人。\n\n宇樹聲稱他們的人形機器人：\n\n- 現在跑得比波爾特（Usain Bolt）還快。\n- 現在跳得比任何人類都高。\n\n再加上他們明天就要 IPO，看來中國正在硬體這場競賽中領先。","likes":782,"views":null,"reposts":36,"q":null},{"id":"2089690098875130084","ts":"2026-08-18T12:25:18.000Z","url":"https://x.com/aleabitoreddit/status/2089690098875130084","text":"Looks like we're getting the Strait of America, a new US territory... https://t.co/HCQ139Ys4V","zh":"看來我們要有「美國海峽」了，一塊新的美國領土⋯⋯","likes":867,"views":null,"reposts":28,"q":null},{"id":"2089547564249219163","ts":"2026-08-18T02:58:55.000Z","url":"https://x.com/aleabitoreddit/status/2089547564249219163","text":"So just tracking the MLCC cycle:\n\nComponentNews classified server MLCCs as “severe” shortage stage, with ETNews reporting:\n\n- Samsung has reached ~40 week lead times for some high capacitance MLCCs per DigiKey’s shipment data.\n\nEarlier this year, broader reports were ~20 weeks, so the AI server MLCC bottleneck keeps growing.\n\n- Murata was ~24 weeks in June. \n\nJuly was ~30 weeks. And now some at ~36 weeks. \n\nThis was interesting: \n\n“The expansion of new production capacity is being postponed from Q4 2026 to 2027”\n\nDoesn’t say which expansion… maybe Murata? But if capacity expansion reportedly gets stalled, the bottleneck should tighten short term.\n\nLead times are a good way to track demand imbalances.","zh":"追蹤一下 MLCC 循環：\n\nComponentNews 把伺服器用 MLCC 列為「嚴重」短缺階段，而 ETNews 報導：\n\n- 根據 DigiKey 的出貨資料，三星部分高容值 MLCC 的交期已經拉到約 40 週。\n\n今年稍早比較廣泛的報導約是 20 週，所以 AI 伺服器 MLCC 的瓶頸還在持續擴大。\n\n- 村田在 6 月時約 24 週。\n\n7 月約 30 週。現在有些已經到約 36 週。\n\n這點很有意思：\n\n「新產能的擴充正從 2026 年第四季延後到 2027 年」\n\n文中沒說是哪一家的擴產⋯⋯可能是村田？但如果產能擴充真的被卡住，短期內瓶頸應該會更緊。\n\n交期是追蹤需求失衡很好用的指標。","likes":424,"views":null,"reposts":30,"q":null},{"id":"2089422562019393654","ts":"2026-08-17T18:42:13.000Z","url":"https://x.com/aleabitoreddit/status/2089422562019393654","text":"I've decided to name my next two pets Applied Optoelectronics and Sivers Semiconductors","zh":"我決定把接下來要養的兩隻寵物取名為 Applied Optoelectronics 和 Sivers Semiconductors。","likes":3308,"views":null,"reposts":92,"q":null},{"id":"2089355682286092748","ts":"2026-08-17T14:16:27.000Z","url":"https://x.com/aleabitoreddit/status/2089355682286092748","text":"It's official, Unitree the 8000x+ retail oversubscribed humanoid company in China.\n\nIs expected to go public in 2 days! So the 19th. \n\nOpening is implied to be around ~$41.66B MC per derivatives, around +363.3% above its ~$9B IPO valuation. \n\nFun times for humanoids this week. https://t.co/yav4oRs2bO","zh":"正式確定了，那家被散戶超額認購 8,000 倍以上的中國人形機器人公司宇樹科技。\n\n預計 2 天後掛牌！也就是 19 號。\n\n根據衍生性商品推算，開盤市值隱含約 416.6 億美元，比其約 90 億美元的 IPO 估值高出約 +363.3%。\n\n這週對人形機器人來說會很有趣。","likes":1222,"views":null,"reposts":67,"q":null},{"id":"2089264987328151637","ts":"2026-08-17T08:16:04.000Z","url":"https://x.com/aleabitoreddit/status/2089264987328151637","text":"Just some more demand imbalance visibility for $SNDK, $SKHY, $MU, Kioxia, and your NAND players. \n\nPhison CEO: \"2027 capacity constraints will be even more severe than in 2026.\"\n\n\"Upstream suppliers need up to 4 years from plant construction and equipment investment to actual production.\n\nWith demand growing explosively and supply expansion limited, the NAND shortage is likely to last for years.\"\n\nDon't quite think I agree with the people claiming it's all over for memory, esp. NAND bottlenecks in 2026...","zh":"再給 $SNDK、$SKHY、$MU、鎧俠等 NAND 業者多一些需求失衡的能見度。\n\n群聯執行長：「2027 年的產能限制將比 2026 年更嚴重。」\n\n「上游供應商從建廠、設備投資到實際量產，最長需要 4 年。\n\n在需求爆炸性成長而供給擴充有限的情況下，NAND 短缺很可能會持續好幾年。」\n\n我不太認同那些說記憶體行情已經結束的人，尤其是 2026 年的 NAND 瓶頸⋯⋯","likes":1559,"views":null,"reposts":105,"q":null},{"id":"2089183484556480536","ts":"2026-08-17T02:52:12.000Z","url":"https://x.com/aleabitoreddit/status/2089183484556480536","text":"I think we're seeing AI server MLCC demand cause an interesting effect... with tightening capacity for consumer/general-purpose MLCCs.\n\nIf you get Vietnam flashbacks like I do to $MU / Samsung / SK Hynix -> Legacy DRAM: \n\nMy thesis is we'll see the same thing here maybe late H2, early 2027 with consumer/broad MLCCs. \n\nFrom July 6th: \n\n\"the crowding-out effect from AI-oriented high-end MLCC production has begun spilling over into both the automotive and consumer markets.\" \n\nJuly 28th: \n\n\"AI Demand Pushes Japanese and Korean MLCC Suppliers to Record Monthly Shipments; Consumer-Grade Order Spillovers Continue to Surge\"\n\nAug 12: \n\nAs [MLCC] capacity shifts from consumer grades to AI-oriented products... (Trendforce)\n\nAug 12: \n\nChina's electronics market channel checks found 22µF and 47µF MLCCs (used more broadly) out of stock. Then found and said certain manufacturers had stopped taking orders. \n\n(for reference: Walsin said high-volume smartphone/PC products such as... 22µF, so it's broader MLCCs)\n\nObviously Samsung Electro-Mechanics/Murata are main beneficiaries of AI server MLCC ramp. \n\nBut companies with large market share of overall MLCCs like Taiyo Yuden (6976, disclosure: I have positions) with less AI server share, would be a major beneficiary of this. \n\nFun part is, we're only in H2 2026, so the next major bottleneck should be fun!","zh":"我認為我們正看到 AI 伺服器用 MLCC 的需求造成一個有意思的效應⋯⋯也就是消費級／泛用型 MLCC 的產能同步吃緊。\n\n如果你跟我一樣會聯想到當年 $MU／三星／SK 海力士轉向、擠壓傳統 DRAM 的情況：\n\n我的論點是，大概在 2026 下半年到 2027 年初，消費級／泛用型 MLCC 會出現同樣的事。\n\n7 月 6 日：\n\n「AI 導向的高階 MLCC 生產所造成的排擠效應，已經開始外溢到車用與消費市場。」\n\n7 月 28 日：\n\n「AI 需求推升日韓 MLCC 供應商月出貨量創新高；消費級訂單外溢持續激增」\n\n8 月 12 日：\n\n隨著 [MLCC] 產能從消費級轉向 AI 導向產品⋯⋯（TrendForce）\n\n8 月 12 日：\n\n中國電子市場的通路查訪發現，22µF 與 47µF（應用較廣泛）的 MLCC 已經缺貨。接著又發現部分製造商已經停止接單。\n\n（作為參考：華新科表示智慧型手機／PC 這類大量出貨的產品用的就是⋯⋯22µF，所以這是屬於較泛用的 MLCC）\n\n很明顯，三星電機／村田是 AI 伺服器 MLCC 放量的主要受惠者。\n\n但像太陽誘電（6976，利益揭露：我有持股）這種整體 MLCC 市佔很大、AI 伺服器佔比較低的公司，會是這件事的重大受惠者。\n\n有趣的是，我們現在才 2026 下半年，所以下一個重大瓶頸應該會很好玩！","likes":1045,"views":null,"reposts":53,"q":null},{"id":"2089165155741622679","ts":"2026-08-17T01:39:22.000Z","url":"https://x.com/aleabitoreddit/status/2089165155741622679","text":"\"Severe InP Shortage Triggers Largest Price Hike Ever\" - $AXTI. \n\nSuppliers have bluntly stated that \"even if you have the money, you still may not be able to get the material\" (lol). \n\n- Industry sources revealed that InP substrate prices began rising in Q4 last year and was the fourth consecutive substrate price hike. \n\n- The latest Q4 hike is expected to be >10%,\n\n- Meanwhile, prices for epitaxial wafers made from those substrates have already been raised two times, and the market is moving toward a 3rd consecutive increase in Q4. (I also wrote a thesis on $IQE, which benefits here too). \n\nArticle states VPEC, Landmark, IET benefits (Taiwan centric reporting). \n\nI did predict this last year... The bottleneck is real, but I do have higher expectations for price hikes that comes next. \n\nGlad it's starting to play out.","zh":"「InP（磷化銦）嚴重短缺觸發史上最大漲價」—— $AXTI。\n\n供應商直白地表示「就算你有錢，也不一定拿得到料」（笑）。\n\n- 產業消息人士透露，InP 基板價格從去年第四季開始上漲，而且這已經是連續第四次基板調漲。\n\n- 最新這次第四季的漲幅預計超過 10%。\n\n- 同時，用這些基板做成的磊晶圓（epitaxial wafer）價格已經漲過兩次，市場正走向第四季的第三次連續調漲。（我也寫過 $IQE 的論點，它在這裡同樣受惠。）\n\n文章提到全新光電（VPEC）、聯亞（Landmark）、英特磊（IET）受惠（台灣視角的報導）。\n\n我去年就預測過這件事⋯⋯瓶頸是真的，而且我對接下來的漲價幅度有更高的期待。\n\n很高興看到它開始兌現。","likes":1446,"views":null,"reposts":114,"q":null},{"id":"2089148883838611460","ts":"2026-08-17T00:34:43.000Z","url":"https://x.com/aleabitoreddit/status/2089148883838611460","text":"Stripe reportedly buys OpenRouter for $7 Billion.\n\nI think their orchestration is easy to replicate and switch from. And there's very little moat.\n\nBut atm, OpenRouter has the userbase, valuable dataset, + momentum. \n\nWhat's your take... Yay or Nay for the payments firm? https://t.co/AqOlKlwCzc","zh":"據報 Stripe 以 70 億美元收購 OpenRouter。\n\n我認為他們的模型調度（orchestration）很容易被複製、也很容易被替換掉，護城河非常淺。\n\n但就目前而言，OpenRouter 握有使用者基礎、有價值的資料集，以及聲勢。\n\n你們怎麼看⋯⋯這對這家支付公司來說是好還是不好？","likes":217,"views":null,"reposts":9,"q":null},{"id":"2089057857652338993","ts":"2026-08-16T18:33:00.000Z","url":"https://x.com/aleabitoreddit/status/2089057857652338993","text":"I think @elonmusk said it best: \n\n“Robots don’t all need to be humanoid. \n\nBut a general-purpose robot intended to replace human labor should fit the world humans already built.\n\nRoger, roger.”\n\nPersonally, I expect $TSLA Optimus form factor to converge to the right image. https://t.co/il7tND3n59","zh":"我覺得 @elonmusk 這句話講得最好：\n\n「機器人不需要全部都是人形。\n\n但一個要用來取代人類勞動力的通用型機器人，就應該要能適應人類已經建好的這個世界。\n\n收到，收到。」\n\n我個人預期 $TSLA 的 Optimus 外型會朝右圖那個方向收斂。","likes":824,"views":null,"reposts":29,"q":"rtmy_123：@aleabitoreddit I can’t understand why robots have to be humanoid as many applications don’t require them to be"},{"id":"2088947694886920409","ts":"2026-08-16T11:15:15.000Z","url":"https://x.com/aleabitoreddit/status/2088947694886920409","text":"I feel like AI investing is simpler than what people expect. \n\nBecause $NVDA + Jensen literally tells everyone what's coming. \n\nBut somehow. Almost every. single. time. Markets dismiss it until it actually happens? \n\nBe Nvidia in 2025:  Buys up EML and laser capacity. \n\nMarkets dismissing it: \"Photonics is a bubble and like quantum! ____ company is a scam with shady management\" \n\n1 year later: $LITE +678%, $AAOI +475.12%, $COHR +260.7%, $AXTI +3,843.9%.\n\n_\n\nNvidia in 2026: \n\nBuys up CW/EML capacity with LTAs. 800V shift. Extraordinary explicit about CPO shift. States Physical AI as the next theme. \n\nMarkets now: \"CW players are meme stocks! 800v, CPO is not coming anytime soon, Humanoids are not profitable!\" \n\nYeah... We'll see what happens in 2027. \n\nI think I'm putting my money on Jensen/Nvidia as the leading indicator.","zh":"我覺得 AI 投資比大家想的還單純。\n\n因為 $NVDA 和黃仁勳根本就是直接告訴所有人接下來會發生什麼。\n\n但不知怎地，幾乎每一次、每一次，市場都要等到事情真的發生了才肯相信？\n\n扮演 2025 年的輝達：買下 EML（電吸收調變雷射）與雷射產能。\n\n市場當時的不屑：「光子是泡沫，跟量子一樣！____ 公司是騙局，管理層很可疑」\n\n一年後：$LITE +678%、$AAOI +475.12%、$COHR +260.7%、$AXTI +3,843.9%。\n\n_\n\n2026 年的輝達：\n\n用長約（LTA）買下 CW／EML 產能。轉向 800V。對 CPO（共封裝光學）的轉換講得異常明確。並表明實體 AI 是下一個主題。\n\n市場現在說：「CW 那些公司是迷因股！800V、CPO 短期內根本不會來，人形機器人又不賺錢！」\n\n是啊⋯⋯我們就看 2027 年會怎樣。\n\n我想我會把錢押在把黃仁勳／輝達當成領先指標這件事上。","likes":5335,"views":null,"reposts":356,"q":null},{"id":"2088850910529323315","ts":"2026-08-16T04:50:40.000Z","url":"https://x.com/aleabitoreddit/status/2088850910529323315","text":"Just some TLDRs of stuff I found interesting: \n\n- $SNDK 80% adjusted gross margins projections through 2030, ~75% operating margins and ~50% adjusted FCF margins from investor day. \n\nLTAs already 2/3rd of 2028 output. Minimum contracted revenue reaches $93B (MC is currently ~$239B)... Hard to be a cyclical stock when your revenue/targets are expected to continue 4Y later into 2030.\n\n- $CRWV signs contracts for 6Y old $NVDA A100 GPUs through 2029. \n\nFor Neoclouds like Nebius/Iren, this is positive, since it's a counterargument for eg. Burry depreciation short thesis\n\n- conventional DRAM gross margins eg. Micron is estimated to reach an unprecedented 95% by 2027, surpassing HBM GMs per UBS\n\nread through for legacy/standard dram players like Nanya/Winbond should go brrrr if projections  are correct. \n\n- Anthropic reportedly achieved 14x+ YoY growth and roughly 2.4x sequential revenue growth q2 to >$11.5B,. estimating growth to $190–200B in 2028r evenue numbers.\n\nYour frontier labs keep growing at stupidly fast paces, it would be worrisome if they didnt. \n\n- $NVDA reportedly in talks to invest $3B in SB Energy (Softbank subsidiary), creates a >$500B compute financing push with Apollo, BlackRock, Blackstone, Brookfield, Goldman, and others. $NVDA Feynman reportedly moves to TSMC A16 + SoIC + custom HBM + CPO in H2 2028\n\nJust more nvidia news every day\n\n- $MSFT Maia 300 discussed $TSM capacity for >300k units in 2027, with expansion to 1m+. Unveils as soon as September. \n\nLikely $MRVL should be more happy from this news. For what's happening right now:\n\n- maybe GUC for Microsoft current ASIC ramp. \n- For the Amazon party, stuff like Alchip (I do own shares), likely is ramping now with $AMZN ASIC program H2 2026...\n\nSo might be a good idea to look at hyperscaler ASIC ramp timelines + their beneficiaries. \n\n- $TSM VP of Advanced Packaging stated \"the industry is likely to face not only memory shortages but also tight ABF substrate supply over the next few years\"... \n\nEmphasis on few years for memory + ABF substrates for bottlenecks. \n\nEven upstream abf substrate equipment providers are happy, eg. Eternal Precision which uses vacuum lamination equipment stated orders surged, their plants have been running at full capacity, and 20%+ price hikes. \n\n- $AMAT expects advanced packaging revenue to grow >70% in 2026, versus prior >50%, and said customer discussions now extend all the way to 2030\n\n(not too familiar with this company, but found their growth rate from 2025 Q4 $6.8B ->$7.01B -> 7.91B -> $9.12B -> $10.25B Q4 2026 projections pretty interesting)\n\n- Google said at OCP APAC said conventional 48V is running out of headroom. $NVDA detailed an 800VDC MGX-compatible rack H2 2026 (timeline, Delta / Lite-On beneficaries)\n\n- Aside from $SNDK, Nanya LTAs cover 50% of capacity. CXMT signed multi-year DRAM agreements last month, so entire memory industry seems to be following same playbook as ur big 3. \n\n- Probe cards remain a bottleneck, MPI(6223) said their probe card capacity remains fully utilized because demand exceeds supply. \n\nAlready covered the CW laser bottleneck with $AAOI, $SIVE, and $LITE earlier this week, but that's another fun one.\n\n- some MLCC/component lead times have hit 36 weeks per Nichidenbo.\n\nYour Samsung Electro-Mechanics, Taiyo Yuden, Murata, players should be very happy to hear this. \n\nTLDR: AI supply chains go brrr.","zh":"一些我覺得有意思的東西整理：\n\n- $SNDK 投資人日給出的預估：2030 年前調整後毛利率 80%、營益率約 75%、調整後自由現金流利潤率約 50%。\n\n長約（LTA）已經涵蓋 2028 年產出的三分之二。最低合約營收達 930 億美元（目前市值約 2,390 億美元）⋯⋯當你的營收／目標預計在 4 年後的 2030 年都還在延續時，實在很難說它是景氣循環股。\n\n- $CRWV 簽下機齡 6 年的 $NVDA A100 GPU 合約，效期至 2029 年。\n\n對 Nebius／Iren 這類 neocloud（新型雲端算力商）而言是正面的，因為這反駁了像 Burry 那套折舊放空論點。\n\n- 據 UBS 估計，傳統 DRAM 的毛利率（例如美光）到 2027 年將達到前所未見的 95%，超越 HBM 的毛利率。\n\n如果預估正確，對南亞科、華邦電這類標準型 DRAM 業者是爽爆的讀數。\n\n- 據報 Anthropic 達成年增 14 倍以上的成長，第二季營收季增約 2.4 倍至超過 115 億美元，並預估 2028 年營收將成長到 1,900-2,000 億美元。\n\n這些前沿實驗室成長速度快得離譜，如果沒有這種成長反而才要擔心。\n\n- $NVDA 據報正洽談投資 SB Energy（軟銀子公司）30 億美元，與 Apollo、貝萊德、黑石、Brookfield、高盛等一同促成逾 5,000 億美元的算力融資。$NVDA 的 Feynman 據報將在 2028 下半年轉向台積電 A16 + SoIC + 客製化 HBM + CPO（共封裝光學）。\n\n每天都有更多輝達的新聞。\n\n- $MSFT 的 Maia 300 與 $TSM 討論 2027 年逾 30 萬顆的產能，並可能擴充到百萬顆以上，最快 9 月發表。\n\n$MRVL 應該會因這則消息更開心。至於現在正在發生的事：\n\n- 微軟目前的 ASIC 放量可能是創意電子（GUC）。\n- 亞馬遜這邊，像世芯電子（Alchip，我有持股）很可能正隨著 $AMZN 的 ASIC 專案在 2026 下半年放量⋯⋯\n\n所以去看看超大規模業者的 ASIC 放量時程與受惠者，應該是個好主意。\n\n- $TSM 先進封裝副總表示「未來幾年，產業面臨的可能不只是記憶體短缺，還有 ABF 載板供應吃緊」⋯⋯\n\n重點在「未來幾年」——記憶體加上 ABF 載板都是瓶頸。\n\n連上游的 ABF 載板設備供應商也很開心，例如使用真空壓合設備的均華（Eternal Precision）表示訂單激增、廠房滿載運轉，並調漲價格 20% 以上。\n\n- $AMAT 預期 2026 年先進封裝營收成長超過 70%（先前預估為逾 50%），並表示與客戶的討論已延伸到 2030 年。\n\n（我對這家公司不太熟，但覺得他們從 2025 年第四季 68 億 → 70.1 億 → 79.1 億 → 91.2 億 → 2026 年第四季預估 102.5 億美元的成長率滿有意思的）\n\n- Google 在 OCP APAC 表示傳統 48V 已經逼近極限。$NVDA 則詳述了 2026 下半年推出的 800VDC MGX 相容機櫃（時程參考，台達電／光寶為受惠者）。\n\n- 除了 $SNDK 之外，南亞科的長約也涵蓋 50% 產能。長鑫存儲上個月簽了多年期 DRAM 協議，所以整個記憶體產業看起來都在跟隨三巨頭的同一套劇本。\n\n- 探針卡仍是瓶頸，旺矽（6223）表示其探針卡產能維持滿載，因為需求超過供給。\n\n本週稍早已經寫過 $AAOI、$SIVE、$LITE 的 CW（連續波）雷射瓶頸，那也是另一個有趣的例子。\n\n- 據 Nichidenbo，部分 MLCC／被動元件的交期已經拉到 36 週。\n\n三星電機、太陽誘電、村田這些業者聽到應該會非常開心。\n\n總結：AI 供應鏈爽爆。","likes":1423,"views":null,"reposts":99,"q":null},{"id":"2088501133543407959","ts":"2026-08-15T05:40:47.000Z","url":"https://x.com/aleabitoreddit/status/2088501133543407959","text":"说我归零的传闻未免也太夸张了吧 哈哈\n\n经历了7月份AI板块的崩盘后，我的YTD收益依然还有 +2,411.84% https://t.co/m49XcPRgC3","zh":"說我歸零的傳聞未免也太誇張了吧，哈哈。\n\n經歷了 7 月份 AI 板塊的崩盤之後，我今年至今的報酬率仍然有 +2,411.84%。\n\n（原文為簡體中文，此處轉為繁體）","likes":5729,"views":null,"reposts":137,"q":"DRbitcoin36：上个月的股神名单，如今只剩一人存活 https://t.co/ckIiugE2h9"},{"id":"2088457278928412812","ts":"2026-08-15T02:46:31.000Z","url":"https://x.com/aleabitoreddit/status/2088457278928412812","text":"US Government urges $AAPL not to buy Chinese memory chips. \n\n$MU, $SKHY, and Samsung are happy to hear this...\n\nHilariously enough, CXMT/YMTC is price hiking too, so it's not exactly \"cheap Chinese memory that floods the market\". \n\nApple once upon a time actually had extreme https://t.co/9PbgjngIjS","zh":"美國政府力勸 $AAPL 不要採購中國的記憶體晶片。\n\n$MU、$SKHY 和三星聽到這消息應該很開心⋯⋯\n\n好笑的是，長鑫存儲（CXMT）／長江存儲（YMTC）也在漲價，所以根本不是什麼「大舉洪水式供應市場的廉價中國記憶體」。\n\n蘋果以前其實有過極端的⋯⋯","likes":2165,"views":null,"reposts":176,"q":null},{"id":"2088226398708338889","ts":"2026-08-14T11:29:05.000Z","url":"https://x.com/aleabitoreddit/status/2088226398708338889","text":"The $SHKY, Samsung, $SNDK, $MU memory bottleneck never changed anon https://t.co/6Xyih3pM9D","zh":"$SHKY、三星、$SNDK、$MU 的記憶體瓶頸從來就沒變過，各位。","likes":2275,"views":null,"reposts":144,"q":"aleabitoreddit：Yes, I'm still bullish on memory like $MU / Samsung.\n\nAs I said earlier, markets tend to rotate from bottleneck to bottleneck.\n\nThis week it looks $AXTI to $LITE in the photonics sector is the focus again. \n\nThe thing is... the primary thing that changed are the stock prices, htt"},{"id":"2088181416148562017","ts":"2026-08-14T08:30:20.000Z","url":"https://x.com/aleabitoreddit/status/2088181416148562017","text":"Donald Trump signs a proclamation to strengthen US supply chains for drones.\n\nBenefiting U.S. drone component suppliers like $UMAC to UAS manufacturers like $ONDS + $RCAT. \n\n TLDR, 100% tariffs on:\n- UAS docking stations + certain critical components\n- certain parts for &gt;25 kg https://t.co/ZwHZtTp1Tq","zh":"川普簽署公告，強化美國無人機供應鏈。\n\n對 $UMAC 這類美系無人機零組件供應商，以及 $ONDS、$RCAT 這類 UAS（無人機系統）製造商是利多。\n\n重點整理，以下項目課 100% 關稅：\n- 無人機接駁站與部分關鍵零組件\n- 25 公斤以上機種的特定零件","likes":1358,"views":null,"reposts":124,"q":null},{"id":"2088115008827715971","ts":"2026-08-14T04:06:28.000Z","url":"https://x.com/aleabitoreddit/status/2088115008827715971","text":"Feels like glass substrate timelines got pushed back at least another quarter.\n\n- \"Samsung Electro-Mechanics Delays Semiconductor Glass Substrate Investment\" due to a bottleneck in customer reliability evaluations of prototypes.\n\nAt its recent second-quarter earnings https://t.co/ojtEeSc0Gb","zh":"感覺玻璃基板的時程至少又被往後推了一季。\n\n-「三星電機延後半導體玻璃基板投資」，原因是客戶對原型的可靠度驗證出現瓶頸。\n\n消息來自他們近期的第二季財報。","likes":702,"views":null,"reposts":40,"q":null},{"id":"2087867722784805170","ts":"2026-08-13T11:43:50.000Z","url":"https://x.com/aleabitoreddit/status/2087867722784805170","text":"In IPO news… Vantage Data Centers is exploring going public at an enormous $100B valuation. \n\nIf you’re not familiar, $ORCL is their anchor tenant for Stargate (OpenAI end user), and Vantage develops/operates hyperscaler DCs.\n\nAnthropic IPO is also expected, with investors expecting $2T valuation, eclipsing $SPCX per FT.\n\nYeah… idk about Anthropic valuations. Jim Cramer defending that valuation is never a good sign. \n\nOn a side note, Opus 5 is probably the worst consumer LLM I’ve used to date, it’s like a 5 IQ LLM operating off terrible data retrieval. With a Fable-like God complex on top.\n\nEnterprise is probably having a better time though. \n\nUnitree IPO is also expected this month and priced it at a $9B valuation. Which is a positive tailwind for Unitree for the humanoid sectors. \n\nNot really an AI name but SHEIN is going public as soon as the 19th this month.\n\nGo ask any girl you know and they’re probably familiar with this platform.","zh":"IPO 消息⋯⋯Vantage Data Centers 正評估以驚人的 1,000 億美元估值公開上市。\n\n如果你不熟的話，$ORCL 是他們 Stargate 專案（終端使用者是 OpenAI）的主要承租戶，而 Vantage 負責開發與營運超大規模業者的資料中心。\n\nAnthropic 的 IPO 也在預期之中，據金融時報報導，投資人期待的估值達 2 兆美元，將超越 $SPCX。\n\n嗯⋯⋯Anthropic 的估值我是不太確定。Jim Cramer 出來替那個估值辯護從來都不是好兆頭。\n\n順帶一提，Opus 5 大概是我用過最糟的消費級大型語言模型，像是一個以糟糕的資料檢索為基礎、智商只有 5 的 LLM，上面還疊了一個 Fable 式的神格情結。\n\n不過企業端的體驗大概好一些。\n\n宇樹的 IPO 預計也在本月，定價為 90 億美元估值。這對人形機器人板塊的宇樹是正面的順風。\n\n雖然不算 AI 股，但 SHEIN 最快本月 19 日就會上市。\n\n去問你認識的任何一個女生，她們大概都對這個平台不陌生。","likes":357,"views":95980,"reposts":19,"q":null},{"id":"2087846074027295020","ts":"2026-08-13T10:17:49.000Z","url":"https://x.com/aleabitoreddit/status/2087846074027295020","text":"Okay here's my take on $POET, since apparently people are celebrating on the subreddit that I took small positions. \n\n- I have 0 idea. ZERO. How they convinced shareholders to allow them dilute SO MUCH to the point:\n\nThey have an absurd ~$830m cash on hand now. \n\nAnd my guess is that they're close to done, since I would be in disbelief if they needed more. \n\nSo now... they have ~$830m to grow their business like M&A, and EV actually dropped really low recently (eg. $1.25B MC vs. $830m cash on hand), that I thought it was compelling to take a risk. \n\n- Annualized production capacity target is 12M optical engines/year for 2027, which is pretty absurd ramp. \n\nNeed to do more research into ASP for Poet's products, but maybe $125-$200? So at ~$150 ASP, $1.8B revenue ceiling. \n\nBut they're like inverse AAOI right now: no visible demand to fill all that capacity. Aside from Lumilens, which is now a highly valued hyperscaler supplier (probably Amazon or Microsoft), with billions in customer agreements. \n\nThe interesting thing is if Poet signed prepayment EML agreements with players like Mitsubishi, or CW agreements with Sivers behind the scenes with that balance sheet. \n\nAnd given the current bottleneck, players might use Poet as a workaround for supply procurement. \n\nBut basically, you have a super cash-rich company with a ton of capacity coming online. And they're not really disappearing anytime soon with their financials. \n\nI don't quite think it's as technically defensible compared to upstream laser chokepoints with something like $SIVE around the same valuation in terms of technical moat for CW lasers vs. OE packaging side. As you've seen recently with Celestial and Poet. \n\nBut maybe... there's a chance some hyperscaler or downstream company announces a volume agreement sometime in the future. and $POET takes off. And they do have the supply chain setup for ramp with that.  \n\nThat's the risk I ended up taking, but it's not exactly a clear as day long for me like $AAOI.","zh":"好，既然大家在 subreddit 上因為我建立了小部位而在慶祝，那我就講一下我對 $POET 的看法。\n\n- 我完全、ZERO、一點頭緒都沒有，他們是怎麼說服股東同意稀釋到這種程度：\n\n他們現在手上有誇張的約 8.3 億美元現金。\n\n而我猜他們差不多該停了，因為如果他們還需要更多，我會不敢相信。\n\n所以現在⋯⋯他們有約 8.3 億美元可以用來成長業務（例如併購），而企業價值最近掉得非常低（例如市值 12.5 億美元 vs 手上 8.3 億現金），我覺得這個風險值得一冒。\n\n- 年化產能目標是 2027 年每年 1,200 萬套光引擎，這個爬坡幅度相當誇張。\n\n我還得再研究 Poet 產品的售價，也許是 125-200 美元？以約 150 美元的售價算，營收天花板約 18 億美元。\n\n但他們現在像是反過來的 AAOI：看不到足夠的需求能填滿那些產能。除了 Lumilens 之外——那是一家目前估值很高的超大規模業者供應商（大概是 Amazon 或 Microsoft），手上有數十億美元的客戶協議。\n\n有意思的是，Poet 會不會用那張資產負債表，在檯面下跟三菱這類玩家簽了 EML（電吸收調變雷射）預付協議、或跟 Sivers 簽了 CW（連續波）協議。\n\n而且以目前的瓶頸狀況，其他玩家可能會把 Poet 當成採購供應的變通管道。\n\n所以基本上，這是一家現金極為充裕、且有大量產能即將上線的公司。以他們的財務狀況來看，短期內也不會消失。\n\n就技術護城河而言，我不太認為它比得上像 $SIVE 這種估值相近的上游雷射咽喉點——CW 雷射 vs 光引擎封裝這兩者的防禦力差很多。你從最近 Celestial 和 Poet 的狀況也看得出來。\n\n但也許⋯⋯未來某個時間點會有超大規模業者或下游公司宣布量產協議，然後 $POET 就起飛了。而他們確實已經把供應鏈準備好了。\n\n這就是我最後承擔的風險，但它對我來說不像 $AAOI 那樣是清楚明白的多頭部位。","likes":408,"views":173455,"reposts":15,"q":"liulu1537335：@aleabitoreddit 女神，poet的股价价值兑现是在确定新设备进厂后才开始的吗"},{"id":"2087838176677376186","ts":"2026-08-13T09:46:26.000Z","url":"https://x.com/aleabitoreddit/status/2087838176677376186","text":"Feels like my $IQE thesis Feb this year got validated alongside $AXTI and others. (I still long on both)  \n\nSo I stopped covering them as much. But TLDR on  updates:\n\nEarly this year, IQE was a distressed but critical chokepoint in the optical supply chain with links to $LITE and others when I published my thesis on it.\n\nSince then:\n\n- $MTSI signed long term epiwafer supply agreements, took a stake in the company, now IQE is bank debt free (Macom has convertibles, but that's positive)\n- $TSEM signed agreements for InP epiwafers. \n- Management explicitly said its IQE agreement was signed to secure the \"strategic III-V epiwafer supply required for that roadmap\"\n- IQE signed another ~$14M mysterious AI DC contract. \n\nThe only part that's still playing out with my earlier thesis is IQE converting their latent/underutilized capacity toward AI DC segment, to match peers like Landmark in the space (which takes time, like slightly over a year if I remember correctly). \n\nThere's some national security implications that I'll avoid talking about that makes them more important.\n\nBut basically:\nFY2025 revenue: £97.3m\nFY2026 guidance: over £126.5m\n\nThey're rapidly growing again in the optical sector, out of bank debt/distressed liquidation state, and remains a critical chokepoint in Western optical supply chains. \n\nNow... with new agreements with your leading photonics companies for revenue growth, and players like Macom serving as a soft backstop.  \n\nAfter a thesis gets validated, typically I just sit back and enjoy growth of a business.","zh":"感覺我今年 2 月的 $IQE 論點，跟 $AXTI 等標的一起被驗證了。（兩檔我都還持有）\n\n所以我後來就沒那麼常寫它們。以下是更新重點：\n\n今年初我發表論點時，IQE 是一個處於財務困境、但在光學供應鏈中至關重要的咽喉點，並與 $LITE 等公司有連結。\n\n從那之後：\n\n- $MTSI 簽下長期磊晶圓供應協議，並入股該公司，現在 IQE 已無銀行負債（Macom 持有可轉債，但那是正面的）\n- $TSEM 簽下 InP（磷化銦）磊晶圓協議。\n- 管理層明確表示，與 IQE 簽約是為了確保「該路線圖所需的三五族磊晶圓策略供應」\n- IQE 又簽下另一筆約 1,400 萬美元、來源成謎的 AI 資料中心合約。\n\n我先前論點中唯一還在發展的部分，是 IQE 把閒置／未充分利用的產能轉向 AI 資料中心領域，以追上 Landmark 這類同業（這需要時間，如果我沒記錯大概要一年多一點）。\n\n還有一些國家安全層面的意涵讓他們更重要，這部分我就避免談了。\n\n但基本上：\n2025 財年營收：9,730 萬英鎊\n2026 財年財測：超過 1.265 億英鎊\n\n他們正在光通訊領域快速重返成長，脫離了銀行負債／瀕臨清算的狀態，而且依然是西方光學供應鏈的關鍵咽喉點。\n\n現在⋯⋯還跟頂尖的光子公司簽了帶來營收成長的新協議，同時有 Macom 這類玩家充當軟性後盾。\n\n論點被驗證之後，通常我就是坐下來享受這門生意的成長。","likes":331,"views":145327,"reposts":18,"q":"Lee_Trades：@aleabitoreddit Any update on IQE? They have released a lot of good news recently would be good to hear your thoughts."},{"id":"2087807614172488131","ts":"2026-08-13T07:44:59.000Z","url":"https://x.com/aleabitoreddit/status/2087807614172488131","text":"$SIVE announces a $3.4M development program with SemiNex!\n\nFor CPO, DFB laser arrays, and optical amplifiers. \n\nEarly production is targeted H2 2027 (in line with early scale up CPO timelines)\n\nSeemed weird to me at first given product overlap, since SemiNex is a much smaller Series B company... \n\nBut then I got reminded of a less explicit version of $SPCX + Cursor relationship (derisking by working together first). \n\nThere's probably something interesting Sivers found in this company.","zh":"$SIVE 宣布與 SemiNex 展開一項 340 萬美元的開發計畫！\n\n內容涵蓋 CPO（共封裝光學）、DFB 雷射陣列與光放大器。\n\n初期量產目標訂在 2027 年下半年（與 CPO 早期放量的時程一致）。\n\n一開始我覺得有點怪，因為產品線有重疊，而且 SemiNex 是一家規模小得多的 B 輪公司⋯⋯\n\n但後來我想起這有點像是比較不明說的 $SPCX 與 Cursor 那種關係（先合作來降低風險）。\n\nSivers 大概是在這家公司身上看到了什麼有意思的東西。","likes":875,"views":149018,"reposts":46,"q":null},{"id":"2087733927930929435","ts":"2026-08-13T02:52:11.000Z","url":"https://x.com/aleabitoreddit/status/2087733927930929435","text":"Is it just me, or is the list of 3 letter optical jargon never ending?\n\nWe have LPO, LRO, NPO, XPO, CPO, OBO, and others for approaches.\n\nThen InP, EML, ELS, OCS, SOI, and others to add to the random terms.\n\nEven the industry events with OCP or OFC get their three letter names.\n\nPeople who have followed me on my optical bottleneck scavenger hunt with $SOI or $IQE might know a lot by now.\n\nBut wouldn’t new followers might be super confused…","zh":"是只有我這樣覺得，還是光通訊的三字母術語真的沒完沒了？\n\n光是架構方案就有 LPO、LRO、NPO、XPO、CPO、OBO 等等。\n\n然後還有 InP（磷化銦）、EML（電吸收調變雷射）、ELS（外部光源）、OCS、SOI 這些零散名詞可以再加進來。\n\n連 OCP、OFC 這些產業活動都要取三個字母的名字。\n\n一路跟著我在 $SOI、$IQE 這場光學瓶頸尋寶之旅的人，現在應該已經懂很多了。\n\n但新來的追蹤者大概會超級困惑吧⋯⋯","likes":644,"views":193000,"reposts":16,"q":null},{"id":"2087675367595380783","ts":"2026-08-12T22:59:29.000Z","url":"https://x.com/aleabitoreddit/status/2087675367595380783","text":"My main takeaway was that your merchant CW laser suppliers seem to be EXTREMELY IMPORTANT now. \n\nBut TLDR of $COHR earnings:\n\n\"given the demand that we see in our DC business with transceivers, I don’t see any time in the near future where we would be selling indium phosphide lasers externally\"\n\n- Ton more value placed on companies that sell InP lasers externally if $AAOI can't doesn't enough capacity for first gen-CPO deployments, $COHR not selling externally...  \n\nI guess that's why $MTSI said a ton of customers are approaching them with urgency for InP CW DFB lasers (and they dont even have meaningful capacity coming online until EOY 2027)\n\n$AAOI -> Internal\n$COHR -> Internal\nBuyers -> fewer places to look for capacity. \n\n \"Our backlog now extends out, fiscal 2027 is basically completely booked out. We are booked really through the end of calendar 2027\" [ Massive massive demand visibility]\n\n- Coherent also mentioned LTAs spanning end of decade. So this kinda reinforces what $POET CEO said at their AGM that the \"big 3\" are fully sold out next 2 years.\n\n\"we’re not constrained in the assembly and test capacity right now. We’re really just constrained by the ramp of the indium phosphide production\"\n\n- Just for the bottleneck bros in terms of assembly/test not a bottleneck. \n\n\"absolutely no push-out of CPO demand. In fact, it has been the opposite. We have seen demand increase and request from customers’ demand getting pulled in\"\n\n\"we continue to expect revenue from CPO for scale-up applications to start to flow in the second half of calendar 2027\" \n\n- Big read through on other CPO players for scale up if $LITE, $COHR reaffirm revenue from CPO scale up coming h2027. \n\n- \"quarterly revenue exceeding $3 billion by the end of fiscal 2027\" \n\n- $COHR revenue go brrr\n\nSo for regular numbers it's:\n\n- $2.046B revenue (+13.3% Q/Q, +33.8% Y/Y), main revenue ramp looks to be happening entering Q4 into 2027\n- Non-GAAP gross margins: 40.2%\n\nNext quarter guide is:\n- Revenue: $2.2–$2.4B revenue\n- Non-GAAP gross margins: 39.5-41.5%\n\nBasically:\n$1.69B -> $1.81B -> $2.05B -> ~$2.30B -> $3.0B (end of FY 2027) \n~39% -> 39.6% -> 40.2% -> ~40.5% (gross margins)\n\nFor operating margins:\n18.0% -> 19.5% -> 19.9% -> 20.3% -> 21.8%\n\nLittle less impressed compared to $LITE margin growth in terms of profitability, but revenue scale for $COHR growing rapidly.","zh":"我最主要的心得是：對外銷售的商用 CW（連續波）雷射供應商，現在看起來「極度重要」。\n\n以下是 $COHR 財報的重點整理：\n\n「考量到我們資料中心收發模組業務所看到的需求，我看不出在可預見的未來，我們會有任何時候對外銷售磷化銦雷射」\n\n- 如果 $AAOI 沒有足夠產能參與第一代 CPO（共封裝光學）部署，而 $COHR 又不對外銷售⋯⋯那麼願意對外賣 InP（磷化銦）雷射的公司，價值就大幅提高了。\n\n我想這也是為什麼 $MTSI 會說一堆客戶帶著急迫性來找他們要 InP CW DFB 雷射（而他們有意義的產能甚至要到 2027 年底才會上線）\n\n$AAOI → 內部自用\n$COHR → 內部自用\n買方 → 能找到產能的地方更少了。\n\n「我們的在手訂單現在延伸得更遠，2027 財年基本上已經完全被訂滿。我們實際上已經訂到 2027 曆年結束」〔需求能見度極高極高〕\n\n- Coherent 也提到有長約延伸到這個十年的尾端。這某種程度上印證了 $POET 執行長在股東會上說的「三巨頭」未來兩年完全售罄。\n\n「我們目前在封裝與測試產能上並沒有受限。我們真正受限的是磷化銦產量的爬坡」\n\n- 給瓶頸派的兄弟們參考：封裝／測試並不是瓶頸。\n\n「絕對沒有任何 CPO 需求的遞延。事實上恰恰相反。我們看到需求增加，客戶還要求提前交貨」\n\n「我們持續預期 CPO 縱向擴展應用的營收，將從 2027 曆年下半年開始入帳」\n\n- 如果 $LITE、$COHR 都再次確認 CPO 縱向擴展的營收會在 2027 下半年到來，這對其他 CPO 業者是很重要的讀數。\n\n-「2027 財年結束前季營收將超過 30 億美元」\n\n- $COHR 營收爽爆\n\n至於一般的數字：\n\n- 營收 20.46 億美元（季增 13.3%、年增 33.8%），主要的營收爬坡看起來會發生在進入第四季到 2027 年\n- 非 GAAP 毛利率：40.2%\n\n下一季財測：\n- 營收：22-24 億美元\n- 非 GAAP 毛利率：39.5-41.5%\n\n基本上是：\n16.9 億 → 18.1 億 → 20.5 億 → 約 23.0 億 → 30 億美元（2027 財年結束）\n約 39% → 39.6% → 40.2% → 約 40.5%（毛利率）\n\n營益率則是：\n18.0% → 19.5% → 19.9% → 20.3% → 21.8%\n\n就獲利能力而言，比起 $LITE 的利潤率成長稍微沒那麼令人驚豔，但 $COHR 的營收規模正在快速成長。","likes":482,"views":151997,"reposts":33,"q":"LightLogix：@aleabitoreddit @mikealfred Did you take a look at COHR earnings by chance?"},{"id":"2087515371750490383","ts":"2026-08-12T12:23:43.000Z","url":"https://x.com/aleabitoreddit/status/2087515371750490383","text":"$NBIS outlook is pretty insane yet again.\n\n$582.3M revenue (+454% Y/Y, +46% Q/Q) off ~50% adjusted EBITDA margin (AI Cloud). $8.04B cash on hand. \n\nReiterates financial guide (2026 revenue: $3.0–$3.4B\n2026 EoY ARR: $7–$9B), I was hoping for a raise, but it's already massive growth. \n\nNot really about this quarter financials, but these signals:\n\n- \"We could sell our entire 2027 capacity on these terms today.\" massive visibility on demand\n- \"4 customer agreements averaging over $1B+ each in contract value\"\n- Around 70% of Q2 deals included customer prepayments\n- Contracted power guidance was raised again, from more ~4+ GW to 5 GW. (this used to be a concern vs. $IREN debate, but Nebius power guidance keeps going through the roof). \n- Expects $9B+ of prepayments in 2026 and says it has $40B+ of commitments.\n- annual contract value per MW keeps going brrr (>$40M/mw for Q3 short term capacity deals)  \n\nSame bear story will always be there (eg. large $5.66B of capex with current GAAP net loss), but demand is extreme with massive visibility, with increasing AI Cloud adjusted EBITDA margins ( 24% -> 45% -> 50% progression)\n\nWe kinda got this read through from all your hyperscaler cloud earnings and $CRWV backlog yesterday, but glad it's showing up in Weebius's earnings.","zh":"$NBIS 的展望又一次誇張到不行。\n\n營收 5.823 億美元（年增 454%、季增 46%），AI 雲端的調整後 EBITDA 利潤率約 50%。手上現金 80.4 億美元。\n\n重申財務財測（2026 年營收：30-34 億美元；2026 年底 ARR（年化經常性收入）：70-90 億美元），我本來還期待會上修，不過這已經是很誇張的成長了。\n\n重點其實不在這一季的財務數字，而在這些訊號：\n\n-「我們今天就能用同樣的條件把 2027 年的全部產能賣光。」需求能見度極高\n-「4 份客戶協議，平均每份合約價值超過 10 億美元」\n- 第二季約 70% 的交易包含客戶預付款\n- 簽約電力指引再度上調，從約 4GW 以上提高到 5GW。（這點過去在與 $IREN 的辯論中曾是疑慮，但 Nebius 的電力指引不斷往上衝。）\n- 預期 2026 年預付款將超過 90 億美元，並表示手上有超過 400 億美元的承諾額。\n- 每 MW 的年度合約價值持續爽爆（第三季短期產能交易已超過每 MW 4,000 萬美元）\n\n同樣那套空方說法永遠都會在（例如 56.6 億美元的龐大資本支出、目前 GAAP 仍為淨虧損），但需求極為強勁且能見度極高，AI 雲端的調整後 EBITDA 利潤率還一路上升（24% → 45% → 50%）。\n\n其實從所有超大規模業者的雲端財報，以及昨天 $CRWV 的在手訂單，我們就已經看到這個讀數了，但很高興它也出現在 Weebius（Nebius）的財報上。","likes":2198,"views":277378,"reposts":173,"q":null},{"id":"2087505570941239683","ts":"2026-08-12T11:44:46.000Z","url":"https://x.com/aleabitoreddit/status/2087505570941239683","text":"$AEHR receives another $22M follow on order for AI processor wafer level burn in systems.\n\nBy their lead AI processor company.\n\nIt’s cool to see this tiny company grow up so fast across so many verticals (memory, silicon photonics, etc).\n\nUp +5.39% premarket off the news. https://t.co/YkOtELzkmo","zh":"$AEHR 又收到一筆 2,200 萬美元的追加訂單，用於 AI 處理器的晶圓級預燒系統。\n\n來自他們的主要 AI 處理器客戶。\n\n看著這家小公司在這麼多垂直領域（記憶體、矽光子等）快速長大，感覺很棒。\n\n盤前因這則消息上漲 5.39%。","likes":677,"views":233032,"reposts":35,"q":"aleabitoreddit：$AEHR looks extremely promising at ~$1.1B MC. \n\nAehr is starting to remind me of an early $TER, mixed with pre-earnings $AAOI.  \n\nIf we look at the timeline and speculated customers:\n\nFeb 11th: Sonoma production win for Hyperscaler's AI ASIC processors. (likely $GOOGL, $AMZN, $ME"},{"id":"2087447527595692180","ts":"2026-08-12T07:54:08.000Z","url":"https://x.com/aleabitoreddit/status/2087447527595692180","text":"So this is just what I'm seeing with $SIVE and the CW DFB laser chokepoint right now. \n\nFrom optical earnings: \n\n1. $LITE: unexpected demand and imbalance for UHP CW lasers. \n\n- Had ability to price up ASP for lasers. \n- Scale up CPO on track for H2 2027 shipments, called out any CPO scale up delay rumors as noise. \n\nLumentum confirmed timelines (that CPO players like Sivers sold off of misleading reports from), high margins, and extreme demand for qualified CW lasers. \n\n2. $AAOI: doesn’t have enough CW laser capacity because of too much optical transceiver demand.\n\n-  Not meaningfully participating in first-gen CPO deployments, with $MTSI not looking like they're in it either but focusing on NPO. Haven't seen much with $SMTC after their HieFo acqusition. \n- Called lasers as the bottleneck within a 20-40% demand imbalance for transceivers. \n- Says customers approaching them every week asking them for supply + to move faster.\n\nAOI confirmed demand imbalances  + bottlenecks for lasers. And we got an even smaller pool for first-gen CPO players. \n\n3. Both $AAOI and $LITE claimed Chinese players were years behind for CPO lasers and far behind stated claims in qualified capacity. \n\n- $AAOI said 2-3 years+ behind with CPO lasers. \n- $LITE said they haven't seen anything like Chinese claims in terms of outputs (and no recourse if it's false). \n\nReaffirms moat for CPO related lasers, and no flooding from some shortseller claims on the optical sector.  \n\n4. $MTSI said that many customers are approaching them with urgency due to the general supply shortage of indium phosphide DFB lasers. \n\nAgain, puts Sivers in the that bottleneck, giving them likely more customer demand .\n\nAmong $COHR ($72.54B), $LITE ($66.57B), $AVGO ($2.13T): \n\nIt's very special you get one of the public 4 Western CPO leaders at a ~$1.5B MC with $SIVE.  \n\nFeels like my thesis with both:\n\n- The CW bottleneck that I predicted\n- CW laser chokepoint (where there's only a few CPO players, at least for gen-1)\n\nGot validated from earnings, now it's just waiting for the inflection points of next optical architecture shifts.","zh":"這就是我目前看到的 $SIVE 與 CW DFB 雷射咽喉點的狀況。\n\n從光通訊財報來看：\n\n1. $LITE：UHP（超高功率）CW 雷射出現預期外的需求與失衡。\n\n- 具備調漲雷射售價的能力。\n- CPO 縱向擴展照計畫在 2027 下半年出貨，並把任何 CPO 縱向擴展延遲的傳聞斥為雜訊。\n\nLumentum 確認了時程（Sivers 這類 CPO 業者當初就是因為誤導性報導而被殺）、高利潤率，以及對通過認證的 CW 雷射的極端需求。\n\n2. $AAOI：因為光收發模組需求太大，導致 CW 雷射產能不足。\n\n- 未實質參與第一代 CPO 部署，而 $MTSI 看起來也沒有參與，他們聚焦在 NPO。$SMTC 在併購 HieFo 之後也沒看到什麼動靜。\n- 指出雷射是瓶頸，收發模組存在 20-40% 的需求失衡。\n- 表示客戶每週都來找他們要求供貨、要求加快速度。\n\nAOI 確認了雷射的需求失衡與瓶頸。而且第一代 CPO 的玩家池子變得更小了。\n\n3. $AAOI 和 $LITE 都表示中國業者在 CPO 雷射上落後數年，而且在通過認證的產能上遠遠落後於他們自己宣稱的數字。\n\n- $AAOI 說在 CPO 雷射上落後 2-3 年以上。\n- $LITE 說他們在產出上完全沒看到中國業者宣稱的那種東西（而且如果是假的也不必負責）。\n\n這再次確認了 CPO 相關雷射的護城河，也代表不會出現某些放空者所說的光通訊板塊供給洪水。\n\n4. $MTSI 表示，由於磷化銦 DFB 雷射普遍短缺，很多客戶帶著急迫性找上他們。\n\n這再次把 Sivers 放進那個瓶頸位置，很可能為他們帶來更多客戶需求。\n\n在 $COHR（725.4 億美元）、$LITE（665.7 億美元）、$AVGO（2.13 兆美元）之中：\n\n能用約 15 億美元的市值買到四家公開上市的西方 CPO 領導者之一，也就是 $SIVE，這件事非常特別。\n\n感覺我這兩個論點：\n\n- 我預測的 CW 瓶頸\n- CW 雷射咽喉點（至少在第一代，只有少數幾家 CPO 玩家）\n\n都已經被財報驗證了，現在只要等下一波光學架構轉換的轉折點到來。","likes":245,"views":34890,"reposts":17,"q":null},{"id":"2087424400811507963","ts":"2026-08-12T06:22:14.000Z","url":"https://x.com/aleabitoreddit/status/2087424400811507963","text":"What a legend, Situational Awareness bought 1/6th of the entire company of Taiyo Yuden.\n\nPretty wild to see this unfolding. https://t.co/nBQW5DOZ5f","zh":"真是個傳奇，Situational Awareness 買下了太陽誘電整整六分之一的公司。\n\n看著這件事發生實在很瘋狂。","likes":335,"views":120382,"reposts":12,"q":"aleabitoreddit：It was reported today that Leopold’s Situational Awareness acquired 11.62% of Taiyo Yuden (6976).\n\nUp from 5.99% as of July 16th. \n\nI do agree with his position (if he still has it) in terms of how valuable this MLCC manufacturer is to global AI supply chains. https://t.co/fAQNpA"},{"id":"2087397768314999183","ts":"2026-08-12T04:36:24.000Z","url":"https://x.com/aleabitoreddit/status/2087397768314999183","text":"It was reported today that Leopold’s Situational Awareness acquired 11.62% of Taiyo Yuden (6976).\n\nUp from 5.99% as of July 16th. \n\nI do agree with his position (if he still has it) in terms of how valuable this MLCC manufacturer is to global AI supply chains. https://t.co/fAQNpAFfhU","zh":"今天有報導指出，Leopold 的 Situational Awareness 已取得太陽誘電（6976）11.62% 的股份。\n\n高於 7 月 16 日的 5.99%。\n\n就這家 MLCC 製造商對全球 AI 供應鏈有多重要這一點而言，我認同他的部位（如果他還持有的話）。","likes":497,"views":288425,"reposts":30,"q":"aleabitoreddit：I didn’t know Leopold was a fellow MLCC bottleneck investor in Taiyo Yuden (6976)\n\nIt’s been disclosed today that Situational Awareness owns 5.99% of the company with a ~ ¥17,446/share avg as of June 29th. \n\nCurrent prices are ¥9,797. \n\nI actually added some today to show support"},{"id":"2087357522093260938","ts":"2026-08-12T01:56:29.000Z","url":"https://x.com/aleabitoreddit/status/2087357522093260938","text":"I didn’t know Leopold was a fellow MLCC bottleneck investor in Taiyo Yuden (6976)\n\nIt’s been disclosed today that Situational Awareness owns 5.99% of the company with a ~ ¥17,446/share avg as of June 29th. \n\nCurrent prices are ¥9,797. \n\nI actually added some today to show support since Taiyo Yuden is one of the largest % MLCC manufacturers globally.","zh":"我不知道原來 Leopold 也是太陽誘電（6976）的 MLCC 瓶頸投資同好。\n\n今天揭露的資料顯示，截至 6 月 29 日，Situational Awareness 持有該公司 5.99% 的股份，平均成本約每股 17,446 日圓。\n\n目前股價是 9,797 日圓。\n\n我今天實際上有加碼一些以示支持，因為太陽誘電是全球 MLCC 市佔率最高的製造商之一。","likes":1003,"views":404042,"reposts":68,"q":null},{"id":"2087345398130282801","ts":"2026-08-12T01:08:18.000Z","url":"https://x.com/aleabitoreddit/status/2087345398130282801","text":"Bro Charles the $SMCI CEO needs to become a politician.\n\nI’ve never seen a guy dodge so many questions on a Q&A earnings transcript before.\n\n- “what’s your 2027 gross margins”\n\nA: “we look forward to growing them\n\n- “do you anticipate margins to improve September?”\n\nA: September. Which is September?","zh":"$SMCI 的執行長 Charles 應該去當政治人物。\n\n我從沒看過有人在法說會 Q&A 上閃避這麼多問題。\n\n-「你們 2027 年的毛利率是多少？」\n答：「我們很期待讓它成長」\n\n-「你們預期 9 月的利潤率會改善嗎？」\n答：九月。哪個九月？","likes":907,"views":169094,"reposts":20,"q":null},{"id":"2087329770879197549","ts":"2026-08-12T00:06:12.000Z","url":"https://x.com/aleabitoreddit/status/2087329770879197549","text":"$LITE earnings transcript TLDRs:\n\n- \"Our visibility into the timing of CPO scale-up deployments has also sharpened. We remain confident in a demand ramp for our ultra-high-power  laser chips in the second half of calendar 2027\"\n\nH2 2027 start of CPO scale up ramp confirmed from Lumentum for their lead customer. \n\n- \"We were recently given our first external light source, or ELS, module purchase for delivery by the second half of calendar 2027\" \n\nELS industry ramp timelines\n\n- \"The NPO opportunity is completely additive for us, significantly increasing the optical TAM.\"\n\nMore TAM for laser chokepoint club\n\n- \"we expect the 1.6T transceiver uptake to intensify starting in fiscal Q1 and sustain through calendar 2027.\"\n\n- \"Even in CW, we’ve been surprised at our ability to price up\"\n\nPositive pricing power for $SIVE and the other CW laser players. \n\n- \"As a result, we are able to command a nice price premium that we expect  to sustain, as these Chinese if these Chinese guys come online. \n\nI caution people also, I think people are some of these Chinese laser suppliers are not delivering in the market today, so they have there is no recourse when they throw out these big numbers. We have not seen anything like that to date in terms of their output.\"\n\nChinese players are more behind than markets expect, corroborated by $AAOI and $LITE. \n\n- \"We are way behind in our shipments, unfortunately, on high-powered lasers\"\n\n\"The demand signal has increased, and we are very much further behind relative to our ability to supply.\"\n\nExtreme demand imbalance for UHP CW laser capacity, continued demand imbalance for EML. Shipping roughly +$50M year end -> $100m+ (\"triple digit quarter\") into much larger H2 2027 and 2028 scale up demand,.\n\n- \"So what we are trying to do, I think, really in the last three months is secure even more substrate supply\" (because of demand imbalance), \"we found additional substrate help from $AXTI They are a great partner.\"\n\nHello InP substrate bottleneck. \n\nTLDR:\n\n- Lumentum CPO scale up H2 2027 shipments got confirmed, dismissed any \"delay\" news as market \"noise\". (one delay report caused so much damage, and it took Nvidia, Lumentum, and all these companies weeks to do damage control). \n- CW lasers demand ramp second half of 2027\n- Extreme demand imbalance for UHP CW laser capacity surprised Lumentum\n- UHP lasers commands very high margins and is able to price up CW laser capacity. \n- China further behind in the laser/capacity angle. \n\nBasically just validated timelines + demand/pricing for Western CW laser players. \n\nCW laser scarcity is already happening before the main volume ramp even begins...","zh":"$LITE 法說逐字稿重點：\n\n-「我們對 CPO（共封裝光學）縱向擴展部署時程的能見度也更清晰了。我們仍有信心，我們的超高功率雷射晶片需求將在 2027 年下半年開始放量」\n\nLumentum 為其主要客戶確認了 CPO 縱向擴展放量將於 2027 下半年開始。\n\n-「我們近期收到第一筆外部光源（ELS）模組採購訂單，交期為 2027 年下半年」\n\nELS 的產業放量時程。\n\n-「NPO（近封裝光學）的機會對我們而言是完全額外增加的，大幅提高了光學 TAM（總潛在市場）。」\n\n雷射咽喉點俱樂部又多了 TAM。\n\n-「我們預期 1.6T 收發模組的採用將從財年第一季開始加速，並延續整個 2027 年。」\n\n-「即使在 CW（連續波）上，我們也很意外自己居然能夠漲價」\n\n這對 $SIVE 與其他 CW 雷射業者是正面的定價能力訊號。\n\n-「因此，我們得以取得不錯的價格溢價，而且我們預期即使這些中國業者上線後，這個溢價仍能維持。\n\n我也要提醒大家，我認為有些中國雷射供應商今天根本沒有在市場上實際交貨，所以他們喊出那些大數字時是不必負責的。到目前為止，我們在他們的產出上完全沒看到那樣的東西。」\n\n中國業者比市場預期的落後更多，這點被 $AAOI 和 $LITE 同時佐證。\n\n-「很遺憾，我們在高功率雷射的出貨上嚴重落後」\n\n「需求訊號變強了，而我們相對於自身的供應能力，落後的幅度大很多。」\n\nUHP CW 雷射產能出現極端的需求失衡，EML 的需求失衡也持續存在。年底出貨規模約 5,000 萬美元以上，接著突破 1 億美元（「三位數的一季」），再進入 2027 下半年與 2028 年大得多的縱向擴展需求。\n\n-「所以我認為我們過去三個月真正在做的事，是設法鎖定更多的基板供應」（因為需求失衡），「我們從 $AXTI 找到了額外的基板支援，他們是很棒的合作夥伴。」\n\nInP 基板瓶頸現身。\n\n總結：\n\n- Lumentum 確認 CPO 縱向擴展將於 2027 下半年出貨，並把任何「延遲」新聞斥為市場「雜訊」。（一篇延遲報導造成這麼大的傷害，害 Nvidia、Lumentum 和這些公司花了好幾週做危機處理。）\n- CW 雷射需求在 2027 下半年放量\n- UHP CW 雷射產能的極端需求失衡讓 Lumentum 自己都感到意外\n- UHP 雷射享有非常高的利潤率，而且能夠替 CW 雷射產能調漲價格\n- 中國在雷射／產能這一塊落後更多\n\n基本上就是驗證了西方 CW 雷射業者的時程、需求與定價。\n\n而在主要的放量都還沒開始之前，CW 雷射的稀缺就已經發生了⋯⋯","likes":730,"views":215639,"reposts":64,"q":"aleabitoreddit：$LITE earnings are out, very strong earnings:\n\nRevenue: $1.01B, +24.5% Q/Q, +109.3% Y/Y growth\nvs. ~$984.6M\nAdj. EPS: $3.23 vs. ~$2.95\nGross Margin (non-gaap): 50.4% / Operating margin (non-gaap) 36.6%\n\nQ1 FY2027 guidance is probably more important:\n\nRevenue: $1.225–1.275B vs. ~$"},{"id":"2087285356999958663","ts":"2026-08-11T21:09:43.000Z","url":"https://x.com/aleabitoreddit/status/2087285356999958663","text":"Insane earnings today for the AI theme with $CRWV, $SMCI, and $LITE. \n\nCoreweave: Absurd ~$104B+ backlog, which doesn't include $25B+ of new customer agreements added in early Q3. \n\nCompute demand read through for Neoclouds is enormous (For Nebius, Iren and others)\n\nSupermicro:  Absurd $65-72B in revenue guidance, adding $60B+ in new orders... \n\nAI DC buildout read through is just enormous. \n\nLumentum: $808M -> $1.01B -> $1.25B revenue ramp, with operating margins growing quarter after quarter. \n\nPhotonics players just keeps printing. \n\nTLDR: Every layer of the AI buildout goes brrrrr, and it's showing up in earnings.","zh":"今天 $CRWV、$SMCI 和 $LITE 對 AI 主題來說都是誇張的財報。\n\nCoreweave：在手訂單高達約 1,040 億美元以上，而且這還不包括第三季初新增的 250 億美元以上新客戶合約。\n\n對 neocloud（新型雲端算力商）而言，這個算力需求讀數非常驚人（對 Nebius、Iren 等公司也是）。\n\nSupermicro：650-720 億美元的營收財測、新增超過 600 億美元訂單⋯⋯\n\nAI 資料中心建置的讀數同樣驚人。\n\nLumentum：營收 8.08 億 → 10.1 億 → 12.5 億美元一路爬升，營益率還一季比一季高。\n\n光子業者根本是在印鈔票。\n\n總結：AI 建置的每一層都在爽爆，而且都反映在財報上了。","likes":1838,"views":290200,"reposts":119,"q":null},{"id":"2087280662802026931","ts":"2026-08-11T20:51:04.000Z","url":"https://x.com/aleabitoreddit/status/2087280662802026931","text":"$SMCI 2027 guidance was actually unholy: $65-$72 billion FY 2027 revenue guidance... \n\nvs. ~$52.4B expected, a casual +$16.1B above consensus. \n\nSMCI logged a massive $60B+ in news order from this earnings. \n\nThat timeline is also interesting when they announced a plan to co-build $SPCX + xAI  DCs \"within a year\" back in June..\n\nBut if SMCI sustain 10-15% gross margins off that ~$70B revenue guidance... I think there's a lot of room for rerating given MC is ~$20B (NFA, I have short term positions in SMCI now from this ER). \n\nMost important thing is learning about 2027 margins from call today.","zh":"$SMCI 的 2027 財測簡直不聖潔：2027 財年營收財測 650-720 億美元⋯⋯\n\n相較於市場預期的約 524 億美元，輕鬆高出共識 161 億美元。\n\nSMCI 在這次財報中登錄了超過 600 億美元的新訂單。\n\n這個時間點也很有意思，因為他們在 6 月曾宣布計畫「一年內」與 $SPCX 加 xAI 共同建置資料中心。\n\n但如果 SMCI 能在那個約 700 億美元的營收財測上維持 10-15% 的毛利率⋯⋯我認為以目前約 200 億美元的市值來說，重新評價的空間很大（非投資建議，我在這次財報後建立了 SMCI 的短線部位）。\n\n最重要的是從今天的法說會上了解 2027 年的利潤率。","likes":594,"views":170486,"reposts":41,"q":null},{"id":"2087271842696593764","ts":"2026-08-11T20:16:01.000Z","url":"https://x.com/aleabitoreddit/status/2087271842696593764","text":"$LITE earnings are out, very strong earnings:\n\nRevenue: $1.01B, +24.5% Q/Q, +109.3% Y/Y growth\nvs. ~$984.6M\nAdj. EPS: $3.23 vs. ~$2.95\nGross Margin (non-gaap): 50.4% / Operating margin (non-gaap) 36.6%\n\nQ1 FY2027 guidance is probably more important:\n\nRevenue: $1.225–1.275B vs. ~$1.16B\nAdj. EPS: $4.05–4.35 vs. ~$3.63\nOperating margin (non-gaap) of 39.5% - 40.5%\n\nIn terms of notes: \n\nSees: \"Increasing demand for ultra-high-power CPO lasers, an initial order for ELS modules\" \n\n- Great read through on other CPO players like $SIVEF, $COHR, and others. (maybe not AAOI since they're missing out on first-gen deployments)\n\n- \"Breath of NPO engagements are the first signs that optics are starting  to penetrate in-rack connectivity, significantly upping our optical TAM\"\n \n- Revenue projections \"reaching our target model more than a quarter ahead of schedule.\"\n\nExtremely strong earnings as expected, you have revenue going from:\n\n$808M -> $1.01B -> $1.25B while operating margin keeps increasing... Just my first impressions. \n\nMost important thing is the earnings call coming up soon.","zh":"$LITE 財報出爐，非常強勁：\n\n營收：10.1 億美元，季增 24.5%、年增 109.3%\nvs 預期約 9.846 億美元\n調整後 EPS：3.23 美元 vs 預期約 2.95 美元\n毛利率（非 GAAP）：50.4%／營益率（非 GAAP）36.6%\n\n2027 財年第一季的財測可能更重要：\n\n營收：12.25-12.75 億美元 vs 預期約 11.6 億美元\n調整後 EPS：4.05-4.35 美元 vs 預期約 3.63 美元\n營益率（非 GAAP）39.5%-40.5%\n\n一些筆記：\n\n看到：「超高功率 CPO 雷射需求增加，以及 ELS 模組的首張訂單」\n\n- 這對 $SIVEF、$COHR 等其他 CPO 玩家是很好的讀數。（可能不包括 AAOI，因為他們缺席第一代部署）\n\n-「NPO（近封裝光學）合作的廣度，是光學開始滲透到機櫃內連接的第一個跡象，這大幅提高了我們的光學 TAM（總潛在市場）」\n\n- 營收預估「比原訂進度提前超過一季達到我們的目標模型」。\n\n如預期般極為強勁的財報，營收一路從：\n\n8.08 億 → 10.1 億 → 12.5 億美元，而營益率還在持續上升⋯⋯以上只是我的第一印象。\n\n最重要的還是即將登場的法說會。","likes":1346,"views":419980,"reposts":92,"q":null},{"id":"2087249406638862506","ts":"2026-08-11T18:46:52.000Z","url":"https://x.com/aleabitoreddit/status/2087249406638862506","text":"Just putting it out there for people that think AAOI is a one year cycle...\n\n$AAOI projects their ELSFP capacity for CPO to be 400K/units a month in 2028.\n\n400k * ~$400 ELS ASP (GS assumptions) = + another ~$1.92B 2028 annualized revenue capacity added as a new distinct (>50% gross margin) product line. \n\nOn top of their existing 2027 projections (eg. ~$5.6B annualized transceiver revenue off $471m/month entering H2). \n\nTAM for 1.6T also goes brrr so I'd expect their end of H2 2027 projections to go up as more capacity comes online... \n\nFor certain optical names, it's one cycle (eg. 1.6T, CPO scale out/up, NPO etc. ), stacked on top of one another... stacked on top of another...  with TAM + margins stacking like minions after Anivia uses W in line. \n\nRather than one-and-done off of one year. \n\nThis is a stark contrast to some other sectors where growth is likely to decelerate after maybe 1 year of triple digit Y/Y revenue growth.","zh":"給那些認為 AAOI 只是一年循環的人：\n\n$AAOI 預估他們用於 CPO（共封裝光學）的 ELSFP 產能，在 2028 年將達到每月 40 萬套。\n\n40 萬 × 約 400 美元的 ELS 售價（高盛假設）＝ 2028 年再增加約 19.2 億美元的年化營收產能，而且是一條全新、獨立的產品線（毛利率超過 50%）。\n\n這還是疊加在他們既有的 2027 年預估之上（例如進入下半年後以每月 4.71 億美元計算，年化約 56 億美元的收發模組營收）。\n\n1.6T 的 TAM（總潛在市場）也在爽爆，所以我預期隨著更多產能上線，他們 2027 下半年底的預估還會往上調⋯⋯\n\n對某些光通訊個股而言，這是一個循環（例如 1.6T、CPO 橫向／縱向擴展、NPO 等等）疊在另一個循環上⋯⋯再疊上另一個⋯⋯TAM 加上利潤率就這樣一層層堆疊上去。\n\n而不是靠某一年就一次性結束。\n\n這跟某些板塊形成強烈對比——那些板塊在大概一年的三位數年增率之後，成長很可能就開始減速了。","likes":1138,"views":193601,"reposts":65,"q":null},{"id":"2087030220213870632","ts":"2026-08-11T04:15:54.000Z","url":"https://x.com/aleabitoreddit/status/2087030220213870632","text":"Holy... We've reached 1,000,000 followers! \n\nIt's genuinely incredible that so many people care to read about my ideas around AI chokepoints and bottlenecks.\n\nFrom substrates, lasers, actuators, memory, power to some of the most niche parts of upstream supply chains.\n\nI've had a lot of fun sharing free thoughts I've come across along the way and tracking whether they get validated over time. \n\nA lot worked out, some haven't, and some are still playing out!\n\nBut honestly, all of this attention has come as a massive surprise to me this year, especially globally, from Sweden, Japan, Korea, to China. \n\nThank you for all your support! I'll be announcing something soon to celebrate.","zh":"天啊⋯⋯我們的追蹤者突破 1,000,000 人了！\n\n真的很不可思議，居然有這麼多人願意讀我對 AI 咽喉點與瓶頸的想法。\n\n從基板、雷射、致動器、記憶體、電力，一直到上游供應鏈裡最冷門的角落。\n\n這一路上免費分享我遇到的各種想法，並追蹤它們是否隨時間被驗證，真的很有樂趣。\n\n很多後來成真了，有些沒有，還有一些仍在發展中！\n\n但老實說，今年獲得的這些關注完全出乎我的意料，尤其是來自全球各地——瑞典、日本、韓國到中國。\n\n謝謝大家的支持！我很快會宣布一些事情來慶祝。","likes":2949,"views":456274,"reposts":47,"q":"aleabitoreddit：We're almost there..."},{"id":"2087021031320072235","ts":"2026-08-11T03:39:23.000Z","url":"https://x.com/aleabitoreddit/status/2087021031320072235","text":"We're almost there...","zh":"我們快到了⋯⋯","likes":1116,"views":803886,"reposts":15,"q":null},{"id":"2087000954742927390","ts":"2026-08-11T02:19:36.000Z","url":"https://x.com/aleabitoreddit/status/2087000954742927390","text":"uhhh... the Unitree IPO is more than 8000 times oversubscribed by retail investors. \n\nThe demand for pure play humanoid companies is absolutely enormous?\n\nI'm personally in the US-based Agility Robotics club (Softbank, $NVDA, $AMZN, Foxconn, etc), at $2.5B premoney via $CCXI. \n\nAnd my take is that Unitree likely opening at $30B+ (from pre-ipo perps), might bring the leading US players some more attention in a week or two. \n\nRegardless that's just absurd demand.","zh":"呃⋯⋯宇樹的 IPO 被散戶超額認購超過 8,000 倍。\n\n市場對純人形機器人公司的需求也太誇張了？\n\n我個人是美國 Agility Robotics 陣營的（軟銀、$NVDA、$AMZN、富士康等都有投資），透過 $CCXI 以 25 億美元的投前估值參與。\n\n我的看法是，宇樹很可能會以 300 億美元以上開出（從 IPO 前的永續合約推算），這也許會在一兩週內為美國的領導業者帶來更多關注。\n\n無論如何，那個需求真的很誇張。","likes":1230,"views":277789,"reposts":78,"q":null},{"id":"2086988264448409739","ts":"2026-08-11T01:29:11.000Z","url":"https://x.com/aleabitoreddit/status/2086988264448409739","text":"Woah, $RIOT announced a $9.1B deal with Anthropic, with a possible contract extending to $16.1B, over 20Y.\n\n$AMD also exercised its option to expand its existing deal with Riot. (And they still have another 1 GW campus they have LOI with for a tenant)\n\nIn terms of timelines, seem like most of the Colo basket have their revenue inflections hit H2 2027? \n\n(Eg. Riot Anthropic deal targets Dec 2027 for first 96 MW, AMD full 50 MW - May 2027)\n\nIt’s cute to see all the former miners like $IREN and co. grow up.","zh":"哇，$RIOT 宣布與 Anthropic 簽下 91 億美元的合約，並可能延長至 161 億美元，為期 20 年。\n\n$AMD 也行使了選擇權，擴大與 Riot 的既有合約。（而且他們還有另一座 1GW 園區已與租戶簽署意向書）\n\n就時程而言，看起來大部分代管業者的營收轉折點都落在 2027 下半年？\n\n（例如 Riot 與 Anthropic 的合約，首批 96MW 目標是 2027 年 12 月，AMD 完整的 50MW 則是 2027 年 5 月）\n\n看著 $IREN 這些以前的礦工們長大成人，還滿可愛的。","likes":802,"views":235951,"reposts":38,"q":null},{"id":"2086840511164514742","ts":"2026-08-10T15:42:04.000Z","url":"https://x.com/aleabitoreddit/status/2086840511164514742","text":"Be Barrons:\n\n- Wants to write about optical supply supply chains like $AAOI\n\n- Hiring DPT: who needs engineers to write about this something this simple?  Let’s find underpaid political philosophy backgrounds.\n\n- proceeds to find a new hire from nonprofit communication consulting\n\n- first day on job: gets paid to model revenue ramp/margins projections, CW laser bottlenecks, internal capacity\n\n- New hire: “I don’t understand this sht”, “looks like a memestock”\n\nBarrons: “Memestock? looks like our next article, I don’t understand either”.","zh":"扮演《巴倫周刊》：\n\n- 想寫一篇關於 $AAOI 這類光通訊供應鏈的報導\n- 招募部門：這麼簡單的東西誰需要工程師來寫？我們找個薪水低的政治哲學背景來就好\n- 於是從非營利組織的溝通顧問業找了個新人\n- 上工第一天：領薪水去模擬營收爬坡／利潤率預估、CW 雷射瓶頸、內部產能\n- 新人：「我完全看不懂這鬼東西」、「看起來像迷因股」\n\n《巴倫周刊》：「迷因股？聽起來就是我們下一篇報導的標題，反正我也看不懂。」","likes":991,"views":277020,"reposts":40,"q":null},{"id":"2086730782425727183","ts":"2026-08-10T08:26:02.000Z","url":"https://x.com/aleabitoreddit/status/2086730782425727183","text":"Now that markets are hosting a laser party again from $SIVE, OE Solutions, $LITE, Coherent, to $AAOI.\n\nThere’s a pretty interesting study:\n\nBoth from Fidelity and a UC Berkeley research paper, that the best investors are the ones who either…\n\n- Anecdotally forgot about their account (Fidelity)\n- Didn’t actively trade/overtrade (18.5% return from infrequent traders vs. 11.4%).\n\nNot any advice, but some of these anecdotes might be helpful to retail to read in general…\n\nSince I witnessed a lot capitulation off memory, photonics, or thematic volatility, just for retail not have positions on a sharp recovery.\n\nHaving conviction also usually people in that “not overtrading” camp, since it helps to not overtrade in drops or see opportunities to cost average.","zh":"現在市場又在開雷射派對了，從 $SIVE、OE Solutions、$LITE、Coherent 到 $AAOI。\n\n有個滿有意思的研究：\n\n來自 Fidelity 和一篇柏克萊的研究論文都指出，最厲害的投資人是那些⋯⋯\n\n- 據說根本忘記自己有這個帳戶的人（Fidelity）\n- 沒有頻繁交易／過度交易的人（低頻交易者報酬率 18.5%，相對於 11.4%）。\n\n這不是什麼建議，但這些軼事對一般散戶來說可能有點幫助⋯⋯\n\n因為我看到很多人在記憶體、光子或主題性波動中投降，結果在急速反彈時手上根本沒有部位。\n\n有信心的人通常也屬於「不過度交易」的那一類，因為這有助於你在下跌時不亂動，或是看見逢低攤平的機會。","likes":1372,"views":315469,"reposts":85,"q":null},{"id":"2086634510935118161","ts":"2026-08-10T02:03:29.000Z","url":"https://x.com/aleabitoreddit/status/2086634510935118161","text":"Just some near term events:\n\n- OCP APAC tomorrow (Ayar, Lightmatter, $AMD, $NVDA) and your CPO players are giving announcements/updates.\n\nThis should be a catalyst for certain optical players.\n\n- Earnings week: with $ASTS, $RKLB reporting today (space), $LITE on Tuesday (photonics), $NBIS in the middle of the week (Neocloud), and more.\n\n- Unitree IPO subscriptions opened up today and Listing is expected this month.\n\nShould be a potential catalyst for the humanoid + robotics sector if it opens up well eg. $CCXI.\n\nFun week ahead.","zh":"一些近期事件：\n\n- 明天是 OCP APAC（Ayar、Lightmatter、$AMD、$NVDA），你的 CPO（共封裝光學）玩家們會有發表／更新。這對某些光通訊業者應該會是催化劑。\n\n- 財報週：今天是 $ASTS、$RKLB（太空），週二是 $LITE（光子），週中是 $NBIS（neocloud 新型雲端算力商），還有更多。\n\n- 宇樹的 IPO 今天開放認購，預計本月掛牌。如果開盤表現好，對人形機器人與機器人板塊會是潛在催化劑，例如 $CCXI。\n\n這週會很有趣。","likes":1123,"views":325400,"reposts":61,"q":null},{"id":"2086304269943419276","ts":"2026-08-09T04:11:14.000Z","url":"https://x.com/aleabitoreddit/status/2086304269943419276","text":"All right chat, it’s that time of the month again.\n\nWhat’s your #1 highest conviction stock and why? \n\nI actually learn a lot from reading these, so share some cool ideas.","zh":"好了各位，又到了每個月的這個時候。\n\n你信心最高的第一名股票是什麼？為什麼？\n\n我其實從讀這些回覆裡學到很多，分享一些有趣的想法吧。","likes":2603,"views":973402,"reposts":102,"q":null},{"id":"2086247069900300393","ts":"2026-08-09T00:23:56.000Z","url":"https://x.com/aleabitoreddit/status/2086247069900300393","text":"I think it’s a good time to revisit $SIVE ~$427m/yr midpoint capacity revenue modeled projections.\n\nGiven recent industry earnings:\n\n> $AAOI cited +20-40% demand imbalance for transceivers (with lasers as the bottleneck).\n\n> $MTSI saying many \"Customers are coming to us with urgency due to the general supply shortage of indium phosphide DFB lasers\" (in other product lines)\n\n> US proposal ban on new Chinese optical transceivers (Innolight/Eoptolink)\n\n> AOI no meaningful participation in first-gen CPO deployments due to lasers being allocated toward transceivers. \n\nThe read through is that it’s possible to apply the same capacity-demand absorption modeling applying to $AAOI, but for other laser players like Sivers too.\n\nGiven the widespread shortage and demand imbalance for InP CW DFB capacity.","zh":"我覺得現在是重新檢視 $SIVE 那個年營收約 4.27 億美元中位數產能預估模型的好時機。\n\n考量到近期的產業財報：\n\n> $AAOI 提到收發模組有 20-40% 的需求失衡（雷射是瓶頸）。\n\n> $MTSI 說很多「客戶因為磷化銦 DFB 雷射普遍短缺而帶著急迫性找上我們」（在其他產品線上）\n\n> 美國提案禁止新的中國光收發模組（中際旭創／新易盛）\n\n> AOI 因雷射產能都被配去做收發模組，而未實質參與第一代 CPO 部署。\n\n這些的讀數是：那套套用在 $AAOI 身上的產能—需求吸收模型，也有可能套用在 Sivers 這類其他雷射業者身上。\n\n畢竟 InP CW DFB 產能正處於全面短缺與需求失衡的狀態。","likes":1355,"views":533038,"reposts":92,"q":"aleabitoreddit：Lot of people were curious about $SIVE capacity volume ramp modeling through fab-light (Win Semi + others):\n\nUsing 10% of Win's wafer capacity as a low-end allocation (65% yield assumption, $50-$75 ASP):\n\nSivers would support $341-$512M worth of annual array revenue. Given upper "},{"id":"2086157318065168490","ts":"2026-08-08T18:27:18.000Z","url":"https://x.com/aleabitoreddit/status/2086157318065168490","text":"Today I'm writing a weekend guide on how to do DD when shorting $NBIS:\n\nFirst, you look at hyperscaler earnings for AI cloud read through: \n\n> $GOOGL: reports record AI cloud demand + backlog + margin increases from earnings\n\n> $AMZN: reports record AI Cloud demand + backlog + margin increases from earnings\n\n> $META: reports higher than expected prices for available capacity from earnings.\n\nNow, time to look at Nebius:\n\n-> $NBIS: Growing hundreds of percent to $7-9B ARR by Q4. Growing margins, and guided 4GW+ contracted power. \n-> Sees Uber/Waymo splitting, putting more focus on Avride\n-> Sees Clickhouse growing rapidly every quarter. \n\nOkay looks bad! But next, you need a hedge?\n\n-> Wow! A $NIKE brand executive, after the stock dropped 75% over the past 5 years, went to $LULU to save that brand next? Lululemon seems good.\n\nConclusion: Short Nebius and go long on $LULU","zh":"今天我要寫一份週末指南，教大家放空 $NBIS 前該怎麼做 DD（盡職調查）：\n\n首先，你要看超大規模業者的財報，判讀 AI 雲端的狀況：\n\n> $GOOGL：財報顯示 AI 雲端需求、在手訂單、利潤率全創新高\n\n> $AMZN：財報顯示 AI 雲端需求、在手訂單、利潤率全創新高\n\n> $META：財報顯示可用產能的報價高於預期。\n\n好，現在來看 Nebius：\n\n→ $NBIS：成長數百個百分點，第四季 ARR（年化經常性收入）上看 70-90 億美元。利潤率提升，並預估簽約電力達 4GW 以上。\n→ 看到 Uber／Waymo 拆夥，讓 Avride 更受關注\n→ 看到 Clickhouse 每一季都在快速成長。\n\n好，看起來很糟！但接下來，你需要一個避險部位？\n\n→ 哇！一位 $NIKE 的品牌高層，在股價過去 5 年跌了 75% 之後，接下來要去 $LULU 拯救那個品牌？Lululemon 看起來不錯。\n\n結論：放空 Nebius，然後做多 $LULU。\n\n（以上為反諷）","likes":2735,"views":604956,"reposts":146,"q":null},{"id":"2086148557187461412","ts":"2026-08-08T17:52:29.000Z","url":"https://x.com/aleabitoreddit/status/2086148557187461412","text":"Yes, I'm still bullish on memory like $MU / Samsung.\n\nAs I said earlier, markets tend to rotate from bottleneck to bottleneck.\n\nThis week it looks $AXTI to $LITE in the photonics sector is the focus again. \n\nThe thing is... the primary thing that changed are the stock prices, followed by some narratives + updates sprinkled in here and there.\n\nFor photonics:\n\n> We already knew $COHR / $LITE lasers were completely sold out for the next 2 years during July's drop. \n\n> We knew about demand imbalance from $AAOI from last quarter's earnings calls.\n\nNothing deteriorated fundamentally during July's crash, other than listed price after liquidations. \n\nYet tons of people called $AAOI a \"scam\" when it dropped to $75, or $AXTI a \"scam\" on its drop to $35... \n\nBut are bullish again at $140 or $80, when the transciver/InP substrate bottleneck hasn't changed at all, but maybe even got worse... (eg. draft for US ban on new china optical transceivers, scale up demand projections)\n\nFor Memory:\n\nI'm witnessing a lot of retail capitulation, but the same people I'm seeing were mega bullish after $MU signed 16 SCAs and gave exceptional projections a month ago. \n\nOr were celebrating Samsung having the highest operating profit in the world.\n\nThere's updates here and there eg. Rubin Ultra with memory optimizations (which Nvidia strives for every generation), with prices no longer being hiked way above expectations to the extreme. \n\nBut the operating income relative to MC is just absurd around current prices, especially memory becomes structural. \n\nAnd the demand imbalance should be even worse next year.  \n\nPeople tend to capitulate and follow narratives when a sector drops (eg. Helium/LNG back in Iran war), even if the bottleneck or fundamental situation hasn't really changed much (eg. $SPCX Elon earnings call reiterating memory tightness). \n\nI can't tell others what to to do: \n\nBut $AAOI at $140 and $AAOI at $75 are the same company.\n\nSamsung at a $1.5T MC and Samsung at a $980B MC are the same company. \n\nJust valuations and narratives (often noise) change, and markets rotate from sector to sector.","zh":"是的，我對 $MU／三星這類記憶體股仍然看多。\n\n如同我先前說過的，市場傾向在一個又一個瓶頸之間輪動。\n\n這週看起來焦點又回到光子板塊的 $AXTI 到 $LITE 身上。\n\n問題是⋯⋯真正改變的東西只有股價，其次才是一些零星穿插的敘事與更新。\n\n光子方面：\n\n> 早在 7 月下跌時，我們就已經知道 $COHR／$LITE 的雷射未來兩年完全售罄。\n\n> 我們從上一季的法說會就知道 $AAOI 的需求失衡狀況。\n\n7 月崩盤期間，除了清算後的掛牌價格之外，基本面沒有任何惡化。\n\n然而當 $AAOI 跌到 75 美元時一堆人罵它「騙局」，$AXTI 跌到 35 美元時也被罵「騙局」⋯⋯\n\n但到了 140 美元或 80 美元時又轉為看多，而收發模組／InP 基板的瓶頸根本完全沒變，甚至可能還更嚴重了⋯⋯（例如美國草擬禁止新的中國光收發模組、縱向擴展的需求預估）\n\n記憶體方面：\n\n我看到很多散戶投降，但我看到的那些人，一個月前在 $MU 簽下 16 份長約並給出優異財測後，可是超級看多的。\n\n或是在慶祝三星拿下全球最高的營業利益。\n\n這裡那裡是有一些更新，例如 Rubin Ultra 帶有記憶體最佳化（這是 Nvidia 每一代都在追求的事），價格不再像先前那樣被極端地拉到遠高於預期。\n\n但以目前價位而言，營業利益相對市值的比例根本荒謬，尤其是在記憶體變成結構性需求的情況下。\n\n而且明年的需求失衡應該會更嚴重。\n\n每當一個板塊下跌，人們就傾向投降並跟隨敘事（例如伊朗戰爭時的氦氣／LNG），即使瓶頸或基本面狀況其實沒什麼改變（例如 $SPCX 的 Elon 在法說會上重申記憶體吃緊）。\n\n我沒辦法告訴別人該怎麼做：\n\n但 140 美元的 $AAOI 和 75 美元的 $AAOI 是同一家公司。\n\n1.5 兆美元市值的三星和 9,800 億美元市值的三星也是同一家公司。\n\n改變的只是估值與敘事（通常是雜訊），而市場只是在板塊之間輪動而已。","likes":3076,"views":841716,"reposts":239,"q":"KostasMoschovas：@aleabitoreddit Serenity, are you still bullish on memory and storage stocks?"},{"id":"2085974141501612461","ts":"2026-08-08T06:19:25.000Z","url":"https://x.com/aleabitoreddit/status/2085974141501612461","text":"I've mapped the entire Wall Street bear playbook on AI names:\n\nHave your favorite institution/media insert one of these name down below:\n\n1. < ______ [GPUs, Transcivers, MLCC, Memory...] are a commodity set to crash> \n\n2. < ______ [YMTC, CXMT, Dongshan...] from China will flood the market > \n\n3. < ______ [Micron, Nvidia, ...] from unverifiable channel checks is facing issues > \n\n4. < ______ [Kospi, Sivers, ...] is a bubble like the ____ [2007, 2021] crash> \n\n5. <____ [1,2,3, ...] unexpected rate hikes this year>\n\n6. < _____ [Google, Nvidia, Deepseek ...] optimization removes the need of this!>  \n\nin a new headline, and it's ready to go!","zh":"我把華爾街唱衰 AI 個股的整套劇本都畫出來了：\n\n把你最愛的機構／媒體，配上下面任何一個名詞：\n\n1. <______〔GPU、收發模組、MLCC、記憶體⋯⋯〕是大宗商品，即將崩盤>\n\n2. <來自中國的 ______〔長鑫、CXMT、東山⋯⋯〕將會大舉洪水式供應市場>\n\n3. <根據無法查證的通路查訪，______〔美光、Nvidia⋯⋯〕正面臨問題>\n\n4. <______〔韓股、Sivers⋯⋯〕是泡沫，就像 ____〔2007、2021〕年那次崩盤>\n\n5. <今年會有 ____〔1、2、3⋯⋯〕次預期外的升息>\n\n6. <______〔Google、Nvidia、DeepSeek⋯⋯〕的最佳化讓這東西不再被需要！>\n\n放進新的標題裡，就可以直接上了！","likes":1876,"views":550828,"reposts":116,"q":null},{"id":"2085823672569467005","ts":"2026-08-07T20:21:30.000Z","url":"https://x.com/aleabitoreddit/status/2085823672569467005","text":"There we go, White House finally invests in more breath in critical minerals/materials. Amazing policy move, as a TLDR:\n\n- $WWR receives $25M (graphite)\n- $SRL (ASX) receives $400M (Scandium)\n- $FEAM receives $8M (Boron)\n- $HREE receives $4.8M (magnet rare earths)\n\nout of the public companies. \n\nWith more private investments from $150 million into Niron Magnetics or $85 million into Standard Bauxite. \n\nIt's literally spare change to the US gov, for ENORMOUS amount of downstream applications. \n\nMore should be done with funding amounts to accelerate development and derisk supply chains (don't own any of the above, just support the policy move), but great announcement.","zh":"來了，白宮終於對關鍵礦物／材料做出更廣泛的投資。這是很棒的政策舉措，重點整理：\n\n- $WWR 獲得 2,500 萬美元（石墨）\n- $SRL（澳交所）獲得 4 億美元（鈧）\n- $FEAM 獲得 800 萬美元（硼）\n- $HREE 獲得 480 萬美元（磁性稀土）\n\n以上是公開上市公司的部分。\n\n另外還有更多私人投資，例如 1.5 億美元投入 Niron Magnetics、8,500 萬美元投入 Standard Bauxite。\n\n對美國政府來說這根本是零錢，卻能帶來極其龐大的下游應用。\n\n應該投入更多資金來加速發展、降低供應鏈風險（以上這些我都沒持有，只是支持這個政策方向），但這仍是很棒的公告。","likes":1202,"views":332466,"reposts":108,"q":null},{"id":"2085711500875116887","ts":"2026-08-07T12:55:47.000Z","url":"https://x.com/aleabitoreddit/status/2085711500875116887","text":"Some more TLDR takeaways from $AAOI ER:\n\n- They also flagged DSP and TIA bottlenecks, which is a positive industry read through for names like $MXL, then $SMTC and $MTSI. \n\n- For revenue growth, they're expecting more than $500 million revenue Q4, which is absurd growth. \n\nFor reference:\nQ2: $191.9M\nQ3: ~$255M-$290M\nQ4: $500M+\nBy mid-2027: ~$1.41B quarterly revenue run-rate\n\nAlways impressed by the revenue ramp from some of these optical players.","zh":"$AAOI 財報的更多重點：\n\n- 他們也點出了 DSP 與 TIA 的瓶頸，這對 $MXL，以及 $SMTC、$MTSI 這類公司是正面的產業讀數。\n\n- 營收成長方面，他們預期第四季營收超過 5 億美元，這個成長幅度誇張。\n\n作為對照：\n第二季：1.919 億美元\n第三季：約 2.55-2.90 億美元\n第四季：5 億美元以上\n2027 年年中：約 14.1 億美元的季營收年化水準\n\n這些光通訊業者的營收爬坡總是讓我印象深刻。","likes":982,"views":402428,"reposts":71,"q":"aleabitoreddit：Wow, there's gem after gem in $AAOI earnings for $SIVE + other laser player readthrough.\n\n1. AAOI not meaningfully participating in CPO first-gen deployments.\n\n\"We just can’t make enough of them [CPO lasers] to be involved in their current first-generation [CPO] deployments becau"},{"id":"2085649654059016387","ts":"2026-08-07T08:50:01.000Z","url":"https://x.com/aleabitoreddit/status/2085649654059016387","text":"I usually make fun of sellside, but Rosenblatt has pretty goated channel checks on optical names, and their reports are one of the few I like talking about. \n\n$AAOI, $LITE, $SIVE, and the laser
